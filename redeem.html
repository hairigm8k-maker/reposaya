<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Join Class · HairiHosting</title><link rel="icon" type="image/png" href="/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400&display=swap" rel="stylesheet"><style>
:root{--bg:#08080a;--card:#040406;--panel:#121317;--border:#1c1d22;--border2:#2e3038;--text:#e2e3e9;--fog:#9194a1;--ash:#5e616e;--copper:#cc9166;--white:#fff;--serif:'Playfair Display',serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(204,145,102,.15) 0%,transparent 60%);pointer-events:none}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;position:relative;z-index:1}
.logo{display:block;width:auto;height:44px;margin:0 auto 24px;filter:brightness(0) invert(1)}
.eyebrow{text-align:center;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--copper);margin-bottom:8px}
h1{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--white);text-align:center;margin-bottom:8px}
.sub{text-align:center;color:var(--fog);font-size:14px;margin-bottom:28px;line-height:1.5}
.field{margin-bottom:16px}
.label{display:block;font-size:13px;color:var(--fog);margin-bottom:8px;font-weight:500}
.input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:12px;padding:13px 16px;font-size:15px;color:var(--white);outline:none;font-family:inherit;transition:border-color .15s;letter-spacing:.02em}
.input:focus{border-color:var(--copper)}
.input::placeholder{color:var(--ash)}
.btn{width:100%;background:var(--copper);color:#000;border:0;padding:15px;border-radius:9999px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:8px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:16px;display:none}
.alert.error{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.3);color:#f87171;display:block}
.alert.success{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);color:#4ade80;display:block}
.back{text-align:center;margin-top:20px;font-size:13px}
.back a{color:var(--copper);text-decoration:none}
.spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style id="layout-fix">
  /* Benarkan page scroll kalau skrin kecil */
  body { height: auto !important; min-height: 100vh !important; overflow-y: auto !important; padding: 20px 0 !important; }
  .hh-auth-wrap { min-height: 100vh; height: auto !important; padding: 20px !important; overflow-y: auto !important; display: flex; align-items: center; justify-content: center; }
  .hh-card { max-height: none !important; margin: auto !important; }
  /* Pastikan error tak tolak content sangat */
  #alertEl { margin-bottom: 15px; }
</style>
</head><body>
<div class="card">
<img class="logo" src="/assets/logoUtama/logoUtama.png" alt="HairiHosting">
<div class="eyebrow">Join Class</div>
<h1>Access Your Free Account</h1>
<p class="sub">Enter your class code and personal token to get started.</p>
<div class="alert" id="alert"></div>
<form id="form">
<div class="field"><label class="label">Class Code</label><input type="text" class="input" id="code" placeholder="AI-JAN-2026-X9K2" autocomplete="off" spellcheck="false" style="text-transform:uppercase"></div>
<div class="field"><label class="label">Your Token</label><input type="text" class="input" id="token" placeholder="hh_tok_xxxxxxxxxxxx" autocomplete="off" spellcheck="false" style="font-family:var(--mono);font-size:13px"></div>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFXYkp4-x-R1aMji" data-theme="dark" style="margin-bottom:12px;display:flex;justify-content:center"></div>
<button type="submit" class="btn" id="btn">Join Class</button>
</form>
<div class="back"><a href="/">← Back to Sign In</a></div>
</div>
<script>
var codeEl=document.getElementById('code'),tokenEl=document.getElementById('token'),btn=document.getElementById('btn'),alertEl=document.getElementById('alert');
function showAlert(msg,type){alertEl.className='alert '+type;alertEl.textContent=msg}
function clearAlert(){alertEl.className='alert';alertEl.textContent=''}
var DEVICE_KEY='hh_class_redeem_'+location.hostname;
if(localStorage.getItem(DEVICE_KEY)){showAlert('This device has already redeemed a token. Please contact the administrator for assistance.','error');btn.disabled=true}
document.getElementById('form').onsubmit=async function(e){
e.preventDefault();clearAlert();
var code=codeEl.value.trim().toUpperCase(),tok=tokenEl.value.trim();
if(!code){showAlert('Enter class code','error');return}
if(!tok){showAlert('Enter your token','error');return}
var tsTok=document.querySelector('[name="cf-turnstile-response"]')?.value||'';
if(!tsTok){showAlert('Tunggu captcha selesai','error');return}
btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Joining...';
try{
var r=await fetch('/api/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({class_code:code,token:tok,turnstile_token:document.querySelector('[name="cf-turnstile-response"]')?.value||''})});
var d=await r.json();
if(d.ok){localStorage.setItem(DEVICE_KEY,'1');showAlert('Success! Redirecting...','success');setTimeout(function(){window.location.href=d.redirect||'/dashboard/'},1000)}
else{showAlert(d.error||'Failed','error');btn.disabled=false;btn.textContent='Join Class'}
}catch(err){showAlert('Connection error','error');btn.disabled=false;btn.textContent='Join Class'}
};
</script><script src="/assets/hh-common.js"></script>

<script id="ux-fix">
  document.addEventListener('DOMContentLoaded', function() {
    var inputs = document.querySelectorAll('input');
    inputs.forEach(function(input) {
      input.addEventListener('input', function() {
        var alertEl = document.getElementById('alertEl');
        if (alertEl && alertEl.style.display !== 'none') {
          alertEl.style.display = 'none';
        }
      });
    });
  });
</script>
</body></html>
