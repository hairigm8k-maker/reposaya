<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HairiHosting — Sign In</title>
<meta name="description" content="HairiHosting — Platform hosting HTML for bisnes Malaysia.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hh-common.css">
</head>
<body>

<div class="hh-auth-wrap">
  <div class="hh-card hh-card-sm">

    <div class="hh-brand">
      <img src="assets/logoUtama/logoUtama.png" alt="HairiHosting" class="hh-brand-logo">
    </div>

    <div class="hh-eyebrow">Sign In</div>
    <h1 class="hh-title">Selamat Back</h1>
    <p class="hh-subtitle">Sign in for urus website you</p>

    <form id="loginForm" autocomplete="on">
      <div class="hh-field">
        <label class="hh-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="hh-input" placeholder="nama@email.com" required autocomplete="email" autofocus>
        <div class="hh-error" id="emailError">Email no sah</div>
      </div>

      <div class="hh-field">
        <label class="hh-label" for="password">Kata Laluan</label>
        <input type="password" id="password" name="password" class="hh-input" placeholder="••••••••" required autocomplete="current-password">
        <div class="hh-error" id="passwordError">Password diperlukan</div>
      </div>

      <button type="submit" class="hh-btn hh-btn-primary" id="submitBtn">
        <span id="btnText">Sign In</span>
      </button>
    </form>

    <div class="hh-link-row">
      <a href="/forgot-password.html" class="hh-link">Forgot password?</a>
      <span class="hh-muted">Akaun dijemput only</span>
    </div>

  </div>
</div>

<div class="hh-toast-wrap" id="toastWrap"></div>

<script src="assets/hh-common.js"></script>
<script>
// Auto-redirect kalau already login
(async () => {
  try {
    const res = await fetch('/api/auth/session');
    const data = await res.json();
    if (data.ok && data.authenticated) {
      window.location.href = '/dashboard/';
    }
  } catch (e) {}
})();
</script>
<script>
const form = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');
const btnText = document.getElementById('btnText');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    HHT.toast('Sila isi semua ruangan', 'error');
    return;
  }

  submitBtn.disabled = true;
  btnText.innerHTML = '<span class="hh-spinner"></span> Sign in...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.ok) {
      HHT.toast('Success log enter', 'success');
      setTimeout(() => {
        window.location.href = data.redirect || '/dashboard/';
      }, 500);
    } else {
      HHT.toast(data.error || 'Sign in failed', 'error');
      submitBtn.disabled = false;
      btnText.textContent = 'Sign In';
    }
  } catch (error) {
    HHT.toast('Error sambungan. Cuba lagi.', 'error');
    submitBtn.disabled = false;
    btnText.textContent = 'Sign In';
  }
});
</script>

</body>
</html>
