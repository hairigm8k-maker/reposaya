<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HairiHosting — Log Masuk</title>
<meta name="description" content="HairiHosting — Platform hosting HTML untuk bisnes Malaysia.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hh-common.css">
</head>
<body>

<div class="hh-auth-wrap">
  <div class="hh-card hh-card-sm">

    <div class="hh-brand">
      <img src="assets/logoUtama/logoUtama.png" alt="HairiHosting" class="hh-brand-logo">
    </div>

    <div class="hh-eyebrow">Log Masuk</div>
    <h1 class="hh-title">Selamat Kembali</h1>
    <p class="hh-subtitle">Log masuk untuk urus website anda</p>

    <form id="loginForm" autocomplete="on">
      <div class="hh-field">
        <label class="hh-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="hh-input" placeholder="nama@email.com" required autocomplete="email" autofocus>
        <div class="hh-error" id="emailError">Email tidak sah</div>
      </div>

      <div class="hh-field">
        <label class="hh-label" for="password">Kata Laluan</label>
        <input type="password" id="password" name="password" class="hh-input" placeholder="••••••••" required autocomplete="current-password">
        <div class="hh-error" id="passwordError">Kata laluan diperlukan</div>
      </div>

      <button type="submit" class="hh-btn hh-btn-primary" id="submitBtn">
        <span id="btnText">Log Masuk</span>
      </button>
    </form>

    <div class="hh-link-row">
      <a href="/forgot-password.html" class="hh-link">Lupa kata laluan?</a>
      <span class="hh-muted">Akaun dijemput sahaja</span>
    </div>

  </div>
</div>

<div class="hh-toast-wrap" id="toastWrap"></div>

<script src="assets/hh-common.js"></script>
<script>
const form = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');
const btnText = document.getElementById('btnText');

// ⚠️ TEMPORARY HARDCODED LOGIN — BUANG BILA BACKEND READY
const TEST_EMAIL = '123@gmail.com';
const TEST_PASS = '123';

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    HHT.toast('Sila isi semua ruangan', 'error');
    return;
  }

  submitBtn.disabled = true;
  btnText.innerHTML = '<span class="hh-spinner"></span> Log masuk...';

  // Simulate delay
  await new Promise(r => setTimeout(r, 800));

  if (email === TEST_EMAIL && password === TEST_PASS) {
    HHT.toast('Berjaya log masuk', 'success');
    localStorage.setItem('hh_user', JSON.stringify({
      email: email,
      name: 'Test User',
      role: 'user'
    }));
    setTimeout(() => {
      window.location.href = '/dashboard/';
    }, 500);
  } else {
    HHT.toast('Email atau kata laluan salah', 'error');
    submitBtn.disabled = false;
    btnText.textContent = 'Log Masuk';
  }
});
</script>

</body>
</html>
