<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing Toggle</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#08080a;color:#e2e3e9;padding:80px 24px}.wrap{max-width:900px;margin:auto}.head{text-align:center;margin-bottom:32px}h2{font-family:'Playfair Display',serif;font-size:clamp(32px,5vw,48px);font-weight:400;color:#fff;margin-bottom:24px}.toggle{display:inline-flex;background:#121317;border:1px solid #1c1d22;border-radius:9999px;padding:4px;margin-bottom:40px}.toggle button{background:transparent;border:0;color:#9194a1;padding:8px 20px;border-radius:9999px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}.toggle button.active{background:#fff;color:#000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#040406;border:1px solid #1c1d22;border-radius:16px;padding:32px}.card h3{font-size:15px;color:#9194a1;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}.price{font-family:'Playfair Display',serif;font-size:48px;color:#fff;margin-bottom:8px;transition:opacity .2s}.price span{font-size:16px;color:#9194a1;font-family:Inter}.desc{font-size:14px;color:#9194a1;margin-bottom:24px}.btn{display:block;text-align:center;padding:13px;border-radius:9999px;text-decoration:none;font-weight:600;font-size:14px;background:#cc9166;color:#000}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h2>Flexible plans</h2><div class="toggle"><button class="active" data-billing="monthly">Monthly</button><button data-billing="yearly">Yearly -20%</button></div></div><div class="grid"><div class="card"><h3>Starter</h3><div class="price" data-monthly="RM19/mo" data-yearly="RM15/mo">RM19<span>/mo</span></div><div class="desc">Untuk individu</div><a href="#" class="btn">Choose Starter</a></div><div class="card"><h3>Pro</h3><div class="price" data-monthly="RM49/mo" data-yearly="RM39/mo">RM49<span>/mo</span></div><div class="desc">Untuk profesional</div><a href="#" class="btn">Choose Pro</a></div></div></div><script>document.querySelectorAll('.toggle button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.toggle button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');var mode=b.dataset.billing;document.querySelectorAll('.price').forEach(function(p){var v=p.dataset[mode];p.style.opacity='0';setTimeout(function(){var parts=v.split('/');p.innerHTML=parts[0]+'<span>/'+parts[1]+'</span>';p.style.opacity='1'},150)})})});</script></body></html>
