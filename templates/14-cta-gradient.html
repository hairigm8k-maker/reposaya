<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTA Gradient</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#08080a;padding:60px 24px;min-height:100vh;display:flex;align-items:center}.wrap{max-width:1000px;margin:auto}.card{background:linear-gradient(135deg,#cc9166 0%,#8b5a3c 40%,#1a1a1f 100%);border-radius:24px;padding:72px 48px;text-align:center;position:relative;overflow:hidden}.card::before{content:'';position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 70%);border-radius:50%}h2{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,44px);font-weight:400;color:#fff;margin-bottom:16px;position:relative}p{color:rgba(255,255,255,.85);font-size:16px;margin-bottom:32px;max-width:520px;margin-left:auto;margin-right:auto;position:relative}.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative}.btn{padding:14px 28px;border-radius:9999px;text-decoration:none;font-weight:600;font-size:14px;transition:transform .2s}.btn:hover{transform:translateY(-2px)}.white{background:#fff;color:#000}.ghost{border:1px solid rgba(255,255,255,.4);color:#fff}.ghost:hover{border-color:#fff}@media(max-width:640px){.card{padding:48px 24px}}</style></head><body><div class="wrap"><div class="card"><h2>Ready to get started?</h2><p>Join thousands of creators building the future of the web. Free forever plan available.</p><div class="btns"><a href="#" class="btn white">Start free</a><a href="#" class="btn ghost">Talk to sales</a></div></div></div></body></html>
