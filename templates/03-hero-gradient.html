<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Gradient</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;min-height:100vh;background:linear-gradient(135deg,#4c1d95 0%,#db2777 50%,#f59e0b 100%);display:flex;align-items:center;justify-content:center;padding:24px;color:#fff}.hero{max-width:800px;text-align:center}h1{font-family:'Playfair Display',serif;font-size:clamp(40px,7vw,72px);font-weight:400;line-height:1.1;margin-bottom:24px;letter-spacing:.01em}p{font-size:18px;color:rgba(255,255,255,.9);line-height:1.6;margin-bottom:32px;max-width:560px;margin-left:auto;margin-right:auto}.btn{display:inline-block;background:#fff;color:#1a1a1a;padding:14px 32px;border-radius:9999px;text-decoration:none;font-weight:600;font-size:15px;transition:transform .2s}.btn:hover{transform:translateY(-2px)}</style></head><body><section class="hero"><h1>Design without limits</h1><p>The toolkit for creators who ship. Beautiful by default, powerful when you need it.</p><a href="#" class="btn">Get started free</a></section></body></html>
