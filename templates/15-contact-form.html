<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#08080a;color:#e2e3e9;padding:80px 24px;min-height:100vh}.wrap{max-width:1000px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}h1{font-family:'Playfair Display',serif;font-size:clamp(32px,5vw,48px);font-weight:400;color:#fff;margin-bottom:20px}p.lead{color:#9194a1;font-size:16px;line-height:1.6;margin-bottom:32px}.info{display:flex;gap:14px;margin-bottom:20px;align-items:flex-start}.ico{width:36px;height:36px;border-radius:10px;background:#121317;border:1px solid #1c1d22;display:flex;align-items:center;justify-content:center;flex-shrink:0}.ico svg{width:16px;height:16px;stroke:#cc9166;fill:none;stroke-width:2}.label{font-size:11px;color:#5e616e;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}.val{color:#c7c9d1;font-size:14px}form{background:#040406;border:1px solid #1c1d22;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#9194a1}input,textarea{background:#08080a;border:1px solid #2e3038;border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}input:focus,textarea:focus{border-color:#cc9166}textarea{resize:vertical;min-height:100px}button{background:#cc9166;color:#000;border:0;padding:14px;border-radius:9999px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;transition:opacity .2s}button:hover{opacity:.9}@media(max-width:768px){.wrap{grid-template-columns:1fr;gap:40px}}</style></head><body><div class="wrap"><div><h1>Get in touch</h1><p class="lead">We would love to hear from you. Fill up the form and we will respond within 24 hours.</p><div class="info"><div class="ico"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><div><div class="label">Email</div><div class="val">hello@example.com</div></div></div><div class="info"><div class="ico"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div><div><div class="label">Phone</div><div class="val">+60 12-345 6789</div></div></div><div class="info"><div class="ico"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div><div><div class="label">Address</div><div class="val">Kuala Lumpur, Malaysia</div></div></div></div><form onsubmit="event.preventDefault();this.querySelector('button').textContent='Sent!';setTimeout(()=>this.querySelector('button').textContent='Send message',1500)"><div class="field"><label>Name</label><input type="text" placeholder="Your name" required></div><div class="field"><label>Email</label><input type="email" placeholder="you@example.com" required></div><div class="field"><label>Message</label><textarea placeholder="How can we help?" required></textarea></div><button type="submit">Send message</button></form></div></body></html>
