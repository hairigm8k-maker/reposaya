<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTA Newsletter</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#08080a;color:#e2e3e9;padding:60px 24px;min-height:100vh;display:flex;align-items:center}.wrap{max-width:1000px;margin:auto}.card{background:#121317;border:1px solid #1c1d22;border-radius:24px;padding:64px 48px;text-align:center;position:relative;overflow:hidden}.glow{position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:500px;height:500px;background:radial-gradient(circle,rgba(204,145,102,.15) 0%,transparent 60%);pointer-events:none}h2{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,44px);font-weight:400;color:#fff;margin-bottom:16px;position:relative}p{color:#9194a1;font-size:16px;margin-bottom:32px;max-width:500px;margin-left:auto;margin-right:auto;position:relative}.form{display:flex;gap:8px;max-width:480px;margin:auto;background:#08080a;border:1px solid #2e3038;border-radius:9999px;padding:6px;position:relative}.form input{flex:1;background:transparent;border:0;color:#fff;padding:12px 20px;font-size:14px;outline:none;font-family:inherit}.form input::placeholder{color:#5e616e}.form button{background:#cc9166;color:#000;border:0;padding:12px 24px;border-radius:9999px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}@media(max-width:640px){.card{padding:40px 24px}.form{flex-direction:column;border-radius:16px;gap:6px}.form button{width:100%;padding:14px}}</style></head><body><div class="wrap"><div class="card"><div class="glow"></div><h2>Stay in the loop</h2><p>Get product updates, tips, and stories delivered to your inbox. No spam, ever.</p><form class="form" onsubmit="event.preventDefault();this.querySelector('button').textContent='Subscribed!';this.querySelector('input').value=''"><input type="email" placeholder="you@example.com" required><button type="submit">Subscribe</button></form></div></div></body></html>
