<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Split</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#08080a;color:#e2e3e9;min-height:100vh;display:flex;align-items:center;padding:24px}.wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}h1{font-family:'Playfair Display',serif;font-size:clamp(36px,5vw,56px);font-weight:400;line-height:1.15;color:#fff;margin-bottom:24px}p{font-size:17px;color:#9194a1;line-height:1.6;margin-bottom:32px}.btns{display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 26px;border-radius:9999px;text-decoration:none;font-weight:500;font-size:14px;transition:all .2s}.primary{background:#fff;color:#000}.primary:hover{opacity:.85}.ghost{border:1px solid #2e3038;color:#fff}.ghost:hover{border-color:#fff}.visual{aspect-ratio:1/1;border-radius:24px;background:linear-gradient(135deg,#cc9166 0%,#5e616e 50%,#121317 100%);position:relative;overflow:hidden}.visual::after{content:'';position:absolute;inset:20px;border-radius:16px;border:1px solid rgba(255,255,255,.1)}@media(max-width:768px){.wrap{grid-template-columns:1fr;gap:40px}h1{font-size:36px}.visual{aspect-ratio:16/10}}</style></head><body><div class="wrap"><div><h1>Launch faster with our platform</h1><p>Everything you need to build, ship, and scale your next big idea. Beautiful by default.</p><div class="btns"><a href="#" class="btn primary">Start free</a><a href="#" class="btn ghost">Learn more</a></div></div><div class="visual"></div></div></body></html>
