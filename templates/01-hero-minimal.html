<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Minimal</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#08080a;color:#e2e3e9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.hero{max-width:800px;text-align:center}h1{font-family:'Playfair Display',serif;font-size:clamp(40px,7vw,72px);font-weight:400;line-height:1.1;margin-bottom:24px;color:#fff;letter-spacing:.01em}p{font-size:18px;color:#9194a1;line-height:1.6;margin-bottom:32px;max-width:560px;margin-left:auto;margin-right:auto}.btn{display:inline-block;background:#fff;color:#000;padding:14px 32px;border-radius:9999px;text-decoration:none;font-weight:500;font-size:15px;transition:opacity .2s}.btn:hover{opacity:.85}</style></head><body><section class="hero"><h1>Build something great</h1><p>A clean starting point for your next project. Fast, modern, and easy to customize.</p><a href="#" class="btn">Get started</a></section></body></html>
