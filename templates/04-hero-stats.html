<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Stats</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#08080a;color:#e2e3e9;min-height:100vh;padding:60px 24px}.wrap{max-width:1000px;margin:auto;text-align:center}.hero{margin-bottom:60px}h1{font-family:'Playfair Display',serif;font-size:clamp(36px,6vw,64px);font-weight:400;color:#fff;margin-bottom:20px;letter-spacing:.01em}p{font-size:17px;color:#9194a1;max-width:520px;margin:0 auto 32px}.btn{display:inline-block;background:#cc9166;color:#000;padding:14px 32px;border-radius:9999px;text-decoration:none;font-weight:600;font-size:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding-top:48px;border-top:1px solid #1c1d22}.stat-num{font-family:'Playfair Display',serif;font-size:44px;color:#fff;margin-bottom:8px}.stat-label{font-size:14px;color:#9194a1}@media(max-width:640px){.stats{grid-template-columns:1fr;gap:24px}.stat-num{font-size:32px}}</style></head><body><div class="wrap"><section class="hero"><h1>Trusted by thousands</h1><p>Join the creators, founders, and teams building the future of the web.</p><a href="#" class="btn">Get started</a></section><div class="stats"><div><div class="stat-num">10,000+</div><div class="stat-label">Active users</div></div><div><div class="stat-num">99.9%</div><div class="stat-label">Uptime</div></div><div><div class="stat-num">50M+</div><div class="stat-label">Requests/day</div></div></div></div></body></html>
