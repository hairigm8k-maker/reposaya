<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Forgot Password — HairiHosting</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hh-common.css">
</head>
<body>

<div class="hh-auth-wrap">
  <div class="hh-card hh-card-sm">

    <div class="hh-brand">
      <img src="assets/logoUtama/logoUtama.png" alt="HairiHosting" class="hh-brand-logo">
    </div>

    <div class="hh-eyebrow">Reset Kata Laluan</div>
    <h1 class="hh-title">Forgot Password?</h1>
    <p class="hh-subtitle">Enter your email — kami hantar link for reset</p>

    <form id="forgotForm">
      <div class="hh-field">
        <label class="hh-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="hh-input" placeholder="nama@email.com" required autofocus>
      </div>

      <button type="submit" class="hh-btn hh-btn-primary" id="submitBtn">
        <span id="btnText">Send Link Reset</span>
      </button>
    </form>

    <div class="hh-link-row" style="justify-content:center;">
      <a href="/" class="hh-link">← Back ke log masuk</a>
    </div>

  </div>
</div>

<div class="hh-toast-wrap" id="toastWrap"></div>

<script src="assets/hh-common.js"></script>
<script>
const form = document.getElementById('forgotForm');
const submitBtn = document.getElementById('submitBtn');
const btnText = document.getElementById('btnText');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) return;

  submitBtn.disabled = true;
  btnText.innerHTML = '<span class="hh-spinner"></span> Menghantar...';

  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (data.ok) {
      HHT.toast('Link reset dihantar ke email you', 'success');
      setTimeout(() => window.location.href = '/', 2000);
    } else {
      HHT.toast(data.error || 'Failed hantar', 'error');
      submitBtn.disabled = false;
      btnText.textContent = 'Send Link Reset';
    }
  } catch (err) {
    HHT.toast('Error sambungan', 'error');
    submitBtn.disabled = false;
    btnText.textContent = 'Send Link Reset';
  }
});
</script>

</body>
</html>
