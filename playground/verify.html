<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sahkan Email — Playground</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/playground/playground.css">
<style>
/* ============================================
   CHECKMARK DRAW ANIMATION
   ============================================ */
.pg-check-wrap {
  width: 100px;
  height: 100px;
  margin: 0 auto 24px;
  position: relative;
}

.pg-check-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.pg-check-circle {
  fill: none;
  stroke: #38a169;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 300;
  stroke-dashoffset: 300;
  animation: drawCircle 0.7s cubic-bezier(0.65, 0, 0.45, 1) forwards;
  transform-origin: center;
  transform: rotate(-90deg);
}

.pg-check-tick {
  fill: none;
  stroke: #38a169;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
  animation: drawTick 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.7s forwards;
}

.pg-check-glow {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56,161,105,0.3) 0%, transparent 70%);
  opacity: 0;
  animation: glowPulse 0.6s ease-out 1s forwards;
  pointer-events: none;
}

@keyframes drawCircle {
  to { stroke-dashoffset: 0; }
}
@keyframes drawTick {
  to { stroke-dashoffset: 0; }
}
@keyframes glowPulse {
  0% { opacity: 0; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.1); }
  100% { opacity: 0.6; transform: scale(1); }
}

.pg-fade-in {
  opacity: 0;
  animation: fadeInUp 0.5s ease-out 1.1s forwards;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body class="pg-auth-body">

<div class="pg-testing-banner" style="background:linear-gradient(90deg,#f59e0b 0%,#d97706 100%);color:#fff;padding:10px 16px;text-align:center;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.5px;line-height:1.4;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:8px;">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  Under testing — Playground masih dalam fasa uji coba, sila coba lagi, terima kasih diatas kerjasama anda
</div>

<main class="pg-auth-wrap">
  <div class="pg-auth-card" id="card" style="text-align:center;">
    <div class="pg-modal-icon success" style="margin: 0 auto 20px;">
      <div class="pg-spinner"></div>
    </div>
    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;">Sedang Mengesahkan...</h2>
    <p style="color:#888;font-size:14px;margin-top:12px;">Sila tunggu sebentar.</p>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const config = { apiKey:"AIzaSyC-AJp-CHodVdfHBGiAHTFHSBWYZh3p44k", authDomain:"fikri-2a880.firebaseapp.com", databaseURL:"https://fikri-2a880-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"fikri-2a880", storageBucket:"fikri-2a880.storage.app", messagingSenderId:"844408547984", appId:"1:844408547984:web:63336207d709bb9f090615" };
const app = initializeApp(config);
const db = getDatabase(app);

const card = document.getElementById('card');

function showSuccess(name, uid, email) {
  localStorage.setItem('pendingVerify_' + email, JSON.stringify({ uid, name, verifiedAt: Date.now() }));

  card.innerHTML = `
    <div class="pg-check-wrap">
      <div class="pg-check-glow"></div>
      <svg class="pg-check-svg" viewBox="0 0 100 100">
        <circle class="pg-check-circle" cx="50" cy="50" r="46"/>
        <path class="pg-check-tick" d="M30 52 L45 67 L72 38"/>
      </svg>
    </div>
    <h2 class="pg-fade-in" style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:12px;color:#fff;">Email Disahkan!</h2>
    <p class="pg-fade-in" style="color:#888;font-size:14px;line-height:1.6;margin-bottom:24px;">Terima kasih ${name || ''}! Akaun anda dah aktif.</p>
    <a href="login.html" class="pg-btn-primary pg-fade-in" style="display:inline-block;padding:14px 32px;">Log Masuk</a>
  `;
}

function showError(msg) {
  card.innerHTML = `
    <div class="pg-modal-icon" style="background:rgba(227,30,36,0.15);color:#E31E24;margin: 0 auto 20px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h2 style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:12px;">Pengesahan Gagal</h2>
    <p style="color:#888;font-size:14px;line-height:1.6;margin-bottom:24px;">${msg}</p>
    <a href="index.html" class="pg-btn-primary" style="display:inline-block;padding:14px 32px;">Daftar Semula</a>
  `;
}

async function verify() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    showError('Link tidak sah. Sila pastikan anda klik link dalam email.');
    return;
  }

  try {
    const snap = await get(ref(db, 'verifyTokens/' + token));
    const data = snap.val();

    if (!data) {
      showError('Token tidak dijumpai atau dah digunakan.');
      return;
    }

    if (data.used) {
      showSuccess(data.name, data.uid, data.email);
      return;
    }

    if (data.expiresAt && Date.now() > data.expiresAt) {
      showError('Link telah tamat tempoh. Sila daftar semula.');
      return;
    }

    await update(ref(db, 'verifyTokens/' + token), {
      used: true,
      usedAt: Date.now()
    });

    showSuccess(data.name, data.uid, data.email);
  } catch (err) {
    showError('Ralat: ' + err.message);
  }
}

verify();
</script>
</body>
</html>
