<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Log Masuk — Playground</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/playground/playground.css">
</head>
<body class="pg-auth-body">

<header class="pg-auth-nav">
  <a href="../index.html" class="pg-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Balik
  </a>
  <img src="../assets/logoUtama/logoUtama.png" alt="hairiamri.buzz" class="pg-logo">
  <a href="index.html" class="pg-link">Daftar</a>
</header>

<main class="pg-auth-wrap">
  <div class="pg-auth-card">
    <div class="pg-auth-head">
      <span class="pg-badge">PLAYGROUND</span>
      <h1>Log Masuk</h1>
      <p>Selamat kembali! Masuk untuk uruskan website anda.</p>
    </div>

    <form id="loginForm" class="pg-form">
      <label>Email</label>
      <input type="email" id="email" required placeholder="email@contoh.com" autocomplete="email">

      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">

      <div class="pg-remember-row">
        <label class="pg-checkbox-inline">
          <input type="checkbox" id="remember" checked>
          <span>Ingat saya</span>
        </label>
      </div>

      <button type="submit" class="pg-btn-primary pg-btn-block" id="btnLogin">Log Masuk</button>
      <p id="msg" class="pg-msg"></p>
    </form>

    <p class="pg-auth-foot">
      <a href="#" onclick="forgotPassword();return false;" style="color:#888;font-size:12px;">Lupa password?</a>
    </p>
    <p class="pg-auth-foot">Belum ada akaun? <a href="index.html">Daftar</a></p>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  sendPasswordResetEmail, 
  signOut,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const config = { apiKey:"AIzaSyC-AJp-CHodVdfHBGiAHTFHSBWYZh3p44k", authDomain:"fikri-2a880.firebaseapp.com", databaseURL:"https://fikri-2a880-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"fikri-2a880", storageBucket:"fikri-2a880.storage.app", messagingSenderId:"844408547984", appId:"1:844408547984:web:63336207d709bb9f090615" };
const app = initializeApp(config);
const auth = getAuth(app);
const db = getDatabase(app);

// ============================================
// AUTO-REDIRECT kalau user dah login
// ============================================
onAuthStateChanged(auth, (user) => {
  if (user) {
    // Dah login — terus ke dashboard
    window.location.href = 'dashboard.html';
  }
});

// ============================================
// LOGIN FORM
// ============================================
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const remember = document.getElementById('remember').checked;
  const btn = document.getElementById('btnLogin');
  const msg = document.getElementById('msg');

  btn.textContent = 'Log masuk...';
  btn.disabled = true;
  msg.textContent = '';

  try {
    // Set persistence SEBELUM login
    const persistence = remember ? browserLocalPersistence : browserSessionPersistence;
    await setPersistence(auth, persistence);

    const cred = await signInWithEmailAndPassword(auth, email, password);
    const user = cred.user;

    // Check user data
    const snap = await get(ref(db, 'playgroundUsers/' + user.uid));
    let data = snap.val();

    // Kalau belum verified, check node verifications
    if (!data || !data.verified) {
      const emailKey = email.toLowerCase().replace(/[.@]/g, '_');
      const verifySnap = await get(ref(db, 'verifications/' + emailKey));
      const verifyData = verifySnap.val();

      if (verifyData) {
        await update(ref(db, 'playgroundUsers/' + user.uid), {
          verified: true,
          verifiedAt: verifyData.verifiedAt || Date.now()
        });
        data = { ...data, verified: true };
      }
    }

    if (!data || !data.verified) {
      await signOut(auth);
      msg.textContent = 'Email belum disahkan. Sila check email anda.';
      msg.style.color = '#e53e3e';
      btn.textContent = 'Log Masuk';
      btn.disabled = false;
      return;
    }

    msg.textContent = '✅ Berjaya! Redirect...';
    msg.style.color = '#38a169';
    setTimeout(() => window.location.href = 'dashboard.html', 500);
  } catch (err) {
    let m = 'Ralat: ' + err.message;
    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
      m = 'Email atau password salah';
    } else if (err.code === 'auth/too-many-requests') {
      m = 'Terlalu banyak cubaan. Cuba lagi nanti.';
    }
    msg.textContent = m;
    msg.style.color = '#e53e3e';
    btn.textContent = 'Log Masuk';
    btn.disabled = false;
  }
});

// ============================================
// FORGOT PASSWORD
// ============================================
window.forgotPassword = async () => {
  const email = prompt('Taip email anda:');
  if (!email) return;
  try {
    await sendPasswordResetEmail(auth, email);
    alert('✅ Email reset password dihantar ke ' + email);
  } catch (err) {
    alert('Ralat: ' + err.message);
  }
};
</script>
</body>
</html>
