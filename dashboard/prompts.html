<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Prompt Gallery — HairiHosting</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#040406;--panel:#121317;--border:#1c1d22;--border2:#2e3038;--text:#e2e3e9;--fog:#9194a1;--ash:#5e616e;--copper:#cc9166;--white:#fff;--serif:'Playfair Display',serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
pre{font-family:var(--mono);white-space:pre-wrap;word-wrap:break-word}

/* Header */
.top{height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:50}
.top img{height:28px;width:auto;filter:brightness(0) invert(1)}
.top .sep{width:1px;height:20px;background:var(--border2)}
.top .title{font-size:15px;font-weight:600;color:var(--white)}
.top .spacer{flex:1}
.top .back{font-size:12px;color:var(--fog);padding:7px 14px;border:1px solid var(--border2);border-radius:9999px;transition:all .15s;display:flex;align-items:center;gap:6px}
.top .back:hover{border-color:var(--copper);color:var(--copper)}

/* Hero */
.hero{padding:60px 24px 40px;text-align:center;border-bottom:1px solid var(--border);background:radial-gradient(circle at 50% 0%,rgba(204,145,102,.08) 0%,transparent 60%)}
.hero .eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);padding:5px 14px;border:1px solid rgba(204,145,102,.3);border-radius:9999px;margin-bottom:20px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,5vw,48px);color:var(--white);line-height:1.15;letter-spacing:-.02em;margin-bottom:16px;max-width:820px;margin-left:auto;margin-right:auto}
.hero p{font-size:16px;color:var(--fog);line-height:1.6;max-width:600px;margin:0 auto 32px}

/* AI Strip */
.ai-strip{display:flex;align-items:center;justify-content:center;gap:32px;flex-wrap:wrap;padding:24px 24px 0;max-width:900px;margin:0 auto}
.ai-strip-label{font-size:11px;color:var(--ash);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono);font-weight:500;width:100%;text-align:center;margin-bottom:16px}
.ai-item{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.75;transition:opacity .2s}
.ai-item:hover{opacity:1}
.ai-item svg{width:32px;height:32px;display:block}
.ai-item span{font-size:11px;color:var(--fog);font-family:var(--mono);font-weight:500}
.ai-item.ds svg{width:28px;height:28px}
.ai-item.gpt svg{background:#000;border-radius:50%;padding:3px}
.ai-item.copilot svg{width:34px;height:34px}

/* Filter */
.filters{padding:32px 24px 8px;max-width:1200px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.filter{padding:8px 16px;border:1px solid var(--border2);border-radius:9999px;font-size:13px;color:var(--fog);cursor:pointer;transition:all .15s;font-weight:500;background:var(--card)}
.filter:hover{border-color:var(--copper);color:var(--copper)}
.filter.active{background:var(--copper);color:#000;border-color:var(--copper);font-weight:600}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:24px 24px 60px;max-width:1200px;margin:0 auto}
@media(max-width:640px){.grid{grid-template-columns:1fr;padding:16px}}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--copper);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.card-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--copper);background:rgba(204,145,102,.12);padding:4px 10px;border-radius:9999px;margin-bottom:14px}
.card-title{font-family:var(--serif);font-size:19px;color:var(--white);font-weight:400;line-height:1.25;margin-bottom:10px}
.card-desc{font-size:13px;color:var(--fog);line-height:1.6;margin-bottom:16px;min-height:60px}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:16px;border-top:1px solid var(--border)}
.card-len{font-size:11px;color:var(--ash);font-family:var(--mono)}
.card-ais{display:flex;gap:6px;align-items:center}
.card-ais svg{width:16px;height:16px;opacity:.6}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:9999;padding:20px;overflow-y:auto}
.modal.show{display:flex;align-items:flex-start;justify-content:center}
.modal-box{background:var(--card);border:1px solid var(--border2);border-radius:18px;max-width:880px;width:100%;margin:auto;padding:28px;position:relative;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.modal-head{display:flex;justify-content:space-between;align-items:start;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px}
.modal-title{font-family:var(--serif);font-size:24px;color:var(--white);font-weight:400;line-height:1.2}
.modal-sub{font-size:13px;color:var(--fog);margin-top:6px}
.modal-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);color:var(--fog);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;line-height:1}
.modal-close:hover{border-color:var(--copper);color:var(--copper)}
.modal-body{flex:1;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.modal-body pre{font-size:12px;color:var(--bone);line-height:1.65}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:9999px;font-size:13.5px;font-weight:600;transition:all .15s;cursor:pointer}
.btn-primary{background:var(--copper);color:#000}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--white)}
.btn-ghost:hover{border-color:var(--white)}

.toast-wrap{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--copper);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--text);min-width:220px}
.toast.success{border-left-color:#4ade80}
</style>
</head>
