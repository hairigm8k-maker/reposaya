<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Live Chat — HairiHosting</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#040406;--panel:#121317;--border:#1c1d22;--border2:#2e3038;--text:#e2e3e9;--fog:#9194a1;--ash:#5e616e;--copper:#cc9166;--white:#fff;--serif:'Playfair Display',serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}

.header{height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;position:relative;z-index:10}
.header .logo{height:28px;width:auto;filter:brightness(0) invert(1)}
.header .sep{width:1px;height:20px;background:var(--border2)}
.header .title{font-size:15px;font-weight:600;color:var(--white)}
.header .status{display:flex;align-items:center;gap:5px;font-size:11px;color:#4ade80;font-family:var(--mono)}
.header .status .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header .back{margin-left:auto;font-size:12px;color:var(--fog);padding:6px 12px;border:1px solid var(--border2);border-radius:9999px;transition:all .15s;display:flex;align-items:center;gap:6px}
.header .back:hover{border-color:var(--copper);color:var(--copper)}

/* Language picker screen */
.lang-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
.lang-screen::before{content:'';position:absolute;top:-30%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(204,145,102,.08) 0%,transparent 60%);pointer-events:none}
.lang-card{max-width:440px;width:100%;text-align:center;position:relative;z-index:1}
.lang-avatar{width:80px;height:80px;border-radius:50%;background:var(--panel);border:2px solid var(--border2);margin:0 auto 20px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.lang-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.lang-avatar .fallback{font-family:var(--serif);font-size:32px;color:var(--copper);font-weight:500}
.lang-card h1{font-family:var(--serif);font-size:28px;font-weight:400;color:var(--white);margin-bottom:8px;letter-spacing:-.02em}
.lang-card p{color:var(--fog);font-size:14px;line-height:1.6;margin-bottom:28px}
.lang-btns{display:flex;flex-direction:column;gap:10px}
.lang-btn{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--panel);border:1px solid var(--border2);border-radius:14px;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
.lang-btn:hover{border-color:var(--copper);background:rgba(204,145,102,.06);transform:translateY(-1px)}
.lang-flag{font-size:24px;flex-shrink:0}
.lang-info{flex:1}
.lang-name{font-size:15px;font-weight:600;color:var(--white);margin-bottom:2px}
.lang-sub{font-size:12px;color:var(--fog)}
.lang-arrow{color:var(--ash);flex-shrink:0;transition:transform .2s}
.lang-btn:hover .lang-arrow{transform:translateX(3px);color:var(--copper)}

/* Chat screen */
.chat-wrap{flex:1;display:none;flex-direction:column;max-width:900px;width:100%;margin:0 auto;overflow:hidden;height:calc(100dvh - 60px)}
.chat-wrap.active{display:flex}
#chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.chat-wrap.active{display:flex}
.messages{flex:1;overflow-y:auto;padding:20px 20px 24px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:6px}
.messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.bubble-row{display:flex;gap:8px;align-items:flex-end;animation:fadeIn .25s ease;width:100%}
.bubble-row.me{justify-content:flex-end}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bubble-row.me{flex-direction:row-reverse}
.bubble-row .avatar{width:28px;height:28px;border-radius:50%;background:var(--panel);border:1px solid var(--border2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.bubble-row .avatar img{width:100%;height:100%;object-fit:cover;display:block}
.bubble-row .avatar .fallback{font-weight:700;color:var(--copper);font-size:12px;font-family:var(--serif)}
.bubble{max-width:75%;width:fit-content;padding:10px 14px;font-size:14px;line-height:1.55;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;align-self:flex-start}
.bubble-row.other .bubble{background:var(--panel);border:1px solid var(--border2);color:var(--bone);border-radius:4px 16px 16px 16px}
.bubble-row.me .bubble{background:var(--copper);color:#000;border-radius:16px 4px 16px 16px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,0.2)}

.typing{display:flex;gap:4px;align-items:center;padding:12px 16px;background:var(--panel);border:1px solid var(--border2);border-radius:4px 16px 16px 16px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--fog);animation:dot 1.4s infinite ease-in-out both}
.typing span:nth-child(1){animation-delay:-0.32s}
.typing span:nth-child(2){animation-delay:-0.16s}
@keyframes dot{0%,80%,100%{opacity:.4;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

.suggestions{padding:0 20px 12px;display:flex;gap:8px;flex-wrap:wrap}
.suggestion{padding:8px 14px;border:1px solid var(--border2);border-radius:9999px;font-size:12.5px;color:var(--fog);cursor:pointer;transition:all .15s;background:var(--card)}
.suggestion:hover{border-color:var(--copper);color:var(--copper)}

.input-area{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--card);flex-shrink:0}
.input-box{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--border2);border-radius:20px;padding:6px 6px 6px 14px;transition:border-color .15s}
.input-box:focus-within{border-color:var(--copper)}
textarea{flex:1;background:transparent;border:0;color:var(--white);font-family:inherit;font-size:14.5px;outline:none;resize:none;padding:9px 0;max-height:140px;line-height:1.45}
textarea::placeholder{color:var(--ash)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--copper);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.send-btn:hover{opacity:.85}
.send-btn:disabled{opacity:.4;cursor:not-allowed}

.info-bar{font-size:11.5px;color:var(--ash);text-align:center;padding:6px 16px 0;font-family:var(--mono)}

@media(max-width:640px){
  .header{padding:0 12px}
  .header .title{font-size:14px}
  .header .back{padding:5px 10px;font-size:11px}
  .bubble{max-width:82%}
  #chat{padding:12px 12px 4px}
  .messages{padding:16px 12px 20px}
  .input-area{padding:10px 12px 16px}
}
</style>
</head>
<body>

<div class="header">
  <img src="/assets/logoUtama/logoUtama.png" alt="HairiHosting" class="logo">
  <div class="sep"></div>
  <div>
    <div class="title">Live Chat</div>
    <div class="status"><span class="dot"></span>Lana · AI</div>
  </div>
  <a href="/dashboard/#/support" class="back">
    <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
</div>

<!-- Language Picker -->
<div class="lang-screen" id="langScreen">
  <div class="lang-card">
    <div class="lang-avatar" id="langAvatar">
      <img src="/assets/cs/cs.png" alt="Lana" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=&quot;fallback&quot;>L</span>'">
    </div>
    <h1>Lana</h1>
    <p>AI-powered customer support. Choose your preferred language to start.</p>
    <div class="lang-btns">
      <button class="lang-btn" data-lang="en">
        <span class="lang-flag">🇬🇧</span>
        <div class="lang-info">
          <div class="lang-name">English</div>
          <div class="lang-sub">Chat in English</div>
        </div>
        <svg class="lang-arrow" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="lang-btn" data-lang="ms">
        <span class="lang-flag">🇲🇾</span>
        <div class="lang-info">
          <div class="lang-name">Bahasa Melayu</div>
          <div class="lang-sub">Sembang dalam Bahasa Melayu</div>
        </div>
        <svg class="lang-arrow" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Chat Screen -->
<div class="chat-wrap" id="chatWrap">
  <div class="messages" id="messages"></div>
  <div class="suggestions" id="suggestions"></div>
  <div class="input-area">
    <div class="input-box">
      <textarea id="input" placeholder="" rows="1"></textarea>
      <button class="send-btn" id="send">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="info-bar" id="infoBar"></div>
  </div>
</div>

<script>
(function(){
  var history = [];
  var isSending = false;
  var LANG = 'en';

  var STRINGS = {
    en: {
      greeting1: 'Hi! 👋 I\'m Lana, your AI customer support assistant.',
      greeting2: 'How can I help you today? Ask me about deploying, pricing, custom domains, or the CLI.',
      placeholder: 'Ask anything about HairiHosting...',
      infoBar: '',
      suggestions: ['How do I deploy with CLI?', 'What is the pricing?', 'How to setup custom domain?'],
      errorPrefix: 'Sorry, something went wrong: '
    },
    ms: {
      greeting1: 'Hai! 👋 Saya Lana, AI customer support anda.',
      greeting2: 'Boleh saya tolong? Tanya pasal deploy, harga, custom domain, atau CLI.',
      placeholder: 'Taip soalan tentang HairiHosting...',
      infoBar: '',
      suggestions: ['Macam mana nak deploy CLI?', 'Berapa harga plan?', 'Macam mana setup custom domain?'],
      errorPrefix: 'Maaf, ada error: '
    }
  };

  var messagesEl = document.getElementById('messages');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var suggestionsEl = document.getElementById('suggestions');
  var infoBar = document.getElementById('infoBar');

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function addBubble(role, text){
    var isMe = role === 'user';
    var div = document.createElement('div');
    div.className = 'bubble-row ' + (isMe ? 'me' : 'other');
    var avatarHtml = isMe ? '' : '<div class="avatar"><img src="/assets/cs/cs.png" alt="Lana" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span class=&quot;fallback&quot;>H</span>\'"></div>';
    div.innerHTML = avatarHtml + '<div class="bubble">' + esc(text) + '</div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTyping(){
    var div = document.createElement('div');
    div.className = 'bubble-row other';
    div.id = 'typingRow';
    div.innerHTML = '<div class="avatar"><img src="/assets/cs/cs.png" alt="Lana" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span class=&quot;fallback&quot;>H</span>\'"></div><div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    var el = document.getElementById('typingRow');
    if (el) el.remove();
  }

  function renderGreeting(){
    var s = STRINGS[LANG];
    messagesEl.innerHTML = '';
    addBubble('assistant', s.greeting1);
    addBubble('assistant', s.greeting2);
    inputEl.placeholder = s.placeholder;
    infoBar.textContent = s.infoBar;
    suggestionsEl.innerHTML = s.suggestions.map(function(q){
      return '<div class="suggestion" data-q="' + esc(q) + '">' + esc(q) + '</div>';
    }).join('');
    suggestionsEl.querySelectorAll('.suggestion').forEach(function(el){
      el.onclick = function(){ inputEl.value = el.dataset.q; send(); };
    });
  }

  function startChat(lang){
    LANG = lang;
    document.getElementById('langScreen').style.display = 'none';
    document.getElementById('chatWrap').classList.add('active');
    renderGreeting();
    setTimeout(function(){ inputEl.focus(); }, 150);
  }

  async function send(){
    if (isSending) return;
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    suggestionsEl.style.display = 'none';
    addBubble('user', text);
    history.push({ role: 'user', content: text });
    isSending = true;
    sendBtn.disabled = true;
    addTyping();
    try {
      var r = await fetch('/api/support/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, language: LANG })
      });
      var d = await r.json();
      removeTyping();
      if (d.ok) {
        addBubble('assistant', d.reply);
        history.push({ role: 'assistant', content: d.reply });
      } else {
        addBubble('assistant', STRINGS[LANG].errorPrefix + (d.error || 'unknown'));
      }
    } catch(e) {
      removeTyping();
      addBubble('assistant', STRINGS[LANG].errorPrefix + 'connection error');
    }
    isSending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.onclick = function(){ startChat(btn.dataset.lang); };
  });

  inputEl.addEventListener('input', function(){
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });
  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  // Auth check
  fetch('/api/auth/session').then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok || !d.authenticated) window.location.href = '/';
  }).catch(function(){ window.location.href = '/'; });
})();
</script>
</body>
</html>
