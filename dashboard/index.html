<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — HairiHosting</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080a;
  --card: #040406;
  --panel: #121317;
  --border: #1c1d22;
  --border2: #2e3038;
  --text: #e2e3e9;
  --fog: #9194a1;
  --ash: #5e616e;
  --copper: #cc9166;
  --white: #ffffff;
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }

.layout { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: var(--card);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; bottom: 0; left: 0;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform 0.25s ease;
  overflow-y: auto;
}
.sb-brand {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sb-brand img {
  width: 40px;
  filter: brightness(0) invert(1);
}
.sb-close { display: none; background: transparent; border: none; color: var(--fog); font-size: 20px; padding: 4px 8px; }
.sb-nav { flex: 1; padding: 12px; }
.sb-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ash);
  padding: 16px 12px 8px;
}
.sb-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  color: var(--fog);
  font-size: 14px;
  font-weight: 500;
  transition: all 0.15s;
  cursor: pointer;
  margin-bottom: 2px;
}
.sb-link:hover { background: var(--panel); color: var(--white); }
.sb-link.active { background: var(--panel); color: var(--white); }
.sb-link.active::before {
  content: '';
  position: absolute;
  left: 0;
  width: 2px;
  height: 20px;
  background: var(--copper);
}
.sb-link { position: relative; }
.sb-icon {
  width: 18px; height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* MAIN */
.main {
  flex: 1;
  margin-left: 260px;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 60px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.tb-menu {
  display: none;
  background: transparent;
  border: none;
  color: var(--text);
  padding: 8px;
}
.tb-menu svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
.tb-spacer { flex: 1; }
.tb-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fog);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.tb-btn:hover { background: var(--panel); color: var(--white); }
.tb-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.tb-user {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--border2);
  color: var(--white);
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 32px;
  max-width: 1400px;
  width: 100%;
}

/* PAGE */
.page-head { margin-bottom: 32px; }
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--copper);
  margin-bottom: 8px;
}
.page-title {
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 400;
  line-height: 1.15;
  color: var(--white);
  margin-bottom: 6px;
}
.page-sub { font-size: 15px; color: var(--fog); }

/* CARDS */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
}
.card-title { font-size: 13px; color: var(--fog); margin-bottom: 8px; }
.card-value { font-family: var(--serif); font-size: 36px; line-height: 1; color: var(--white); }
.card-meta { font-size: 12px; color: var(--ash); margin-top: 8px; }

/* FORM */
.field { margin-bottom: 16px; }
.label { display: block; font-size: 14px; font-weight: 500; color: #c7c9d1; margin-bottom: 8px; }
.input {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: 999px;
  padding: 12px 20px;
  font-size: 15px;
  color: var(--white);
  outline: none;
  transition: border-color 0.15s;
}
.input:focus { border-color: var(--white); background: var(--panel); }
.input::placeholder { color: var(--ash); }

/* BUTTON */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 999px;
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.15s;
}
.btn-primary { background: var(--white); color: #000; width: 100%; }
.btn-primary:hover { background: #d5d5d5; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--white); }
.btn-ghost:hover { border-color: var(--white); }
.btn-sm { padding: 6px 14px; font-size: 13px; width: auto; }

/* TABLE */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th {
  text-align: left;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ash);
  border-bottom: 1px solid var(--border);
}
.tbl td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.tbl tr:hover td { background: var(--panel); }
.tbl tr:last-child td { border-bottom: none; }

/* BADGE */
.badge {
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  display: inline-block;
}
.badge-live { background: rgba(74,222,128,0.15); color: #4ade80; }
.badge-draft { background: rgba(251,191,36,0.15); color: #fbbf24; }

/* LOADING */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: var(--white);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 0;
}

/* TOAST */
.toast-wrap {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--copper);
  border-radius: 10px;
  padding: 14px 18px;
  min-width: 260px;
  max-width: 380px;
  color: var(--text);
  font-size: 14px;
  animation: tIn 0.25s ease;
  pointer-events: auto;
}
.toast.success { border-left-color: #4ade80; }
.toast.error { border-left-color: #f87171; }
@keyframes tIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* OVERLAY */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 99;
}
.overlay.show { display: block; }

/* RESPONSIVE */
@media (max-width: 1024px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .tb-menu { display: flex; }
  .sb-close { display: flex; }
}
@media (max-width: 640px) {
  .content { padding: 20px; }
  .topbar { padding: 0 16px; }
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .page-title { font-size: 26px; }
  .card-value { font-size: 26px; }
}
</style>
</head>
<body>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <img src="/assets/logoUtama/logoUtama.png" alt="HairiHosting">
      <button class="sb-close" id="sbClose">✕</button>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">

    <header class="topbar">
      <button class="tb-menu" id="tbMenu">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="tb-spacer"></div>
      <button class="tb-btn" onclick="App.go('sites-new')" title="Buat site baru">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="tb-btn" title="Notifikasi">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="tb-user" id="tbUser"></button>
    </header>

    <div class="content" id="content">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>

  </main>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
// ═══════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════
function toast(msg, type) {
  type = type || 'info';
  var wrap = document.getElementById('toastWrap');
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function() {
    el.style.opacity = '0';
    el.style.transition = 'all 0.2s';
    setTimeout(function() { el.remove(); }, 200);
  }, 4000);
}

// ═══════════════════════════════════════════
// APP
// ═══════════════════════════════════════════
var App = {
  user: null,

  // ─── AUTH ───
  async checkAuth() {
    try {
      var res = await fetch('/api/auth/session');
      var data = await res.json();
      if (!data.ok || !data.authenticated) {
        window.location.href = '/';
        return null;
      }
      this.user = data.user;
      return data.user;
    } catch (e) {
      window.location.href = '/';
      return null;
    }
  },

  // ─── MENU ───
  menu: [
    { title: 'Overview', items: [
      { id: 'home', label: 'Dashboard' },
      { id: 'activity', label: 'Aktiviti' },
      { id: 'notifications', label: 'Notifikasi' },
      { id: 'status', label: 'System Status' }
    ]},
    { title: 'Sites', items: [
      { id: 'sites', label: 'My Sites' },
      { id: 'sites-new', label: 'Buat Site Baru' },
      { id: 'templates', label: 'Templates' },
      { id: 'archived', label: 'Archived' }
    ]},
    { title: 'Editor', items: [
      { id: 'editor-html', label: 'HTML Editor' },
      { id: 'editor-css', label: 'CSS Editor' },
      { id: 'editor-js', label: 'JS Editor' },
      { id: 'assets', label: 'Asset Upload' },
      { id: 'preview', label: 'Live Preview' }
    ]},
    { title: 'Files', items: [
      { id: 'files', label: 'File Browser' },
      { id: 'zip-import', label: 'Import ZIP' },
      { id: 'zip-export', label: 'Export ZIP' }
    ]},
    { title: 'Publishing', items: [
      { id: 'publish', label: 'Publish' },
      { id: 'deployments', label: 'Deployments' },
      { id: 'subdomains', label: 'Subdomains' },
      { id: 'domains', label: 'Custom Domains' }
    ]},
    { title: 'Analytics', items: [
      { id: 'stats', label: 'Visitor Stats' },
      { id: 'traffic', label: 'Traffic Sources' },
      { id: 'devices', label: 'Devices' }
    ]},
    { title: 'Account', items: [
      { id: 'billing', label: 'Billing & Plan' },
      { id: 'profile', label: 'Profil' },
      { id: 'security', label: 'Keselamatan' },
      { id: 'support', label: 'Support' }
    ]}
  ],

  renderSidebar() {
    var nav = document.getElementById('sbNav');
    var current = window.location.hash.replace('#/', '') || 'home';
    var self = this;
    var html = '';

    this.menu.forEach(function(section) {
      html += '<div class="sb-title">' + section.title + '</div>';
      section.items.forEach(function(item) {
        var active = item.id === current ? 'active' : '';
        html += '<div class="sb-link ' + active + '" onclick="App.go(\'' + item.id + '\')">' + item.label + '</div>';
      });
    });
    nav.innerHTML = html;
  },

  go(id) {
    window.location.hash = '#/' + id;
  },

  // ─── ROUTER ───
  async route() {
    var id = window.location.hash.replace('#/', '') || 'home';
    this.renderSidebar();
    this.closeSidebar();
    await this.load(id);
  },

  async load(id) {
    var content = document.getElementById('content');
    content.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

    try {
      if (id === 'home') return this.pageHome();
      if (id === 'sites') return await this.pageSites();
      if (id === 'sites-new') return this.pageSitesNew();
      return this.pagePlaceholder(id);
    } catch (e) {
      content.innerHTML = '<div class="card" style="text-align:center;padding:40px;"><p style="color:#f87171;">Error: ' + e.message + '</p></div>';
    }
  },

  // ─── PAGES ───
  pageHome() {
    var name = (this.user && this.user.name) || 'User';
    document.getElementById('content').innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">Overview</div>' +
        '<h1 class="page-title">Selamat kembali, ' + name + '</h1>' +
        '<p class="page-sub">Ni ringkasan akaun anda hari ini</p>' +
      '</div>' +
      '<div class="grid-4">' +
        '<div class="card"><div class="card-title">Total Sites</div><div class="card-value">0</div><div class="card-meta">Belum ada site</div></div>' +
        '<div class="card"><div class="card-title">Visitors</div><div class="card-value">0</div><div class="card-meta">7 hari lepas</div></div>' +
        '<div class="card"><div class="card-title">Storage</div><div class="card-value">0 B</div><div class="card-meta">Dari 100 MB</div></div>' +
        '<div class="card"><div class="card-title">Plan</div><div class="card-value" style="font-size:28px;">Free</div><div class="card-meta">3 site max</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title" style="font-size:16px;color:white;margin-bottom:20px;">Aktiviti Terkini</div>' +
        '<div style="text-align:center;padding:40px 20px;color:#5e616e;font-size:14px;">Belum ada aktiviti</div>' +
      '</div>';
  },

  async pageSites() {
    var res = await fetch('/api/sites');
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Gagal load sites');

    if (!data.sites || data.sites.length === 0) {
      document.getElementById('content').innerHTML =
        '<div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;">' +
          '<div><div class="eyebrow">Sites</div><h1 class="page-title">My Sites</h1><p class="page-sub">Senarai semua website anda</p></div>' +
          '<button class="btn btn-primary btn-sm" onclick="App.go(\'sites-new\')">+ Buat Site Baru</button>' +
        '</div>' +
        '<div class="card" style="text-align:center;padding:60px 40px;">' +
          '<div style="font-family:var(--serif);font-size:28px;color:white;margin-bottom:12px;">Belum ada website</div>' +
          '<p style="color:#9194a1;font-size:15px;margin-bottom:24px;">Mula dengan buat website pertama anda.</p>' +
          '<button class="btn btn-primary btn-sm" onclick="App.go(\'sites-new\')">+ Buat Website Baru</button>' +
        '</div>';
      return;
    }

    var html = '<div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;">' +
      '<div><div class="eyebrow">Sites</div><h1 class="page-title">My Sites</h1><p class="page-sub">Senarai semua website anda</p></div>' +
      '<button class="btn btn-primary btn-sm" onclick="App.go(\'sites-new\')">+ Buat Site Baru</button>' +
      '</div>';

    html += '<div class="card" style="padding:0;overflow:hidden;"><table class="tbl">';
    html += '<thead><tr><th>Nama</th><th>Subdomain</th><th>Status</th><th>Dikemaskini</th><th></th></tr></thead><tbody>';

    data.sites.forEach(function(s) {
      var badge = s.status === 'live'
        ? '<span class="badge badge-live">● LIVE</span>'
        : '<span class="badge badge-draft">○ DRAFT</span>';
      html += '<tr>' +
        '<td><strong style="color:white;">' + s.name + '</strong></td>' +
        '<td><span style="font-family:var(--mono);font-size:12px;color:#cc9166;">' + s.subdomain + '.hairiamri.buzz</span></td>' +
        '<td>' + badge + '</td>' +
        '<td style="color:#9194a1;font-size:13px;">' + (s.updated_at || '-') + '</td>' +
        '<td style="text-align:right;"><button class="btn btn-ghost btn-sm">Edit</button></td>' +
        '</tr>';
    });

    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
  },

  pageSitesNew() {
    document.getElementById('content').innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">Sites</div>' +
        '<h1 class="page-title">Buat Site Baru</h1>' +
        '<p class="page-sub">Isi maklumat website anda</p>' +
      '</div>' +
      '<div class="card" style="max-width:520px;">' +
        '<div class="field">' +
          '<label class="label">Nama Website</label>' +
          '<input type="text" class="input" id="fName" placeholder="Contoh: My Biz">' +
          '<div class="card-meta" style="margin-top:8px;">Subdomain: <strong id="fPreview" style="color:#cc9166;">-</strong></div>' +
        '</div>' +
        '<div class="field">' +
          '<label class="label">Subdomain (optional)</label>' +
          '<input type="text" class="input" id="fSub" placeholder="mybiz">' +
          '<div class="card-meta" style="margin-top:8px;">Kosongkan untuk auto-generate</div>' +
        '</div>' +
        '<button class="btn btn-primary" id="fBtn" style="margin-top:12px;">Buat Site</button>' +
      '</div>';

    var nameEl = document.getElementById('fName');
    var subEl = document.getElementById('fSub');
    var prevEl = document.getElementById('fPreview');
    var btnEl = document.getElementById('fBtn');

    function update() {
      var custom = subEl.value.trim().toLowerCase();
      var auto = nameEl.value.trim().toLowerCase()
        .replace(/[^a-z0-9-]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '')
        .slice(0, 30);
      var final = custom || auto;
      prevEl.textContent = final ? final + '.hairiamri.buzz' : '-';
    }

    nameEl.addEventListener('input', update);
    subEl.addEventListener('input', update);

    btnEl.onclick = async function() {
      var name = nameEl.value.trim();
      var sub = subEl.value.trim().toLowerCase();

      if (!name) {
        toast('Sila isi nama website', 'error');
        return;
      }

      btnEl.disabled = true;
      btnEl.innerHTML = '<span class="spinner"></span> Mencipta...';

      try {
        var res = await fetch('/api/sites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, subdomain: sub })
        });
        var data = await res.json();

        if (data.ok) {
          toast('Site berjaya dicipta!', 'success');
          setTimeout(function() { App.go('sites'); }, 500);
        } else {
          toast(data.error || 'Gagal cipta site', 'error');
          btnEl.disabled = false;
          btnEl.textContent = 'Buat Site';
        }
      } catch (e) {
        toast('Ralat: ' + e.message, 'error');
        btnEl.disabled = false;
        btnEl.textContent = 'Buat Site';
      }
    };

    update();
    nameEl.focus();
  },

  pagePlaceholder(id) {
    var label = id.replace(/-/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); });
    document.getElementById('content').innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">Coming Soon</div>' +
        '<h1 class="page-title">' + label + '</h1>' +
        '<p class="page-sub">Module ni akan datang dalam fasa seterusnya</p>' +
      '</div>' +
      '<div class="card" style="text-align:center;padding:60px 40px;">' +
        '<div style="font-size:40px;margin-bottom:16px;">🚧</div>' +
        '<div style="font-family:var(--serif);font-size:24px;color:white;margin-bottom:8px;">Belum siap</div>' +
        '<p style="color:#9194a1;font-size:14px;">Module <code style="background:#121317;padding:2px 8px;border-radius:4px;font-family:var(--mono);font-size:13px;color:#cc9166;">' + id + '</code> akan dibina kemudian.</p>' +
      '</div>';
  },

  // ─── SIDEBAR ───
  openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
  },
  closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  },

  async init() {
    var u = await this.checkAuth();
    if (!u) return;

    document.getElementById('tbUser').textContent = (u.name || u.email).charAt(0).toUpperCase();

    document.getElementById('tbMenu').addEventListener('click', function() { App.openSidebar(); });
    document.getElementById('sbClose').addEventListener('click', function() { App.closeSidebar(); });
    document.getElementById('overlay').addEventListener('click', function() { App.closeSidebar(); });

    document.getElementById('tbUser').addEventListener('click', function() {
      if (confirm('Log keluar?')) {
        fetch('/api/auth/logout', { method: 'POST' })
          .finally(function() { window.location.href = '/'; });
      }
    });

    window.addEventListener('hashchange', function() { App.route(); });
    this.route();
  }
};

document.addEventListener('DOMContentLoaded', function() { App.init(); });
window.toast = toast;
</script>

</body>
</html>
