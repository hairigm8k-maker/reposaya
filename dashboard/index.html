<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — HairiHosting</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/hh-common.css">
<link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>

<div class="dash-layout">

  <!-- SIDEBAR -->
  <aside class="dash-sidebar" id="sidebar">
    <div class="sb-brand">
      <img src="/assets/logoUtama/logoUtama.png" alt="HairiHosting" class="sb-logo">
      <button class="sb-close" id="sbClose" aria-label="Close">✕</button>
    </div>

    <nav class="sb-nav" id="sbNav">
      <!-- Injected by JS -->
    </nav>

    <div class="sb-footer">
      <div class="sb-plan">
        <div class="sb-plan-label">Plan</div>
        <div class="sb-plan-name">Free</div>
      </div>
    </div>
  </aside>

  <!-- OVERLAY (mobile) -->
  <div class="dash-overlay" id="overlay"></div>

  <!-- MAIN -->
  <main class="dash-main">

    <!-- TOPBAR -->
    <header class="dash-topbar">
      <button class="tb-menu" id="tbMenu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="tb-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Cari site, file, log..." id="globalSearch">
      </div>

      <div class="tb-actions">
        <button class="tb-btn" title="Buat site baru" onclick="HHD.quickCreate()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

        <button class="tb-btn tb-notif" title="Notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="tb-badge">3</span>
        </button>

        <button class="tb-user" id="tbUser" title="Profil">
          <span id="userInitial">T</span>
        </button>
      </div>
    </header>

    <!-- CONTENT -->
    <div class="dash-content" id="content">
      <div class="loading-state">
        <div class="hh-spinner"></div>
      </div>
    </div>

  </main>

</div>

<div class="hh-toast-wrap" id="toastWrap"></div>

<script src="/assets/hh-common.js"></script>
<script src="assets/dashboard.js"></script>

</body>
</html>
