<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — LogoUtama</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#08080a;--card:#040406;--panel:#121317;--border:#1c1d22;--border2:#2e3038;--text:#e2e3e9;--fog:#9194a1;--ash:#5e616e;--copper:#cc9166;--white:#ffffff;--serif:'Playfair Display',serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
.layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:100;transition:transform .25s;overflow-y:auto;scrollbar-width:thin}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.sb-brand{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-brand img{width:40px;filter:brightness(0) invert(1)}
.sb-close{display:none;background:transparent;border:none;color:var(--fog);font-size:20px;padding:4px 8px}
.sb-nav{flex:1;padding:12px}
.sb-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ash);padding:16px 12px 8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:color .15s}
.sb-title:hover{color:var(--fog)}
.sb-title-arrow{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex-shrink:0}
.sb-title.collapsed .sb-title-arrow{transform:rotate(-90deg)}
.sb-group{max-height:1000px;overflow:hidden;transition:max-height .3s ease}
.sb-group.collapsed{max-height:0}
.sb-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--fog);font-size:14px;font-weight:500;transition:all .15s;cursor:pointer;margin-bottom:2px;position:relative}
.sb-link:hover{background:var(--panel);color:var(--white)}
.sb-link.active{background:var(--panel);color:var(--white)}
.sb-link.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:20px;background:var(--copper)}
.sb-icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.85}
.main{flex:1;margin-left:260px;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:50}
.tb-menu{display:none;background:transparent;border:none;color:var(--text);padding:8px}
.tb-menu svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.tb-spacer{flex:1}
.tb-btn{width:38px;height:38px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--fog);display:flex;align-items:center;justify-content:center}
.tb-btn:hover{background:var(--panel);color:var(--white)}
.tb-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.tb-user{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--border2);color:var(--white);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.content{flex:1;padding:32px;max-width:1400px;width:100%}
.page-head{margin-bottom:32px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin-bottom:8px}
.page-title{font-family:var(--serif);font-size:36px;font-weight:400;line-height:1.15;color:var(--white);margin-bottom:6px}
.page-sub{font-size:15px;color:var(--fog)}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px}
.card-title{font-size:13px;color:var(--fog);margin-bottom:8px}
.card-value{font-family:var(--serif);font-size:36px;line-height:1;color:var(--white)}
.card-meta{font-size:12px;color:var(--ash);margin-top:8px}
.field{margin-bottom:16px}
.label{display:block;font-size:14px;font-weight:500;color:#c7c9d1;margin-bottom:8px}
.input,.select{width:100%;background:transparent;border:1px solid var(--border2);border-radius:999px;padding:12px 20px;font-size:15px;color:var(--white);outline:none}
.input:focus,.select:focus{border-color:var(--white);background:var(--panel)}
.input::placeholder{color:var(--ash)}
.select option{background:#121317;color:var(--white)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:12px 24px;font-size:14px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--white);color:#000;width:100%}
.btn-primary:hover{background:#d5d5d5}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--white)}
.btn-ghost:hover{border-color:var(--white)}
.btn-danger{background:transparent;border:1px solid #dc2626;color:#f87171}
.btn-danger:hover{background:rgba(220,38,38,.1)}
.btn-sm{padding:8px 16px;font-size:13px;width:auto}
.btn-block{width:100%}
.site-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:all .15s}
.site-row:hover{background:var(--panel);border-color:var(--border2);transform:translateX(2px)}
.site-row-main{flex:1;min-width:0}
.site-row-name{font-size:16px;font-weight:600;color:var(--white);margin-bottom:4px}
.site-row-sub{font-family:var(--mono);font-size:12px;color:var(--copper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-row-meta{display:flex;align-items:center;gap:12px;flex-shrink:0}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;display:inline-block}
.badge-live{background:rgba(74,222,128,.15);color:#4ade80}
.badge-draft{background:rgba(251,191,36,.15);color:#fbbf24}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:100px;background:transparent;border:none;padding:14px 20px;color:var(--fog);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn:hover{color:var(--white)}
.tab-btn.tab-active{color:var(--copper);border-bottom-color:var(--copper);background:rgba(204,145,102,.05)}
.editor-area{width:100%;min-height:400px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.7;resize:vertical;outline:none;tab-size:2}
.editor-area:focus{border-color:var(--copper)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--white);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:80px 0}
.toast-wrap{position:fixed;top:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--copper);border-radius:10px;padding:14px 18px;min-width:260px;max-width:380px;color:var(--text);font-size:14px;animation:tIn .25s ease;pointer-events:auto}
.toast.success{border-left-color:#4ade80}
.toast.error{border-left-color:#f87171}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
.overlay.show{display:block}
.modal{display:none;position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:420px;width:100%;text-align:center}
.modal-title{font-family:var(--serif);font-size:24px;color:var(--white);margin-bottom:12px}
.modal-text{color:var(--fog);font-size:14px;margin-bottom:24px;line-height:1.5}
.modal-actions{display:flex;gap:10px}
.file-drop{border:2px dashed var(--border2);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:16px}
.file-drop:hover,.file-drop.dragover{border-color:var(--copper);background:rgba(204,145,102,.05)}
.file-drop-icon{font-size:32px;margin-bottom:8px;opacity:.6}
.file-drop-text{color:var(--fog);font-size:14px}
.file-list{margin-top:16px}
.file-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border-radius:8px;margin-bottom:8px;font-size:13px}
.file-item img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.file-item-info{flex:1;min-width:0}
.file-item-name{font-family:var(--mono);font-size:12px;color:var(--copper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item-copy{background:transparent;border:1px solid var(--border2);color:var(--fog);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer}
.file-item-copy:hover{border-color:var(--copper);color:var(--copper)}
.chart{height:200px;display:flex;align-items:flex-end;gap:4px;padding:16px 0;border-bottom:1px solid var(--border)}
.chart-bar{flex:1;background:var(--copper);border-radius:4px 4px 0 0;min-height:4px;position:relative;transition:all .2s}
.chart-bar:hover{opacity:.8}
.chart-label{text-align:center;font-size:10px;color:var(--ash);margin-top:8px;display:flex;gap:4px}
.chart-label span{flex:1;text-align:center}
.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.template-card{background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .15s}
.template-card:hover{border-color:var(--copper)}
.template-card.active{border-color:var(--copper);background:rgba(204,145,102,.1)}
.template-name{font-size:14px;font-weight:600;color:var(--white);margin-bottom:4px}
.template-desc{font-size:12px;color:var(--fog)}
@media(max-width:1024px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.tb-menu{display:flex}.sb-close{display:flex}}
@media(max-width:640px){.content{padding:20px}.topbar{padding:0 16px}.grid-4{grid-template-columns:1fr 1fr}.grid-3,.grid-2,.template-grid{grid-template-columns:1fr}.page-title{font-size:26px}.card-value{font-size:26px}.editor-area{min-height:300px;font-size:12px;padding:14px}}
.nf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.nf-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;transition:transform .2s,border-color .2s}
.nf-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.nf-thumb{width:100%;aspect-ratio:16/10;background:#000;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.nf-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.nf-card:hover .nf-thumb img{transform:scale(1.06)}
.nf-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 45%,transparent 100%);opacity:0;transition:opacity .2s;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:12px;pointer-events:none}
.nf-card:hover .nf-overlay{opacity:1;pointer-events:auto}
.nf-overlay .btn{padding:8px 14px;font-size:12px;width:100%}
.nf-info{padding:12px 14px;border-top:1px solid var(--border)}
.nf-name{font-family:var(--mono);font-size:12px;color:var(--copper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.nf-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ash);gap:6px}
.nf-badge{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:10px;font-weight:600;background:var(--panel);border:1px solid var(--border2);color:var(--fog);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf-thumb iframe{pointer-events:none}
.nf-preview-frame{width:100%;height:100%;border:0;background:#fff;display:block}
.nf-draft-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ash);font-size:12px;width:100%;height:100%}
.nf-info .nf-meta .badge{font-size:10px;padding:2px 8px}
@media(max-width:640px){.nf-grid{grid-template-columns:repeat(2,1fr);gap:10px}.nf-info{padding:10px}.nf-name{font-size:11px}}

body.chat-fullscreen .sidebar{transform:translateX(-100%) !important}
body.chat-fullscreen .main{margin-left:0 !important}
body.chat-fullscreen .topbar{padding:0 16px !important}
body.chat-fullscreen .content{padding:0 !important;max-width:none !important}
@media(max-width:1024px){body.chat-fullscreen .tb-menu{display:none !important}}

/* ===== CUSTOM MODAL SYSTEM ===== */
.mod-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.mod-overlay.show{opacity:1;visibility:visible}
.mod-card{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:28px;max-width:420px;width:100%;transform:scale(.95);transition:transform .2s cubic-bezier(.4,1.6,.6,1);box-shadow:0 24px 64px rgba(0,0,0,.5)}
.mod-overlay.show .mod-card{transform:scale(1)}
.mod-title{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--white);margin-bottom:10px;line-height:1.25}
.mod-body{font-size:14px;color:var(--fog);line-height:1.55;margin-bottom:24px;white-space:pre-wrap}
.mod-input{width:100%;background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--white);outline:none;font-family:var(--sans);margin-bottom:16px}
.mod-input:focus{border-color:var(--copper)}
.mod-input::placeholder{color:var(--ash)}
.mod-actions{display:flex;gap:10px}
.mod-actions .btn{flex:1;padding:11px 18px;font-size:13.5px}
.mod-btn-cancel{background:transparent;border:1px solid var(--border2);color:var(--white);border-radius:9999px;font-weight:500;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.mod-btn-cancel:hover{border-color:var(--white)}
.mod-btn-ok{background:var(--copper);border:1px solid var(--copper);color:#000;border-radius:9999px;font-weight:600;cursor:pointer;transition:opacity .15s;font-family:var(--sans)}
.mod-btn-ok:hover{opacity:.9}
.mod-btn-danger{background:#dc2626;border-color:#dc2626;color:#fff}
.mod-btn-danger:hover{opacity:.9}

</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <img src="/assets/logoUtama/logoUtama.png" alt="LogoUtama">
      <button class="sb-close" id="sbClose">✕</button>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="tb-menu" id="tbMenu"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="tb-spacer"></div>
      <button class="tb-btn" id="tbBell" title="Notifications" style="position:relative"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="tbBellBadge" style="display:none;position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;background:#cc9166;color:#000;font-size:9px;font-weight:700;border-radius:999px;line-height:16px;text-align:center;box-sizing:border-box">0</span></button>
      <button class="tb-user" id="tbUser"></button>
    </header>
    <div class="content" id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </main>
</div>
<div id="notifDropdown" style="display:none;position:fixed;top:60px;right:16px;width:340px;max-width:calc(100vw - 32px);max-height:440px;background:var(--card);border:1px solid var(--border);border-radius:12px;z-index:200;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.6)"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Confirm</div>
    <div class="modal-text" id="modalText">Are you sure?</div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" onclick="App.closeModal()">Cancel</button>
      <button class="btn btn-danger btn-block" id="modalConfirm">Yes</button>
    </div>
  </div>
</div>

<script>
function toast(msg,type){type=type||'info';var w=document.getElementById('toastWrap');var e=document.createElement('div');e.className='toast '+type;e.textContent=msg;w.appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .2s';setTimeout(function(){e.remove()},200)},4000)}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function copyText(t){navigator.clipboard.writeText(t).then(function(){toast('Copied!','success')})}

var ICONS={
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  globe:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  archive:'<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>',
  code:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
  palette:'<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
  braces:'<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',

  async pageImportZip(){document.getElementById('content').innerHTML='<div class="page-head"><div class="eyebrow">Sites</div><h1 class="page-title">Import ZIP</h1><p class="page-sub">Upload a ZIP file to create a new site</p></div><div class="card" style="max-width:640px"><div class="field"><label class="label">Website Name</label><input type="text" class="input" id="izName" placeholder="My Website"><div class="card-meta" style="margin-top:8px">Subdomain: <strong id="izPreview" style="color:#cc9166">-</strong></div></div><div class="field"><label class="label">Subdomain (optional)</label><input type="text" class="input" id="izSub" placeholder="mywebsite"><div class="card-meta" style="margin-top:8px">Leave empty to auto-generate</div></div><div class="field"><label class="label">ZIP File</label><div class="file-drop" id="izDrop"><div class="file-drop-icon"><svg viewBox="0 0 24 24" style="width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.65"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><div class="file-drop-text">Click or drop ZIP file here</div><div class="file-drop-text" style="font-size:12px;margin-top:4px">Max 20MB · .zip only</div><input type="file" id="izFile" accept=".zip,application/zip" style="display:none"></div></div><div id="izStatus"></div><button class="btn btn-primary btn-block" id="izBtn" style="margin-top:16px" disabled>Create Site from ZIP</button></div>';var nameEl=document.getElementById('izName');var subEl=document.getElementById('izSub');var previewEl=document.getElementById('izPreview');var fileInp=document.getElementById('izFile');var drop=document.getElementById('izDrop');var status=document.getElementById('izStatus');var btn=document.getElementById('izBtn');var zipData=null;function updPrev(){var c=subEl.value.trim().toLowerCase();var a=nameEl.value.trim().toLowerCase().replace(/[^   async pageVisitorStats(){var c=document.getElementById('content');c.innerHTML='<div class="loading-wrap"><div class="spinner"></div></div>';try{var r=await fetch('/api/analytics-overview');var d=await r.json();if(!d.ok)throw new Error(d.error);var head='<div class="page-head"><div class="eyebrow">Analytics</div><h1 class="page-title">Visitor Stats</h1><p class="page-sub">Traffic across all your sites</p></div>';var stats='<div class="grid-4" style="margin-bottom:24px"><div class="card"><div class="card-title">Total Visitors</div><div class="card-value">'+d.total+'</div><div class="card-meta">All time</div></div><div class="card"><div class="card-title">Last 7 Days</div><div class="card-value">'+d.last7+'</div><div class="card-meta">Past week</div></div><div class="card"><div class="card-title">This Month</div><div class="card-value">'+d.month+'</div><div class="card-meta">Current month</div></div><div class="card"><div class="card-title">Live Sites</div><div class="card-value">'+d.liveSites+'</div><div class="card-meta">Published</div></div></div>';var chart='';var daily=d.daily||[];if(daily.length){var max=Math.max.apply(null,daily.map(function(x){return x.count}));var bars='';daily.forEach(function(x){var h=Math.max(4,x.count/max*180);bars+='<div class="chart-bar" style="height:'+h+'px" title="'+x.date+': '+x.count+'"></div>'});var first=daily[0].date.slice(5);var last=daily[daily.length-1].date.slice(5);var labels='<div class="chart-label"><span style="text-align:left">'+first+'</span><span style="text-align:right">'+last+'</span></div>';chart='<div class="card" style="margin-bottom:24px"><div class="card-title" style="margin-bottom:16px">Traffic (30 days)</div><div class="chart">'+bars+'</div>'+labels+'</div>'}else{chart='<div class="card" style="text-align:center;padding:60px;color:var(--fog);margin-bottom:24px">No traffic data yet</div>'}var topSites='<div class="card"><div class="card-title" style="margin-bottom:16px">Top Sites</div>';if(d.topSites&&d.topSites.length){topSites+=d.topSites.map(function(s){return '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:12px"><div style="min-width:0;flex:1"><div style="font-size:14px;color:var(--white);font-weight:500">'+escHtml(s.name)+'</div><div style="font-family:var(--mono);font-size:11px;color:var(--copper);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(s.subdomain)+'.hairiamri.buzz</div></div><span style="color:var(--copper);font-weight:600;font-family:var(--serif);font-size:20px">'+s.count+'</span></div>'}).join('')}else{topSites+='<p style="color:var(--ash);font-size:13px;padding:20px 0;text-align:center">No data</p>'}topSites+='</div>';var recent='<div class="card"><div class="card-title" style="margin-bottom:16px">Recent Activity</div>';if(d.recent&&d.recent.length){recent+=d.recent.map(function(a){var ago=App.timeAgo(a.created_at);return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:12px"><div style="min-width:0;flex:1"><div style="font-family:var(--mono);font-size:12px;color:var(--copper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(a.subdomain)+'.hairiamri.buzz'+escHtml(a.path||'/')+'</div><div style="font-size:11px;color:var(--ash);margin-top:2px">'+escHtml(a.country||'Unknown')+'</div></div><span style="font-family:var(--mono);font-size:10px;color:var(--ash);flex-shrink:0">'+ago+'</span></div>'}).join('')}else{recent+='<p style="color:var(--ash);font-size:13px;padding:20px 0;text-align:center">No activity yet</p>'}recent+='</div>';c.innerHTML=head+stats+chart+'<div class="grid-2">'+topSites+recent+'</div>'}catch(e){c.innerHTML='<div class="card" style="text-align:center;padding:40px"><p style="color:#f87171">Error: '+escHtml(e.message)+'</p></div>'}},
  async pageTrafficSources(){var c=document.getElementById('content');c.innerHTML='<div class="loading-wrap"><div class="spinner"></div></div>';try{var r=await fetch('/api/analytics-sources');var d=await r.json();if(!d.ok)throw new Error(d.error);var head='<div class="page-head"><div class="eyebrow">Analytics</div><h1 class="page-title">Traffic Sources</h1><p class="page-sub">Where your visitors come from</p></div>';function barRow(label,count,pct,accent){return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:12px"><span style="font-size:14px;color:var(--bone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+escHtml(label)+'</span><span style="font-family:var(--mono);font-size:12px;color:'+(accent||'var(--copper)')+';flex-shrink:0">'+count+' · '+pct+'%</span></div><div style="height:6px;background:var(--panel);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(accent||'var(--copper)')+';border-radius:3px;transition:width .3s"></div></div></div>'}var refBox='<div class="card"><div class="card-title" style="margin-bottom:20px">Referrers</div>';if(d.referrers&&d.referrers.length){refBox+=d.referrers.map(function(x){return barRow(x.source,x.count,x.pct)}).join('')}else{refBox+='<p style="color:var(--ash);font-size:13px;padding:20px 0;text-align:center">No data</p>'}refBox+='</div>';var ctryBox='<div class="card"><div class="card-title" style="margin-bottom:20px">Countries</div>';if(d.countries&&d.countries.length){ctryBox+=d.countries.map(function(x){return barRow(x.country,x.count,x.pct)}).join('')}else{ctryBox+='<p style="color:var(--ash);font-size:13px;padding:20px 0;text-align:center">No data</p>'}ctryBox+='</div>';var pathBox='<div class="card"><div class="card-title" style="margin-bottom:20px">Top Pages</div>';if(d.paths&&d.paths.length){pathBox+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="border-bottom:1px solid var(--border)"><th style="text-align:left;padding:8px 0;color:var(--fog);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em">Path</th><th style="text-align:right;padding:8px 0;color:var(--fog);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em">Visits</th><th style="text-align:right;padding:8px 0;color:var(--fog);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em">%</th></tr></thead><tbody>'+d.paths.map(function(x){return '<tr style="border-bottom:1px solid var(--border)"><td style="padding:10px 0;font-family:var(--mono);font-size:12px;color:var(--copper)">'+escHtml(x.path)+'</td><td style="padding:10px 0;text-align:right;color:var(--bone)">'+x.count+'</td><td style="padding:10px 0;text-align:right;color:var(--ash);font-family:var(--mono);font-size:12px">'+x.pct+'%</td></tr>'}).join('')+'</tbody></table></div>'}else{pathBox+='<p style="color:var(--ash);font-size:13px;padding:20px 0;text-align:center">No data</p>'}pathBox+='</div>';var empty=!d.referrers.length&&!d.countries.length&&!d.paths.length;if(empty){c.innerHTML=head+'<div class="card" style="text-align:center;padding:60px"><div style="font-family:var(--serif);font-size:24px;color:white;margin-bottom:8px">No traffic data yet</div><p style="color:var(--ash);font-size:14px">Publish a site and wait for visitors</p></div>';return}c.innerHTML=head+'<div class="grid-2" style="margin-bottom:20px">'+refBox+ctryBox+'</div>'+pathBox}catch(e){c.innerHTML='<div class="card" style="text-align:center;padding:40px"><p style="color:#f87171">Error: '+escHtml(e.message)+'</p></div>'}},
  async pageDevices(){var c=document.getElementById('content');c.innerHTML='<div class="loading-wrap"><div class="spinner"></div></div>';try{var r=await fetch('/api/analytics-devices');var d=await r.json();if(!d.ok)throw new Error(d.error);var head='<div class="page-head"><div class="eyebrow">Analytics</div><h1 class="page-title">Devices</h1><p class="page-sub">What your visitors use</p></div>';if(!d.total){c.innerHTML=head+'<div class="card" style="text-align:center;padding:60px"><div style="font-family:var(--serif);font-size:24px;color:white;margin-bottom:8px">No device data yet</div><p style="color:var(--ash);font-size:14px">Publish a site and wait for visitors</p></div>';return}var DEV_ICONS={Mobile:'<rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',Desktop:'<rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',Tablet:'<rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',Unknown:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>'};function iconFor(name){return DEV_ICONS[name]||DEV_ICONS.Unknown}function barRow(label,count,pct,accent){return '<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:12px"><span style="font-size:14px;color:var(--bone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+escHtml(label)+'</span><span style="font-family:var(--mono);font-size:12px;color:'+(accent||'var(--copper)')+';flex-shrink:0">'+count+' · '+pct+'%</span></div><div style="height:6px;background:var(--panel);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(accent||'var(--copper)')+';border-radius:3px;transition:width .3s"></div></div></div>'}var devCards='<div class="grid-3" style="margin-bottom:24px">'+(d.devices||[]).map(function(x){var ic=iconFor(x.name);return '<div class="card" style="text-align:center"><svg viewBox="0 0 24 24" style="width:36px;height:36px;stroke:#cc9166;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px">'+ic+'</svg><div style="font-family:var(--serif);font-size:32px;color:var(--white);line-height:1;margin-bottom:6px">'+x.pct+'%</div><div style="font-size:13px;color:var(--fog);margin-bottom:4px">'+escHtml(x.name)+'</div><div style="font-family:var(--mono);font-size:11px;color:var(--ash)">'+x.count+' visits</div></div>'}).join('')+'</div>';var browBox='<div class="card"><div class="card-title" style="margin-bottom:20px">Browsers</div>';if(d.browsers&&d.browsers.length){browBox+=d.browsers.map(function(x){return barRow(x.name,x.count,x.pct)}).join('')}else{browBox+='<p style="color:var(--ash);font-size:13px;padding:20px 0;text-align:center">No data</p>'}browBox+='</div>';var osBox='<div class="card"><div class="card-title" style="margin-bottom:20px">Operating Systems</div>';if(d.os&&d.os.length){osBox+=d.os.map(function(x){return barRow(x.name,x.count,x.pct,'#4ade80')}).join('')}else{osBox+='<p style="color:var(--ash);font-size:13px;padding:20px 0;text-align:center">No data</p>'}osBox+='</div>';c.innerHTML=head+devCards+'<div class="grid-2">'+browBox+osBox+'</div>'}catch(e){c.innerHTML='<div class="card" style="text-align:center;padding:40px"><p style="color:#f87171">Error: '+escHtml(e.message)+'</p></div>'}},
  async pageFiles(){var r=await fetch('/api/files');var d=await r.json();if(!d.ok)throw new Error(d.error);var files=d.files||[];var head='<div class="page-head"><div class="eyebrow">Files</div><h1 class="page-title">File Browser</h1><p class="page-sub">All images across your sites</p></div>';if(!files.length){document.getElementById('content').innerHTML=head+'<div class="card" style="text-align:center;padding:60px 40px"><div style="font-family:var(--serif);font-size:28px;color:white;margin-bottom:12px">No files yet</div><p style="color:#9194a1;font-size:15px;margin-bottom:24px">Upload images in a site editor first</p><button class="btn btn-primary btn-sm" onclick="App.go(\'sites\')">← Go to Sites</button></div>';return}
    var toolbar='<div style="margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><input type="text" class="input" id="nfSearch" placeholder="Search file name or site..." style="max-width:340px"><span class="card-meta" id="nfCount" style="margin-left:auto"></span></div>';
    var cards=files.map(function(f){var sz=f.size?(f.size>1024?(f.size/1024).toFixed(1)+' KB':f.size+' B'):'';var nm=escHtml(f.filename);var safeName=nm.replace(/\'/g,'&#39;');return '<div class="nf-card" data-name="'+nm.toLowerCase()+'" data-site="'+escHtml(f.site_name||'').toLowerCase()+'"><div class="nf-thumb"><img src="'+f.url+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"><div class="nf-overlay"><button class="btn btn-primary" onclick="copyText(\''+f.url+'\')"><svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy URL</button><button class="btn btn-danger" onclick="App.deleteFileGlobal('+f.id+',\''+safeName+'\')"><svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button></div></div><div class="nf-info"><div class="nf-name" title="'+nm+'">'+nm+'</div><div class="nf-meta"><span class="nf-badge" title="'+escHtml(f.site_name||'')+'">'+escHtml(f.site_name||'—')+'</span><span>'+sz+'</span></div></div></div>'}).join('');
    document.getElementById('content').innerHTML=head+toolbar+'<div class="nf-grid" id="nfGrid">'+cards+'</div>';
    var inp=document.getElementById('nfSearch');var cnt=document.getElementById('nfCount');var grid=document.getElementById('nfGrid');function applyFilter(){var q=inp.value.trim().toLowerCase();var shown=0;grid.querySelectorAll('.nf-card').forEach(function(el){var ok=!q||el.dataset.name.indexOf(q)>=0||el.dataset.site.indexOf(q)>=0;el.style.display=ok?'':'none';if(ok)shown++});cnt.textContent=shown+' / '+files.length+' file'}inp.addEventListener('input',applyFilter);applyFilter()},
  deleteFileGlobal(id,name){this.openModal('Delete File','Delete "'+name+'"? Continue?',async()=>{try{var r=await fetch('/api/files?id='+id,{method:'DELETE'});var d=await r.json();if(d.ok){toast('File deleted','success');this.closeModal();this.load('files')}else toast(d.error||'Failed','error')}catch(e){toast('Error: '+e.message,'error')}})},
  pagePlaceholder(id){var l=id.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()});document.getElementById('content').innerHTML='<div class="page-head"><div class="eyebrow">Coming Soon</div><h1 class="page-title">'+escHtml(l)+'</h1><p class="page-sub">This module is coming soon</p></div><div class="card" style="text-align:center;padding:60px"><div style="font-size:40px;margin-bottom:16px">🚧</div><div style="font-family:var(--serif);font-size:24px;color:white;margin-bottom:8px">Not ready yet</div></div>'},
  openModal(title,text,onConfirm){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;var btn=document.getElementById('modalConfirm');btn.onclick=onConfirm;document.getElementById('modal').classList.add('show')},

  async init(){var u=await this.checkAuth();if(!u)return;document.getElementById('tbUser').textContent=(u.name||u.email).charAt(0).toUpperCase();document.getElementById('tbMenu').addEventListener('click',function(){App.openSidebar()});document.getElementById('sbClose').addEventListener('click',function(){App.closeSidebar()});document.getElementById('overlay').addEventListener('click',function(){App.closeSidebar()});document.getElementById('tbUser').addEventListener('click',async function(){if(await App.confirm('Log out of your account?',{title:'Log Out',okText:'Log Out',danger:true})){fetch('/api/auth/logout',{method:'POST'}).finally(function(){window.location.href='/'})}});document.getElementById('tbBell').addEventListener('click',function(e){e.stopPropagation();App.toggleNotifDropdown()});document.addEventListener('click',function(e){var dd=document.getElementById('notifDropdown');if(!dd||dd.style.display!=='block')return;if(e.target.closest&&e.target.closest('#notifDropdown'))return;if(e.target.closest&&e.target.closest('#tbBell'))return;App.closeNotifDropdown()});App.loadNotifBadge();window.addEventListener('hashchange',function(){App.route()});this.route()}
};
