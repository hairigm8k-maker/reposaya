<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — HairiHosting</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080a;
  --card: #040406;
  --panel: #121317;
  --border: #1c1d22;
  --border2: #2e3038;
  --text: #e2e3e9;
  --fog: #9194a1;
  --ash: #5e616e;
  --copper: #cc9166;
  --white: #ffffff;
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }

.layout { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: var(--card);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; bottom: 0; left: 0;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform 0.25s ease;
  overflow-y: auto;
}
.sb-brand {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sb-brand img {
  width: 40px;
  filter: brightness(0) invert(1);
}
.sb-close { display: none; background: transparent; border: none; color: var(--fog); font-size: 20px; padding: 4px 8px; }
.sb-nav { flex: 1; padding: 12px; }
.sb-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ash);
  padding: 16px 12px 8px;
}
.sb-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  color: var(--fog);
  font-size: 14px;
  font-weight: 500;
  transition: all 0.15s;
  cursor: pointer;
  margin-bottom: 2px;
}
.sb-link:hover { background: var(--panel); color: var(--white); }
.sb-link.active { background: var(--panel); color: var(--white); }
.sb-link.active::before {
  content: '';
  position: absolute;
  left: 0;
  width: 2px;
  height: 20px;
  background: var(--copper);
}
.sb-link { position: relative; }
.sb-link .sb-icon {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  opacity: 0.85;
}
.sb-link.active .sb-icon,
.sb-link:hover .sb-icon { opacity: 1; }
.sb-icon {
  width: 18px; height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* MAIN */
.main {
  flex: 1;
  margin-left: 260px;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 60px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.tb-menu {
  display: none;
  background: transparent;
  border: none;
  color: var(--text);
  padding: 8px;
}
.tb-menu svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
.tb-spacer { flex: 1; }
.tb-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fog);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.tb-btn:hover { background: var(--panel); color: var(--white); }
.tb-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.tb-user {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--border2);
  color: var(--white);
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 32px;
  max-width: 1400px;
  width: 100%;
}

/* PAGE */
.page-head { margin-bottom: 32px; }
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--copper);
  margin-bottom: 8px;
}
.page-title {
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 400;
  line-height: 1.15;
  color: var(--white);
  margin-bottom: 6px;
}
.page-sub { font-size: 15px; color: var(--fog); }

/* CARDS */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
}
.card-title { font-size: 13px; color: var(--fog); margin-bottom: 8px; }
.card-value { font-family: var(--serif); font-size: 36px; line-height: 1; color: var(--white); }
.card-meta { font-size: 12px; color: var(--ash); margin-top: 8px; }

/* FORM */
.field { margin-bottom: 16px; }
.label { display: block; font-size: 14px; font-weight: 500; color: #c7c9d1; margin-bottom: 8px; }
.input {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: 999px;
  padding: 12px 20px;
  font-size: 15px;
  color: var(--white);
  outline: none;
  transition: border-color 0.15s;
}
.input:focus { border-color: var(--white); background: var(--panel); }
.input::placeholder { color: var(--ash); }

/* BUTTON */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 999px;
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.15s;
}
.btn-primary { background: var(--white); color: #000; width: 100%; }
.btn-primary:hover { background: #d5d5d5; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--white); }
.btn-ghost:hover { border-color: var(--white); }
.btn-sm { padding: 6px 14px; font-size: 13px; width: auto; }

/* TABLE */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th {
  text-align: left;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ash);
  border-bottom: 1px solid var(--border);
}
.tbl td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.tbl tr:hover td { background: var(--panel); }
.tbl tr:last-child td { border-bottom: none; }

/* BADGE */
.badge {
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  display: inline-block;
}
.badge-live { background: rgba(74,222,128,0.15); color: #4ade80; }
.badge-draft { background: rgba(251,191,36,0.15); color: #fbbf24; }

/* LOADING */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: var(--white);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 0;
}

/* TOAST */
.toast-wrap {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--copper);
  border-radius: 10px;
  padding: 14px 18px;
  min-width: 260px;
  max-width: 380px;
  color: var(--text);
  font-size: 14px;
  animation: tIn 0.25s ease;
  pointer-events: auto;
}
.toast.success { border-left-color: #4ade80; }
.toast.error { border-left-color: #f87171; }
@keyframes tIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* OVERLAY */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 99;
}
.overlay.show { display: block; }

/* TABS */
.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  padding: 14px 20px;
  color: var(--fog);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  border-bottom: 2px solid transparent;
}
.tab-btn:hover { color: var(--white); }
.tab-btn.tab-active {
  color: var(--copper);
  border-bottom-color: var(--copper);
  background: rgba(204, 145, 102, 0.05);
}

/* EDITOR TEXTAREA */
.editor-area {
  width: 100%;
  min-height: 500px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  tab-size: 2;
}
.editor-area:focus { border-color: var(--copper); }

@media (max-width: 640px) {
  .editor-area { min-height: 400px; font-size: 12px; padding: 14px; }
}

/* RESPONSIVE */
@media (max-width: 1024px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .tb-menu { display: flex; }
  .sb-close { display: flex; }
}
@media (max-width: 640px) {
  .content { padding: 20px; }
  .topbar { padding: 0 16px; }
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .page-title { font-size: 26px; }
  .card-value { font-size: 26px; }
}
</style>
</head>
<body>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <img src="/assets/logoUtama/logoUtama.png" alt="HairiHosting">
      <button class="sb-close" id="sbClose">✕</button>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">

    <header class="topbar">
      <button class="tb-menu" id="tbMenu">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="tb-spacer"></div>
      <button class="tb-btn" onclick="App.go('sites-new')" title="Buat site baru">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="tb-btn" title="Notifikasi">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="tb-user" id="tbUser"></button>
    </header>

    <div class="content" id="content">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>

  </main>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
// ═══════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════
function toast(msg, type) {
  type = type || 'info';
  var wrap = document.getElementById('toastWrap');
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function() {
    el.style.opacity = '0';
    el.style.transition = 'all 0.2s';
    setTimeout(function() { el.remove(); }, 200);
  }, 4000);
}

// ═══════════════════════════════════════════
// HELPER
// ═══════════════════════════════════════════
function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════
// APP
// ═══════════════════════════════════════════
var App = {
  user: null,

  // ─── AUTH ───
  async checkAuth() {
    try {
      var res = await fetch('/api/auth/session');
      var data = await res.json();
      if (!data.ok || !data.authenticated) {
        window.location.href = '/';
        return null;
      }
      this.user = data.user;
      return data.user;
    } catch (e) {
      window.location.href = '/';
      return null;
    }
  },

  // ─── MENU ───
  icons: {
    home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
    bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
    pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
    archive: '<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>',
    code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
    palette: '<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
    braces: '<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
    eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
    folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
    'file-plus': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>',
    layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
    chart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
    compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
    device: '<rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
    card: '<rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
    user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>'
  },

  menu: [
    { title: 'Overview', items: [
      { id: 'home', label: 'Dashboard', icon: 'home' },
      { id: 'activity', label: 'Aktiviti', icon: 'activity' },
      { id: 'notifications', label: 'Notifikasi', icon: 'bell' },
      { id: 'status', label: 'System Status', icon: 'pulse' }
    ]},
    { title: 'Sites', items: [
      { id: 'sites', label: 'My Sites', icon: 'globe' },
      { id: 'sites-new', label: 'Buat Site Baru', icon: 'plus' },
      { id: 'templates', label: 'Templates', icon: 'grid' },
      { id: 'archived', label: 'Archived', icon: 'archive' }
    ]},
    { title: 'Editor', items: [
      { id: 'editor-html', label: 'HTML Editor', icon: 'code' },
      { id: 'editor-css', label: 'CSS Editor', icon: 'palette' },
      { id: 'editor-js', label: 'JS Editor', icon: 'braces' },
      { id: 'assets', label: 'Asset Upload', icon: 'upload' },
      { id: 'preview', label: 'Live Preview', icon: 'eye' }
    ]},
    { title: 'Files', items: [
      { id: 'files', label: 'File Browser', icon: 'folder' },
      { id: 'zip-import', label: 'Import ZIP', icon: 'file-plus' },
      { id: 'zip-export', label: 'Export ZIP', icon: 'download' }
    ]},
    { title: 'Publishing', items: [
      { id: 'publish', label: 'Publish', icon: 'rocket' },
      { id: 'deployments', label: 'Deployments', icon: 'layers' },
      { id: 'subdomains', label: 'Subdomains', icon: 'link' },
      { id: 'domains', label: 'Custom Domains', icon: 'external' }
    ]},
    { title: 'Analytics', items: [
      { id: 'stats', label: 'Visitor Stats', icon: 'chart' },
      { id: 'traffic', label: 'Traffic Sources', icon: 'compass' },
      { id: 'devices', label: 'Devices', icon: 'device' }
    ]},
    { title: 'Account', items: [
      { id: 'billing', label: 'Billing & Plan', icon: 'card' },
      { id: 'profile', label: 'Profil', icon: 'user' },
      { id: 'security', label: 'Keselamatan', icon: 'shield' },
      { id: 'support', label: 'Support', icon: 'help' }
    ]}
  ],

  renderSidebar() {
    var nav = document.getElementById('sbNav');
    var current = window.location.hash.replace('#/', '') || 'home';
    var self = this;
    var html = '';

    this.menu.forEach(function(section) {
      html += '<div class="sb-title">' + section.title + '</div>';
      section.items.forEach(function(item) {
        var active = item.id === current ? 'active' : '';
        var iconPath = self.icons[item.icon] || self.icons.home;
        html += '<div class="sb-link ' + active + '" onclick="App.go(\'' + item.id + '\')">' +
          '<svg class="sb-icon" viewBox="0 0 24 24">' + iconPath + '</svg>' +
          '<span>' + item.label + '</span>' +
        '</div>';
      });
    });
    nav.innerHTML = html;
  },

  go(id) {
    window.location.hash = '#/' + id;
  },

  // ─── ROUTER ───
  async route() {
    var id = window.location.hash.replace('#/', '') || 'home';
    this.renderSidebar();
    this.closeSidebar();
    await this.load(id);
  },

  async load(id) {
    var content = document.getElementById('content');
    content.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

    try {
      if (id === 'home') return this.pageHome();
      if (id === 'sites') return await this.pageSites();
      if (id === 'sites-new') return this.pageSitesNew();
      return this.pagePlaceholder(id);
    } catch (e) {
      content.innerHTML = '<div class="card" style="text-align:center;padding:40px;"><p style="color:#f87171;">Error: ' + e.message + '</p></div>';
    }
  },

  // ─── PAGES ───
  pageHome() {
    var name = (this.user && this.user.name) || 'User';
    document.getElementById('content').innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">Overview</div>' +
        '<h1 class="page-title">Selamat kembali, ' + name + '</h1>' +
        '<p class="page-sub">Ni ringkasan akaun anda hari ini</p>' +
      '</div>' +
      '<div class="grid-4">' +
        '<div class="card"><div class="card-title">Total Sites</div><div class="card-value">0</div><div class="card-meta">Belum ada site</div></div>' +
        '<div class="card"><div class="card-title">Visitors</div><div class="card-value">0</div><div class="card-meta">7 hari lepas</div></div>' +
        '<div class="card"><div class="card-title">Storage</div><div class="card-value">0 B</div><div class="card-meta">Dari 100 MB</div></div>' +
        '<div class="card"><div class="card-title">Plan</div><div class="card-value" style="font-size:28px;">Free</div><div class="card-meta">3 site max</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title" style="font-size:16px;color:white;margin-bottom:20px;">Aktiviti Terkini</div>' +
        '<div style="text-align:center;padding:40px 20px;color:#5e616e;font-size:14px;">Belum ada aktiviti</div>' +
      '</div>';
  },

  async pageSites() {
    var res = await fetch('/api/sites');
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Gagal load sites');

    if (!data.sites || data.sites.length === 0) {
      document.getElementById('content').innerHTML =
        '<div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;">' +
          '<div><div class="eyebrow">Sites</div><h1 class="page-title">My Sites</h1><p class="page-sub">Senarai semua website anda</p></div>' +
          '<button class="btn btn-primary btn-sm" onclick="App.go(\'sites-new\')">+ Buat Site Baru</button>' +
        '</div>' +
        '<div class="card" style="text-align:center;padding:60px 40px;">' +
          '<div style="font-family:var(--serif);font-size:28px;color:white;margin-bottom:12px;">Belum ada website</div>' +
          '<p style="color:#9194a1;font-size:15px;margin-bottom:24px;">Mula dengan buat website pertama anda.</p>' +
          '<button class="btn btn-primary btn-sm" onclick="App.go(\'sites-new\')">+ Buat Website Baru</button>' +
        '</div>';
      return;
    }

    var html = '<div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;">' +
      '<div><div class="eyebrow">Sites</div><h1 class="page-title">My Sites</h1><p class="page-sub">Senarai semua website anda</p></div>' +
      '<button class="btn btn-primary btn-sm" onclick="App.go(\'sites-new\')">+ Buat Site Baru</button>' +
      '</div>';

    html += '<div class="card" style="padding:0;overflow:hidden;"><table class="tbl">';
    html += '<thead><tr><th>Nama</th><th>Subdomain</th><th>Status</th><th>Dikemaskini</th><th></th></tr></thead><tbody>';

    data.sites.forEach(function(s) {
      var badge = s.status === 'live'
        ? '<span class="badge badge-live">● LIVE</span>'
        : '<span class="badge badge-draft">○ DRAFT</span>';
      html += '<tr>' +
        '<td><strong style="color:white;">' + s.name + '</strong></td>' +
        '<td><span style="font-family:var(--mono);font-size:12px;color:#cc9166;">' + s.subdomain + '.hairiamri.buzz</span></td>' +
        '<td>' + badge + '</td>' +
        '<td style="color:#9194a1;font-size:13px;">' + (s.updated_at || '-') + '</td>' +
        '<td style="text-align:right;"><button class="btn btn-ghost btn-sm" onclick="App.go(\'editor/' + s.id + '\')">Edit</button></td>' +
        '</tr>';
    });

    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
  },

  pageSitesNew() {
    document.getElementById('content').innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">Sites</div>' +
        '<h1 class="page-title">Buat Site Baru</h1>' +
        '<p class="page-sub">Isi maklumat website anda</p>' +
      '</div>' +
      '<div class="card" style="max-width:520px;">' +
        '<div class="field">' +
          '<label class="label">Nama Website</label>' +
          '<input type="text" class="input" id="fName" placeholder="Contoh: My Biz">' +
          '<div class="card-meta" style="margin-top:8px;">Subdomain: <strong id="fPreview" style="color:#cc9166;">-</strong></div>' +
        '</div>' +
        '<div class="field">' +
          '<label class="label">Subdomain (optional)</label>' +
          '<input type="text" class="input" id="fSub" placeholder="mybiz">' +
          '<div class="card-meta" style="margin-top:8px;">Kosongkan untuk auto-generate</div>' +
        '</div>' +
        '<button class="btn btn-primary" id="fBtn" style="margin-top:12px;">Buat Site</button>' +
      '</div>';

    var nameEl = document.getElementById('fName');
    var subEl = document.getElementById('fSub');
    var prevEl = document.getElementById('fPreview');
    var btnEl = document.getElementById('fBtn');

    function update() {
      var custom = subEl.value.trim().toLowerCase();
      var auto = nameEl.value.trim().toLowerCase()
        .replace(/[^a-z0-9-]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '')
        .slice(0, 30);
      var final = custom || auto;
      prevEl.textContent = final ? final + '.hairiamri.buzz' : '-';
    }

    nameEl.addEventListener('input', update);
    subEl.addEventListener('input', update);

    btnEl.onclick = async function() {
      var name = nameEl.value.trim();
      var sub = subEl.value.trim().toLowerCase();

      if (!name) {
        toast('Sila isi nama website', 'error');
        return;
      }

      btnEl.disabled = true;
      btnEl.innerHTML = '<span class="spinner"></span> Mencipta...';

      try {
        var res = await fetch('/api/sites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, subdomain: sub })
        });
        var data = await res.json();

        if (data.ok) {
          toast('Site berjaya dicipta!', 'success');
          setTimeout(function() { App.go('sites'); }, 500);
        } else {
          toast(data.error || 'Gagal cipta site', 'error');
          btnEl.disabled = false;
          btnEl.textContent = 'Buat Site';
        }
      } catch (e) {
        toast('Ralat: ' + e.message, 'error');
        btnEl.disabled = false;
        btnEl.textContent = 'Buat Site';
      }
    };

    update();
    nameEl.focus();
  },

  async pageEditor(siteId) {
    var res = await fetch('/api/sites/' + siteId);
    var data = await res.json();

    if (!data.ok) {
      document.getElementById('content').innerHTML =
        '<div class="card" style="text-align:center;padding:40px;">' +
          '<p style="color:#f87171;">Site tak jumpa</p>' +
          '<button class="btn btn-primary btn-sm" style="margin-top:16px;" onclick="App.go(\'sites\')">← Balik</button>' +
        '</div>';
      return;
    }

    var site = data.site;
    var self = this;

    document.getElementById('content').innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">' +
        '<div>' +
          '<div class="eyebrow">Editor</div>' +
          '<h1 class="page-title" style="margin-bottom:0;">' + site.name + '</h1>' +
          '<p class="page-sub" style="margin-top:4px;font-family:var(--mono);font-size:12px;color:#cc9166;">' + site.subdomain + '.hairiamri.buzz · ' + site.status.toUpperCase() + '</p>' +
        '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<button class="btn btn-ghost btn-sm" onclick="App.go(\'sites\')">← Balik</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="App.openPreview(\'' + site.subdomain + '\')">👁 Live Preview</button>' +
          '<button class="btn btn-primary btn-sm" id="saveBtn">💾 Save</button>' +
        '</div>' +
      '</div>' +

      '<div class="card" style="padding:0;overflow:hidden;">' +
        '<div style="display:flex;border-bottom:1px solid var(--border);">' +
          '<button class="tab-btn tab-active" data-tab="html" onclick="App.switchTab(\'html\')">HTML</button>' +
          '<button class="tab-btn" data-tab="css" onclick="App.switchTab(\'css\')">CSS</button>' +
          '<button class="tab-btn" data-tab="js" onclick="App.switchTab(\'js\')">JS</button>' +
        '</div>' +
        '<div style="padding:16px;">' +
          '<textarea class="editor-area" id="editorHTML" spellcheck="false" style="display:block;">' + (site.html || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</textarea>' +
          '<textarea class="editor-area" id="editorCSS" spellcheck="false" style="display:none;">' + (site.css || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</textarea>' +
          '<textarea class="editor-area" id="editorJS" spellcheck="false" style="display:none;">' + (site.js || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</textarea>' +
        '</div>' +
      '</div>' +

      '<div style="margin-top:20px;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;">' +
        '<div style="font-size:14px;color:var(--fog);margin-bottom:12px;">Selepas siap, klik Publish untuk site jadi LIVE.</div>' +
        '<button class="btn btn-primary btn-sm" id="publishBtn" style="background:#4ade80;color:#000;">🚀 Publish Site</button>' +
      '</div>';

    // Save handler
    document.getElementById('saveBtn').onclick = async function() {
      var btn = this;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Saving...';

      try {
        var res = await fetch('/api/sites/' + siteId, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            html: document.getElementById('editorHTML').value,
            css: document.getElementById('editorCSS').value,
            js: document.getElementById('editorJS').value
          })
        });
        var d = await res.json();
        if (d.ok) {
          toast('Saved!', 'success');
        } else {
          toast(d.error || 'Gagal save', 'error');
        }
      } catch (e) {
        toast('Error: ' + e.message, 'error');
      }
      btn.disabled = false;
      btn.innerHTML = '💾 Save';
    };

    // Publish handler
    document.getElementById('publishBtn').onclick = async function() {
      if (!confirm('Publish site? Site akan LIVE dan accessible.')) return;
      var btn = this;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Publishing...';

      // Save dulu
      await fetch('/api/sites/' + siteId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          html: document.getElementById('editorHTML').value,
          css: document.getElementById('editorCSS').value,
          js: document.getElementById('editorJS').value,
          status: 'live'
        })
      });

      toast('Site LIVE! 🚀', 'success');
      btn.disabled = false;
      btn.innerHTML = '✅ Published';
    };
  },

  switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function(b) {
      b.classList.remove('tab-active');
    });
    document.querySelector('.tab-btn[data-tab="' + tab + '"]').classList.add('tab-active');

    document.getElementById('editorHTML').style.display = tab === 'html' ? 'block' : 'none';
    document.getElementById('editorCSS').style.display = tab === 'css' ? 'block' : 'none';
    document.getElementById('editorJS').style.display = tab === 'js' ? 'block' : 'none';
  },

  openPreview(subdomain) {
    // Buka new tab ke preview route
    window.open('/preview/' + subdomain, '_blank');
  },

  async pagePreviewList() {
    var res = await fetch('/api/sites');
    var data = await res.json();

    if (!data.ok || !data.sites || data.sites.length === 0) {
      document.getElementById('content').innerHTML =
        '<div class="page-head">' +
          '<div class="eyebrow">Preview</div>' +
          '<h1 class="page-title">Live Preview</h1>' +
          '<p class="page-sub">Preview site sebelum publish</p>' +
        '</div>' +
        '<div class="card" style="text-align:center;padding:60px 40px;">' +
          '<p style="color:#9194a1;">Belum ada site. Buat site dulu.</p>' +
          '<button class="btn btn-primary btn-sm" style="margin-top:16px;" onclick="App.go(\'sites-new\')">+ Buat Site</button>' +
        '</div>';
      return;
    }

    var html = '<div class="page-head">' +
      '<div class="eyebrow">Preview</div>' +
      '<h1 class="page-title">Live Preview</h1>' +
      '<p class="page-sub">Buka site dalam tab baru</p>' +
      '</div>';

    html += '<div class="card" style="padding:0;overflow:hidden;"><table class="tbl">';
    html += '<thead><tr><th>Nama</th><th>Subdomain</th><th>Status</th><th></th></tr></thead><tbody>';

    data.sites.forEach(function(s) {
      var badge = s.status === 'live'
        ? '<span class="badge badge-live">● LIVE</span>'
        : '<span class="badge badge-draft">○ DRAFT</span>';

      html += '<tr>' +
        '<td><strong style="color:white;">' + s.name + '</strong></td>' +
        '<td><span style="font-family:var(--mono);font-size:12px;color:#cc9166;">' + s.subdomain + '.hairiamri.buzz</span></td>' +
        '<td>' + badge + '</td>' +
        '<td style="text-align:right;">' +
          '<button class="btn btn-ghost btn-sm" onclick="App.openPreview(\'' + s.subdomain + '\')" style="margin-right:6px;">👁 Preview</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="App.go(\'editor/' + s.id + '\')">Edit</button>' +
        '</td>' +
        '</tr>';
    });

    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
  },

  pagePlaceholder(id) {
    var label = id.replace(/-/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); });
    document.getElementById('content').innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">Coming Soon</div>' +
        '<h1 class="page-title">' + label + '</h1>' +
        '<p class="page-sub">Module ni akan datang dalam fasa seterusnya</p>' +
      '</div>' +
      '<div class="card" style="text-align:center;padding:60px 40px;">' +
        '<div style="font-size:40px;margin-bottom:16px;">🚧</div>' +
        '<div style="font-family:var(--serif);font-size:24px;color:white;margin-bottom:8px;">Belum siap</div>' +
        '<p style="color:#9194a1;font-size:14px;">Module <code style="background:#121317;padding:2px 8px;border-radius:4px;font-family:var(--mono);font-size:13px;color:#cc9166;">' + id + '</code> akan dibina kemudian.</p>' +
      '</div>';
  },

  // ─── SIDEBAR ───
  openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
  },
  closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  },

  async init() {
    var u = await this.checkAuth();
    if (!u) return;

    document.getElementById('tbUser').textContent = (u.name || u.email).charAt(0).toUpperCase();

    document.getElementById('tbMenu').addEventListener('click', function() { App.openSidebar(); });
    document.getElementById('sbClose').addEventListener('click', function() { App.closeSidebar(); });
    document.getElementById('overlay').addEventListener('click', function() { App.closeSidebar(); });

    document.getElementById('tbUser').addEventListener('click', function() {
      if (confirm('Log keluar?')) {
        fetch('/api/auth/logout', { method: 'POST' })
          .finally(function() { window.location.href = '/'; });
      }
    });

    window.addEventListener('hashchange', function() { App.route(); });
    this.route();
  }
};

document.addEventListener('DOMContentLoaded', function() { App.init(); });
window.toast = toast;
</script>

</body>
</html>
