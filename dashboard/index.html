<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — HairiHosting</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#040406;--panel:#121317;--border:#1c1d22;--border2:#2e3038;--text:#e2e3e9;--fog:#9194a1;--ash:#5e616e;--copper:#cc9166;--white:#ffffff;--serif:'Playfair Display',serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
.layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:100;transition:transform .25s;overflow-y:auto;scrollbar-width:thin}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.sb-brand{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-brand img{width:40px;filter:brightness(0) invert(1)}
.sb-close{display:none;background:transparent;border:none;color:var(--fog);font-size:20px;padding:4px 8px}
.sb-nav{flex:1;padding:12px}
.sb-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ash);padding:16px 12px 8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:color .15s}
.sb-title:hover{color:var(--fog)}
.sb-title-arrow{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex-shrink:0}
.sb-title.collapsed .sb-title-arrow{transform:rotate(-90deg)}
.sb-group{max-height:1000px;overflow:hidden;transition:max-height .3s ease}
.sb-group.collapsed{max-height:0}
.sb-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--fog);font-size:14px;font-weight:500;transition:all .15s;cursor:pointer;margin-bottom:2px;position:relative}
.sb-link:hover{background:var(--panel);color:var(--white)}
.sb-link.active{background:var(--panel);color:var(--white)}
.sb-link.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:20px;background:var(--copper)}
.sb-icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.85}
.main{flex:1;margin-left:260px;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:50}
.tb-menu{display:none;background:transparent;border:none;color:var(--text);padding:8px}
.tb-menu svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.tb-spacer{flex:1}
.tb-btn{width:38px;height:38px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--fog);display:flex;align-items:center;justify-content:center}
.tb-btn:hover{background:var(--panel);color:var(--white)}
.tb-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.tb-user{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--border2);color:var(--white);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.content{flex:1;padding:32px;max-width:1400px;width:100%}
.page-head{margin-bottom:32px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin-bottom:8px}
.page-title{font-family:var(--serif);font-size:36px;font-weight:400;line-height:1.15;color:var(--white);margin-bottom:6px}
.page-sub{font-size:15px;color:var(--fog)}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px}
.card-title{font-size:13px;color:var(--fog);margin-bottom:8px}
.card-value{font-family:var(--serif);font-size:36px;line-height:1;color:var(--white)}
.card-meta{font-size:12px;color:var(--ash);margin-top:8px}
.field{margin-bottom:16px}
.label{display:block;font-size:14px;font-weight:500;color:#c7c9d1;margin-bottom:8px}
.input,.select{width:100%;background:transparent;border:1px solid var(--border2);border-radius:999px;padding:12px 20px;font-size:15px;color:var(--white);outline:none}
.input:focus,.select:focus{border-color:var(--white);background:var(--panel)}
.input::placeholder{color:var(--ash)}
.select option{background:#121317;color:var(--white)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:12px 24px;font-size:14px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--white);color:#000;width:100%}
.btn-primary:hover{background:#d5d5d5}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--white)}
.btn-ghost:hover{border-color:var(--white)}
.btn-danger{background:transparent;border:1px solid #dc2626;color:#f87171}
.btn-danger:hover{background:rgba(220,38,38,.1)}
.btn-sm{padding:8px 16px;font-size:13px;width:auto}
.btn-block{width:100%}
.site-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:all .15s}
.site-row:hover{background:var(--panel);border-color:var(--border2);transform:translateX(2px)}
.site-row-main{flex:1;min-width:0}
.site-row-name{font-size:16px;font-weight:600;color:var(--white);margin-bottom:4px}
.site-row-sub{font-family:var(--mono);font-size:12px;color:var(--copper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-row-meta{display:flex;align-items:center;gap:12px;flex-shrink:0}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;display:inline-block}
.badge-live{background:rgba(74,222,128,.15);color:#4ade80}
.badge-draft{background:rgba(251,191,36,.15);color:#fbbf24}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:100px;background:transparent;border:none;padding:14px 20px;color:var(--fog);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn:hover{color:var(--white)}
.tab-btn.tab-active{color:var(--copper);border-bottom-color:var(--copper);background:rgba(204,145,102,.05)}
.editor-area{width:100%;min-height:400px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.7;resize:vertical;outline:none;tab-size:2}
.editor-area:focus{border-color:var(--copper)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--white);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:80px 0}
.toast-wrap{position:fixed;top:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--copper);border-radius:10px;padding:14px 18px;min-width:260px;max-width:380px;color:var(--text);font-size:14px;animation:tIn .25s ease;pointer-events:auto}
.toast.success{border-left-color:#4ade80}
.toast.error{border-left-color:#f87171}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
.overlay.show{display:block}
.modal{display:none;position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:420px;width:100%;text-align:center}
.modal-title{font-family:var(--serif);font-size:24px;color:var(--white);margin-bottom:12px}
.modal-text{color:var(--fog);font-size:14px;margin-bottom:24px;line-height:1.5}
.modal-actions{display:flex;gap:10px}
.file-drop{border:2px dashed var(--border2);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:16px}
.file-drop:hover,.file-drop.dragover{border-color:var(--copper);background:rgba(204,145,102,.05)}
.file-drop-icon{font-size:32px;margin-bottom:8px;opacity:.6}
.file-drop-text{color:var(--fog);font-size:14px}
.file-list{margin-top:16px}
.file-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border-radius:8px;margin-bottom:8px;font-size:13px}
.file-item img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.file-item-info{flex:1;min-width:0}
.file-item-name{font-family:var(--mono);font-size:12px;color:var(--copper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item-copy{background:transparent;border:1px solid var(--border2);color:var(--fog);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer}
.file-item-copy:hover{border-color:var(--copper);color:var(--copper)}
.chart{height:200px;display:flex;align-items:flex-end;gap:4px;padding:16px 0;border-bottom:1px solid var(--border)}
.chart-bar{flex:1;background:var(--copper);border-radius:4px 4px 0 0;min-height:4px;position:relative;transition:all .2s}
.chart-bar:hover{opacity:.8}
.chart-label{text-align:center;font-size:10px;color:var(--ash);margin-top:8px;display:flex;gap:4px}
.chart-label span{flex:1;text-align:center}
.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.template-card{background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .15s}
.template-card:hover{border-color:var(--copper)}
.template-card.active{border-color:var(--copper);background:rgba(204,145,102,.1)}
.template-name{font-size:14px;font-weight:600;color:var(--white);margin-bottom:4px}
.template-desc{font-size:12px;color:var(--fog)}
@media(max-width:1024px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.tb-menu{display:flex}.sb-close{display:flex}}
@media(max-width:640px){.content{padding:20px}.topbar{padding:0 16px}.grid-4{grid-template-columns:1fr 1fr}.grid-3,.grid-2,.template-grid{grid-template-columns:1fr}.page-title{font-size:26px}.card-value{font-size:26px}.editor-area{min-height:300px;font-size:12px;padding:14px}}
.nf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.nf-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;transition:transform .2s,border-color .2s}
.nf-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.nf-thumb{width:100%;aspect-ratio:16/10;background:#000;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.nf-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.nf-card:hover .nf-thumb img{transform:scale(1.06)}
.nf-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 45%,transparent 100%);opacity:0;transition:opacity .2s;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:12px;pointer-events:none}
.nf-card:hover .nf-overlay{opacity:1;pointer-events:auto}
.nf-overlay .btn{padding:8px 14px;font-size:12px;width:100%}
.nf-info{padding:12px 14px;border-top:1px solid var(--border)}
.nf-name{font-family:var(--mono);font-size:12px;color:var(--copper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.nf-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ash);gap:6px}
.nf-badge{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:10px;font-weight:600;background:var(--panel);border:1px solid var(--border2);color:var(--fog);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){.nf-grid{grid-template-columns:repeat(2,1fr);gap:10px}.nf-info{padding:10px}.nf-name{font-size:11px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <img src="/assets/logoUtama/logoUtama.png" alt="HairiHosting">
      <button class="sb-close" id="sbClose">✕</button>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="tb-menu" id="tbMenu"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="tb-spacer"></div>
      <button class="tb-btn" onclick="App.go('sites-new')" title="Buat site baru"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="tb-user" id="tbUser"></button>
    </header>
    <div class="content" id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </main>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Confirm</div>
    <div class="modal-text" id="modalText">Betul?</div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" onclick="App.closeModal()">Batal</button>
      <button class="btn btn-danger btn-block" id="modalConfirm">Ya</button>
    </div>
  </div>
</div>

<script>
function toast(msg,type){type=type||'info';var w=document.getElementById('toastWrap');var e=document.createElement('div');e.className='toast '+type;e.textContent=msg;w.appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .2s';setTimeout(function(){e.remove()},200)},4000)}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function copyText(t){navigator.clipboard.writeText(t).then(function(){toast('Copied!','success')})}

var App={
  user:null,currentSite:null,uploadedFiles:[],
  menu:[
    {title:'Overview',items:[
      {id:'home',label:'Dashboard',icon:'home'},
      {id:'activity',label:'Aktiviti',icon:'activity'},
      {id:'notifications',label:'Notifikasi',icon:'bell'},
      {id:'status',label:'System Status',icon:'pulse'}
    ]},
    {title:'Sites',items:[

  async pageAssets(){var r=await fetch('/api/site');var d=await r.json();if(!d.ok)throw new Error(d.error);var sites=d.sites||[];if(!sites.length){document.getElementById('content').innerHTML='<div class="page-head"><div class="eyebrow">Editor</div><h1 class="page-title">Asset Upload</h1><p class="page-sub">Upload gambar, copy URL, guna dalam HTML</p></div><div class="card" style="text-align:center;padding:60px 40px"><div style="font-family:var(--serif);font-size:28px;color:white;margin-bottom:12px">Belum ada site</div><p style="color:#9194a1;font-size:15px;margin-bottom:24px">Buat site dulu sebelum upload gambar</p><button class="btn btn-primary btn-sm" onclick="App.go(\'sites-new\')">+ Buat Site</button></div>';return}var opts=sites.map(function(s){return '<option value="'+s.id+'">'+escHtml(s.name)+' — '+escHtml(s.subdomain)+'.hairiamri.buzz</option>'}).join('');var dropIcon='<svg viewBox="0 0 24 24" style="width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.65"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';document.getElementById('content').innerHTML='<div class="page-head"><div class="eyebrow">Editor</div><h1 class="page-title">Asset Upload</h1><p class="page-sub">Upload gambar, copy URL, guna dalam HTML</p></div><div class="card" style="max-width:720px;margin-bottom:32px"><div class="field"><label class="label">Pilih Site</label><select class="select" id="assetSite">'+opts+'</select></div><div class="file-drop" id="assetDrop" onclick="document.getElementById(\'assetInput\').click()"><div class="file-drop-icon">'+dropIcon+'</div><div class="file-drop-text">Klik atau drag gambar ke sini</div><div class="file-drop-text" style="font-size:12px;margin-top:4px">Max 1.5MB · JPG, PNG, GIF, WebP, SVG, ICO</div><input type="file" id="assetInput" accept="image/*" style="display:none"></div><div id="assetProgress" style="margin-top:12px"></div></div><div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div class="eyebrow" style="margin:0">Files in this site</div><span class="card-meta" id="assetCount"></span></div><div class="nf-grid" id="assetGrid"></div>';var sel=document.getElementById('assetSite');var inp=document.getElementById('assetInput');var drop=document.getElementById('assetDrop');var grid=document.getElementById('assetGrid');var cnt=document.getElementById('assetCount');var copyIcon='<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';var trashIcon='<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';async function refresh(){grid.innerHTML='<div class="loading-wrap" style="grid-column:1/-1"><div class="spinner"></div></div>';try{var rr=await fetch('/api/files?site='+sel.value);var dd=await rr.json();if(!dd.ok)throw new Error(dd.error);var files=dd.files||[];cnt.textContent=files.length+' file';if(!files.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--fog);font-size:14px">Belum ada file dalam site ni</div>';return}grid.innerHTML=files.map(function(f){var sz=f.size?(f.size>1024?(f.size/1024).toFixed(1)+' KB':f.size+' B'):'';var nm=escHtml(f.filename);var safe=nm.replace(/\'/g,'&#39;');return '<div class="nf-card"><div class="nf-thumb"><img src="'+f.url+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"><div class="nf-overlay"><button class="btn btn-primary" onclick="copyText(\''+f.url+'\')">'+copyIcon+'Copy URL</button><button class="btn btn-danger" onclick="App.deleteFileGlobal('+f.id+',\''+safe+'\')">'+trashIcon+'Padam</button></div></div><div class="nf-info"><div class="nf-name" title="'+nm+'">'+nm+'</div><div class="nf-meta"><span class="nf-badge">'+escHtml(f.site_name||'')+'</span><span>'+sz+'</span></div></div></div>'}).join('')}catch(e){grid.innerHTML='<p style="color:#f87171;grid-column:1/-1">Error: '+escHtml(e.message)+'</p>'}}async function doUpload(file){var prog=document.getElementById('assetProgress');if(file.size>1.5*1024*1024){toast('File > 1.5MB','error');return}prog.innerHTML='<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;font-size:13px"><div class="spinner"></div><span>Uploading '+escHtml(file.name)+'...</span></div>';try{var fd=new FormData();fd.append('file',file);var rr=await fetch('/api/upload?site='+sel.value,{method:'POST',body:fd});var dd=await rr.json();if(dd.ok){toast('Uploaded!','success');prog.innerHTML='<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);border-radius:8px;font-size:13px;color:#4ade80"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg><span>Uploaded: '+escHtml(file.name)+'</span><button class="file-item-copy" style="margin-left:auto" onclick="copyText(\''+dd.url+'\')">Copy URL</button></div>';setTimeout(function(){prog.innerHTML=''},6000);refresh()}else{toast(dd.error||'Gagal','error');prog.innerHTML='<div style="padding:10px 14px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.3);border-radius:8px;font-size:13px;color:#f87171">Gagal: '+escHtml(dd.error||'unknown')+'</div>';setTimeout(function(){prog.innerHTML=''},5000)}}catch(e){toast('Error: '+e.message,'error');prog.innerHTML=''}inp.value=''}sel.addEventListener('change',refresh);inp.onchange=function(e){if(e.target.files[0])doUpload(e.target.files[0])};drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('dragover')});drop.addEventListener('dragleave',function(){drop.classList.remove('dragover')});drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('dragover');if(e.dataTransfer.files[0])doUpload(e.dataTransfer.files[0])});refresh()},
  async pageFiles(){var r=await fetch('/api/files');var d=await r.json();if(!d.ok)throw new Error(d.error);var files=d.files||[];var head='<div class="page-head"><div class="eyebrow">Files</div><h1 class="page-title">File Browser</h1><p class="page-sub">Semua gambar dari setiap site anda</p></div>';if(!files.length){document.getElementById('content').innerHTML=head+'<div class="card" style="text-align:center;padding:60px 40px"><div style="font-family:var(--serif);font-size:28px;color:white;margin-bottom:12px">Belum ada file</div><p style="color:#9194a1;font-size:15px;margin-bottom:24px">Upload gambar dalam editor site dulu</p><button class="btn btn-primary btn-sm" onclick="App.go(\'sites\')">← Ke Sites</button></div>';return}
    var toolbar='<div style="margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><input type="text" class="input" id="nfSearch" placeholder="Cari nama file atau site..." style="max-width:340px"><span class="card-meta" id="nfCount" style="margin-left:auto"></span></div>';
    var cards=files.map(function(f){var sz=f.size?(f.size>1024?(f.size/1024).toFixed(1)+' KB':f.size+' B'):'';var nm=escHtml(f.filename);var safeName=nm.replace(/\'/g,'&#39;');return '<div class="nf-card" data-name="'+nm.toLowerCase()+'" data-site="'+escHtml(f.site_name||'').toLowerCase()+'"><div class="nf-thumb"><img src="'+f.url+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"><div class="nf-overlay"><button class="btn btn-primary" onclick="copyText(\''+f.url+'\')"><svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy URL</button><button class="btn btn-danger" onclick="App.deleteFileGlobal('+f.id+',\''+safeName+'\')"><svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Padam</button></div></div><div class="nf-info"><div class="nf-name" title="'+nm+'">'+nm+'</div><div class="nf-meta"><span class="nf-badge" title="'+escHtml(f.site_name||'')+'">'+escHtml(f.site_name||'—')+'</span><span>'+sz+'</span></div></div></div>'}).join('');
    document.getElementById('content').innerHTML=head+toolbar+'<div class="nf-grid" id="nfGrid">'+cards+'</div>';
    var inp=document.getElementById('nfSearch');var cnt=document.getElementById('nfCount');var grid=document.getElementById('nfGrid');function applyFilter(){var q=inp.value.trim().toLowerCase();var shown=0;grid.querySelectorAll('.nf-card').forEach(function(el){var ok=!q||el.dataset.name.indexOf(q)>=0||el.dataset.site.indexOf(q)>=0;el.style.display=ok?'':'none';if(ok)shown++});cnt.textContent=shown+' / '+files.length+' file'}inp.addEventListener('input',applyFilter);applyFilter()},
  deleteFileGlobal(id,name){this.openModal('Padam File','Padam "'+name+'"? Teruskan?',async()=>{try{var r=await fetch('/api/files?id='+id,{method:'DELETE'});var d=await r.json();if(d.ok){toast('File dipadam','success');this.closeModal();this.load('files')}else toast(d.error||'Gagal','error')}catch(e){toast('Error: '+e.message,'error')}})},
  pagePlaceholder(id){var l=id.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()});document.getElementById('content').innerHTML='<div class="page-head"><div class="eyebrow">Coming Soon</div><h1 class="page-title">'+escHtml(l)+'</h1><p class="page-sub">Module ni akan datang kemudian</p></div><div class="card" style="text-align:center;padding:60px"><div style="font-size:40px;margin-bottom:16px">🚧</div><div style="font-family:var(--serif);font-size:24px;color:white;margin-bottom:8px">Belum siap</div></div>'},
  openModal(title,text,onConfirm){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;var btn=document.getElementById('modalConfirm');btn.onclick=onConfirm;document.getElementById('modal').classList.add('show')},
  closeModal(){document.getElementById('modal').classList.remove('show')},
  openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')},
  closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')},
  async init(){var u=await this.checkAuth();if(!u)return;document.getElementById('tbUser').textContent=(u.name||u.email).charAt(0).toUpperCase();document.getElementById('tbMenu').addEventListener('click',function(){App.openSidebar()});document.getElementById('sbClose').addEventListener('click',function(){App.closeSidebar()});document.getElementById('overlay').addEventListener('click',function(){App.closeSidebar()});document.getElementById('tbUser').addEventListener('click',function(){if(confirm('Log keluar?')){fetch('/api/auth/logout',{method:'POST'}).finally(function(){window.location.href='/'})}});window.addEventListener('hashchange',function(){App.route()});this.route()}
};
document.addEventListener('DOMContentLoaded',function(){App.init()});
window.toast=toast;
window.copyText=copyText;
