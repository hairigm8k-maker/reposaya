<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Try</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --color-carbon-ink: #1d242f;
    --color-prism-teal: #14b8a6;
    --color-mist: #e2e8f0;
    --color-slate: #6b7280;
    --color-bone: #f3f4f6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Inter', system-ui, sans-serif;
    font-feature-settings: "cv01", "cv02", "cv06", "cv07", "cv08", "cv10";
    background: #ffffff;
    color: #111827;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* =========================================
     SPLIT HEADER
     ========================================= */
  .split-header {
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    background: #FAFAF9;
    border-bottom: 1px solid #ebe6df;
    position: sticky;
    top: 0;
    z-index: 100;
    align-items: stretch;
  }

  .split-hamburger {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    background: transparent;
    border: none;
    border-right: 1px solid #ebe6df;
    cursor: pointer;
    transition: background .15s ease;
  }

  .split-hamburger:hover {
    background: var(--color-bone);
  }

  .hamburger-lines {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 24px;
  }

  .hamburger-lines span {
    display: block;
    width: 100%;
    height: 2px;
    background: var(--color-carbon-ink);
    border-radius: 2px;
    transition: all .3s ease;
  }

  .hamburger-lines span:nth-child(2) {
    width: 70%;
  }

  .split-hamburger:hover .hamburger-lines span:nth-child(2) {
    width: 100%;
  }

  .split-logo-block {
    background: #1d242f;
    padding: 24px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .split-logo-block img {
    width: 100px;
    height: auto;
    filter: brightness(0) invert(1);
    display: block;
  }

  .split-datetime {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px 24px;
    border-right: 1px solid #ebe6df;
  }

  .datetime-time {
    font-family: 'Inter', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--color-carbon-ink);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .datetime-divider {
    width: 1px;
    height: 24px;
    background: var(--color-mist);
  }

  .datetime-date {
    font-size: 12px;
    font-weight: 500;
    color: var(--color-slate);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1.3;
  }

  .split-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 20px 32px;
    gap: 32px;
  }

  .split-nav {
    display: flex;
    gap: 28px;
    align-items: center;
  }

  .split-nav a {
    color: var(--color-carbon-ink);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: color .15s ease;
  }

  .split-nav a:hover {
    color: var(--color-prism-teal);
  }

  /* =========================================
     HERO — Video Background
     ========================================= */
  .hero {
    position: relative;
    height: calc(100vh - 90px);
    min-height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }

  .hero-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%) scale(0.85);
    object-fit: contain;
    z-index: 0;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(250, 250, 249, 0.3) 0%,
      rgba(250, 250, 249, 0.15) 50%,
      rgba(250, 250, 249, 0.4) 100%
    );
    z-index: 1;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 1000px;
    width: 100%;
    padding: 0 24px;
  }

  .hero-title {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: clamp(40px, 8vw, 96px);
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.04em;
    color: #0F172A;
    margin: 0;
  }

  .hero-title .accent {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: #0F172A;
  }

  .hero-title .gold {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: #D4AF37;
    letter-spacing: -0.02em;
  }

  /* =========================================
     RESPONSIVE
     ========================================= */
  @media (max-width: 1024px) {
    .split-hamburger { padding: 0 18px; }
    .split-logo-block { padding: 20px 24px; }
    .split-datetime { padding: 16px 18px; gap: 12px; }
    .datetime-time { font-size: 17px; }
    .datetime-date { font-size: 11px; }
    .split-nav { gap: 20px; }
    .split-nav a { font-size: 13px; }
  }

  @media (max-width: 768px) {
    .split-header {
      grid-template-columns: auto auto 1fr;
    }
    .split-hamburger { padding: 0 14px; }
    .hamburger-lines { width: 20px; }
    .split-logo-block { padding: 12px 14px; }
    .split-logo-block img { width: 60px; }
    .split-datetime {
      padding: 12px 14px;
      gap: 10px;
      border-right: none;
      justify-content: flex-end;
    }
    .datetime-time { font-size: 14px; }
    .datetime-divider { height: 18px; }
    .datetime-date { font-size: 10px; }
    .split-right { display: none; }
    .hero { height: calc(100vh - 66px); }
  }
</style>
</head>
<body>

  <header class="split-header">
    <button class="split-hamburger" aria-label="Menu">
      <div class="hamburger-lines">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </button>

    <div class="split-logo-block">
      <img src="assets/logoUtama/logoUtama.png" alt="hairiamri.buzz">
    </div>

    <div class="split-datetime">
      <div class="datetime-time" id="liveTime">--:--:--</div>
      <div class="datetime-divider"></div>
      <div class="datetime-date" id="liveDate">-- --- ----</div>
    </div>

    <div class="split-right">
      <nav class="split-nav">
        <a href="#">Servis</a>
        <a href="#">Proses</a>
        <a href="#">Harga</a>
        <a href="#">FAQ</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <video class="hero-video" autoplay muted loop playsinline>
      <source src="assets/hero-video.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">
        Nak Buat <span class="accent">Landing Page</span><br>
        Yang <span class="gold">Cantik?</span>
      </h1>
    </div>
  </section>

  <script>
    function updateClock() {
      var now = new Date();
      var hari = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
      var bulan = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis'];
      var hh = String(now.getHours()).padStart(2, '0');
      var mm = String(now.getMinutes()).padStart(2, '0');
      var ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveTime').textContent = hh + ':' + mm + ':' + ss;
      document.getElementById('liveDate').textContent = hari[now.getDay()] + ', ' + now.getDate() + ' ' + bulan[now.getMonth()] + ' ' + now.getFullYear();
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
