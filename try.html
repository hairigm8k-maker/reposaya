<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Try — AI Copy Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0a0a0a;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .head img {
    width: 36px;
    height: 36px;
    border-radius: 10px;
  }
  .head h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .sub {
    color: #888;
    font-size: 14px;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* Upload zone */
  .drop {
    background: #141414;
    border: 2px dashed #2a2a2a;
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s ease;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .drop:hover, .drop.dragover {
    border-color: #6ab5ff;
    background: #16181c;
  }
  .drop-icon {
    font-size: 40px;
    margin-bottom: 8px;
    opacity: .6;
  }
  .drop-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .drop-sub {
    font-size: 12px;
    color: #666;
  }
  .drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .preview {
    display: none;
    position: relative;
    margin-bottom: 16px;
    border-radius: 16px;
    overflow: hidden;
    background: #141414;
  }
  .preview.show { display: block; }
  .preview img {
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    display: block;
    background: #0a0a0a;
  }
  .preview-remove {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,.7);
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
  }

  /* Options */
  .opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .opt {
    background: #141414;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .opt label {
    display: block;
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .opt select, .opt input {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    color: #fff;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
  }
  .opt select:focus, .opt input:focus {
    outline: none;
    border-color: #6ab5ff;
  }

  /* Button */
  .btn {
    width: 100%;
    background: #fff;
    color: #0a0a0a;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled {
    opacity: .4;
    cursor: not-allowed;
  }
  .btn.loading {
    background: #222;
    color: #fff;
  }
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid #666;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result */
  .result { display: none; }
  .result.show { display: block; }
  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .result-head h2 {
    font-size: 16px;
    font-weight: 700;
  }
  .result-head button {
    background: transparent;
    border: 1px solid #333;
    color: #aaa;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .result-head button:hover {
    border-color: #666;
    color: #fff;
  }
  .card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
    position: relative;
  }
  .card-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: .05em;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .copy-btn {
    background: transparent;
    border: none;
    color: #666;
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
    font-family: inherit;
    text-transform: none;
    letter-spacing: 0;
  }
  .copy-btn:hover { color: #6ab5ff; }
  .copy-btn.copied { color: #4ade80; }
  .card-content {
    font-size: 14px;
    line-height: 1.6;
    color: #e5e5e5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .card-content.title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    color: #fff;
  }
  .card-content.price {
    font-size: 20px;
    font-weight: 700;
    color: #4ade80;
  }
  .tags-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .tag {
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    color: #aaa;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
  }

  .error {
    background: #1c0f0f;
    border: 1px solid #3a1f1f;
    color: #f87171;
    padding: 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 16px;
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .error.show { display: block; }

  .raw {
    background: #0a0a0a;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 12px;
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: #888;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    line-height: 1.5;
  }
  .raw.show { display: block; }

  .back {
    display: inline-block;
    color: #666;
    text-decoration: none;
    font-size: 13px;
    margin-top: 24px;
  }
  .back:hover { color: #fff; }

  @media (max-width: 480px) {
    .wrap { padding: 16px 16px 60px; }
    .opts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <img src="assets/logoUtama/logoUtama.png" alt="Logo">
    <h1>AI Copy Generator</h1>
  </div>
  <p class="sub">Upload gambar produk atau bisnes anda — AI akan generate title, description, tags & promo text secara automatik. 🌸</p>

  <div class="error" id="errorBox"></div>

  <div class="drop" id="dropZone">
    <div class="drop-icon">📸</div>
    <div class="drop-title">Upload Gambar</div>
    <div class="drop-sub">Tap atau drag & drop · Max 2MB · JPG/PNG/WebP</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="preview" id="preview">
    <img id="previewImg" alt="Preview">
    <button class="preview-remove" id="removeBtn" aria-label="Remove">✕</button>
  </div>

  <div class="opts">
    <div class="opt">
      <label>Bahasa</label>
      <select id="langOpt">
        <option value="bm">Bahasa Melayu</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="opt">
      <label>Tone</label>
      <select id="toneOpt">
        <option value="friendly, professional">Friendly & Profesional</option>
        <option value="casual, fun, energetic">Casual & Fun</option>
        <option value="formal, luxury, premium">Formal & Premium</option>
        <option value="santai, mesra, lemah lembut">Santai & Mesra</option>
      </select>
    </div>
    <div class="opt" style="grid-column: 1 / -1;">
      <label>Jenis Produk / Bisnes</label>
      <input type="text" id="typeInput" placeholder="cth: servis landing page, produk skincare, kedai kopi" value="servis buat landing page">
    </div>
  </div>

  <button class="btn" id="genBtn" disabled>
    <span id="btnText">Generate Copy ✨</span>
  </button>

  <div class="result" id="result">
    <div class="result-head">
      <h2>📄 Hasil</h2>
      <button onclick="resetAll()">Buat Semula</button>
    </div>
    <div id="resultCards"></div>
    <div class="raw" id="rawBox"></div>
  </div>

  <a href="/" class="back">← Kembali ke Utama</a>
</div>

<script>
const $ = id => document.getElementById(id);
let currentImageBase64 = null;

// ============== Upload ==============
$('dropZone').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', (e) => handleFile(e.target.files[0]));

['dragenter', 'dragover'].forEach(ev => {
  $('dropZone').addEventListener(ev, (e) => {
    e.preventDefault();
    $('dropZone').classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(ev => {
  $('dropZone').addEventListener(ev, (e) => {
    e.preventDefault();
    $('dropZone').classList.remove('dragover');
  });
});
$('dropZone').addEventListener('drop', (e) => {
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

function handleFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    return showError('Fail mesti gambar (JPG, PNG, WebP)');
  }
  if (file.size > 2 * 1024 * 1024) {
    return showError('Gambar terlalu besar. Max 2MB.');
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    currentImageBase64 = e.target.result;
    $('previewImg').src = e.target.result;
    $('preview').classList.add('show');
    $('dropZone').style.display = 'none';
    $('genBtn').disabled = false;
    $('errorBox').classList.remove('show');
  };
  reader.readAsDataURL(file);
}

$('removeBtn').addEventListener('click', () => {
  currentImageBase64 = null;
  $('fileInput').value = '';
  $('preview').classList.remove('show');
  $('dropZone').style.display = '';
  $('genBtn').disabled = true;
});

// ============== Generate ==============
$('genBtn').addEventListener('click', async () => {
  if (!currentImageBase64) return;

  $('genBtn').disabled = true;
  $('genBtn').classList.add('loading');
  $('btnText').textContent = 'AI tengah fikir...';
  $('btnText').innerHTML = '<span class="spinner"></span> AI tengah fikir...';
  $('errorBox').classList.remove('show');
  $('result').classList.remove('show');

  try {
    const res = await fetch('/api/generate-copy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        imageBase64: currentImageBase64,
        lang: $('langOpt').value,
        tone: $('toneOpt').value,
        productType: $('typeInput').value || 'general product'
      })
    });

    const json = await res.json();

    if (!json.ok) {
      throw new Error(json.error || 'Unknown error');
    }

    renderResult(json.data, json.parsed_success);
  } catch (err) {
    showError('Gagal generate: ' + err.message);
  }

  $('genBtn').classList.remove('loading');
  $('genBtn').disabled = false;
  $('btnText').textContent = 'Generate Copy ✨';
});

// ============== Render ==============
function renderResult(data, parsed) {
  const box = $('resultCards');
  box.innerHTML = '';

  if (!parsed || !data.title) {
    // Fallback: show raw
    $('rawBox').textContent = data.raw || JSON.stringify(data, null, 2);
    $('rawBox').classList.add('show');
    $('result').classList.add('show');
    return;
  }

  $('rawBox').classList.remove('show');

  const fields = [
    { key: 'title', label: 'Title', class: 'title' },
    { key: 'description', label: 'Description' },
    { key: 'promo', label: 'Promo Text' },
    { key: 'price_suggestion', label: 'Harga Dicadangkan', class: 'price' },
    { key: 'target_audience', label: 'Sasaran' }
  ];

  fields.forEach(f => {
    if (!data[f.key]) return;
    box.appendChild(makeCard(f.label, data[f.key], f.class));
  });

  if (Array.isArray(data.tags) && data.tags.length) {
    const card = document.createElement('div');
    card.className = 'card';
    const label = document.createElement('div');
    label.className = 'card-label';
    label.innerHTML = 'Tags <button class="copy-btn" data-copy="' + escapeAttr(data.tags.join(', ')) + '">Copy</button>';
    const tagsWrap = document.createElement('div');
    tagsWrap.className = 'tags-wrap';
    data.tags.forEach(t => {
      const el = document.createElement('span');
      el.className = 'tag';
      el.textContent = '#' + t.replace(/^#/, '');
      tagsWrap.appendChild(el);
    });
    card.appendChild(label);
    card.appendChild(tagsWrap);
    box.appendChild(card);
  }

  attachCopyButtons();
  $('result').classList.add('show');
  $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function makeCard(label, content, extraClass = '') {
  const card = document.createElement('div');
  card.className = 'card';

  const labelEl = document.createElement('div');
  labelEl.className = 'card-label';
  labelEl.innerHTML = label + ' <button class="copy-btn" data-copy="' + escapeAttr(content) + '">Copy</button>';

  const contentEl = document.createElement('div');
  contentEl.className = 'card-content ' + extraClass;
  contentEl.textContent = content;

  card.appendChild(labelEl);
  card.appendChild(contentEl);
  return card;
}

function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;').replace(/\n/g, ' ');
}

function attachCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.dataset.copy;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove('copied');
        }, 1500);
      });
    });
  });
}

function showError(msg) {
  $('errorBox').textContent = msg;
  $('errorBox').classList.add('show');
  $('errorBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetAll() {
  currentImageBase64 = null;
  $('fileInput').value = '';
  $('preview').classList.remove('show');
  $('dropZone').style.display = '';
  $('genBtn').disabled = true;
  $('result').classList.remove('show');
  $('errorBox').classList.remove('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
