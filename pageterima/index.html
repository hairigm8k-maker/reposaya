<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Terima — Test</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0a0a0a; color: #fff;
    min-height: 100vh; padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 500px; margin: 0 auto; }
  .check {
    width: 60px; height: 60px; margin: 0 auto 20px;
    border-radius: 50%; background: #0f2417;
    border: 2px solid #1e4a2e; color: #4ade80;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  h1 { font-size: 22px; text-align: center; margin-bottom: 6px; }
  p.sub { color: #888; font-size: 13px; text-align: center; margin-bottom: 24px; }
  .card {
    background: #141414; border: 1px solid #222;
    border-radius: 14px; padding: 20px; margin-bottom: 12px;
  }
  .row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid #1e1e1e;
    gap: 16px;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #666; font-size: 12px; flex-shrink: 0; }
  .val { color: #fff; font-size: 14px; text-align: right; word-break: break-word; }
  .val.mono { font-family: 'SF Mono', monospace; font-size: 13px; }
  .ref {
    text-align: center; padding: 12px;
    background: #0f1a24; border: 1px solid #1f3a4a;
    border-radius: 10px; margin-bottom: 12px;
    font-family: 'SF Mono', monospace; font-size: 12px; color: #6ab5ff;
  }
  a.btn {
    display: block; text-align: center;
    background: #fff; color: #0a0a0a;
    padding: 14px; border-radius: 10px;
    text-decoration: none; font-weight: 700; font-size: 15px;
  }
  .empty {
    text-align: center; padding: 40px 20px;
    color: #666; font-size: 14px;
  }
  .empty a { color: #6ab5ff; }
  .loading {
    text-align: center; padding: 60px 20px;
    color: #666; font-size: 14px;
  }
  .spinner {
    width: 24px; height: 24px; margin: 0 auto 16px;
    border: 3px solid #222; border-top-color: #6ab5ff;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap" id="content">
  <div class="loading">
    <div class="spinner"></div>
    Loading...
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyC-AJp-CHodVdfHBGiAHTFHSBWYZh3p44k",
  authDomain: "fikri-2a880.firebaseapp.com",
  databaseURL: "https://fikri-2a880-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fikri-2a880",
  storageBucket: "fikri-2a880.firebasestorage.app",
  messagingSenderId: "844408547984",
  appId: "1:844408547984:web:63336207d709bb9f090615",
  measurementId: "G-1Y114DL775"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

const params = new URLSearchParams(window.location.search);
const key = params.get('key');

if (!key) {
  $('content').innerHTML = '<div class="empty">⚠️ Takde data. Sila isi form dulu.<br><br><a href="/test-form">Kembali ke form</a></div>';
} else {
  loadData(key);
}

async function loadData(key) {
  try {
    const snap = await get(ref(db, 'submissions/' + key));

    if (!snap.exists()) {
      $('content').innerHTML = '<div class="empty">⚠️ Data tak jumpa.<br><br><a href="/test-form">Kembali ke form</a></div>';
      return;
    }

    const d = snap.val();
    const submittedDate = d.submittedAt ? new Date(d.submittedAt).toLocaleString('ms-MY', { timeZone: 'Asia/Kuala_Lumpur' }) : '-';

    $('content').innerHTML = `
      <div class="check">✓</div>
      <h1>Berjaya Disimpan</h1>
      <p class="sub">Data telah disimpan ke Firebase</p>

      <div class="ref">Ref ID: ${d.refId || '-'}</div>

      <div class="card">
        <div class="row">
          <span class="label">Nama</span>
          <span class="val">${d.nama || '-'}</span>
        </div>
        <div class="row">
          <span class="label">No IC</span>
          <span class="val mono">${d.ic || '-'}</span>
        </div>
        <div class="row">
          <span class="label">Alamat</span>
          <span class="val">${d.alamat || '-'}</span>
        </div>
        <div class="row">
          <span class="label">Telefon</span>
          <span class="val mono">${d.telefon || '-'}</span>
        </div>
        <div class="row">
          <span class="label">Email</span>
          <span class="val">${d.email || '-'}</span>
        </div>
        <div class="row">
          <span class="label">Dihantar</span>
          <span class="val">${submittedDate}</span>
        </div>
      </div>

      <a href="/test-form" class="btn">Isi Form Baru</a>
    `;
  } catch (err) {
    console.error('Firebase read error:', err);
    $('content').innerHTML = '<div class="empty">❌ Gagal baca dari Firebase.<br><br>Error: ' + (err.message || 'Unknown') + '<br><br><a href="/test-form">Kembali ke form</a></div>';
  }
}
</script>
</body>
</html>
