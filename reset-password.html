<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password · LogoUtama</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#040406;--panel:#121317;--border:#1c1d22;--border2:#2e3038;--text:#e2e3e9;--fog:#9194a1;--ash:#5e616e;--copper:#cc9166;--white:#fff;--serif:'Playfair Display',serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(204,145,102,.15) 0%,transparent 60%);pointer-events:none}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;position:relative;z-index:1}
.brand{font-family:var(--serif);font-size:26px;color:var(--white);text-align:center;margin-bottom:6px}
.eyebrow{text-align:center;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--copper);margin-bottom:14px}
.sub{text-align:center;color:var(--fog);font-size:14px;margin-bottom:28px;line-height:1.5}
.field{margin-bottom:16px}
.label{display:block;font-size:13px;color:var(--fog);margin-bottom:8px;font-weight:500}
.input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--white);outline:none;font-family:inherit;transition:border-color .15s}
.input:focus{border-color:var(--copper)}
.btn{width:100%;background:var(--copper);color:#000;border:0;padding:14px;border-radius:9999px;font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s;font-family:inherit;margin-top:8px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.strength{margin-top:8px;font-size:12px;display:none}
.strength-bar{height:4px;background:var(--panel);border-radius:2px;overflow:hidden;margin-bottom:6px}
.strength-fill{height:100%;width:0;transition:all .2s}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:16px;display:none}
.alert.error{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.3);color:#f87171;display:block}
.alert.success{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);color:#4ade80;display:block}
.back{text-align:center;margin-top:24px;font-size:13px}
.back a{color:var(--copper);text-decoration:none}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">LogoUtama</div>
  <div class="eyebrow">Reset Password</div>
  <p class="sub" id="subText">Enter your new password</p>
  <div class="alert" id="alertBox"></div>
  <form id="resetForm">
    <div class="field">
      <label class="label">New Password</label>
      <input type="password" class="input" id="pw1" placeholder="Min 8 characters" autocomplete="new-password" required>
      <div class="strength" id="strength">
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <span id="strengthLabel"></span>
      </div>
    </div>
    <div class="field">
      <label class="label">Confirm Password</label>
      <input type="password" class="input" id="pw2" placeholder="Re-enter password" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Reset Password</button>
  </form>
  <div class="back"><a href="/">← Back to Sign In</a></div>
</div>
<script>
var token = new URLSearchParams(window.location.search).get('token');
var alertBox = document.getElementById('alertBox');
var form = document.getElementById('resetForm');
var pw1 = document.getElementById('pw1');
var pw2 = document.getElementById('pw2');
var btn = document.getElementById('submitBtn');
var subText = document.getElementById('subText');

function showAlert(msg, type){ alertBox.className = 'alert ' + type; alertBox.textContent = msg; }
function clearAlert(){ alertBox.className = 'alert'; alertBox.textContent = ''; }

if (!token) {
  showAlert('Invalid reset link. Please request a new one.', 'error');
  form.style.display = 'none';
  subText.textContent = 'Link tidak sah';
}

function strength(p){
  if (!p) return { score: 0, label: '', color: '' };
  var s = 0;
  if (p.length >= 8) s++;
  if (p.length >= 12) s++;
  if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
  if (/[0-9]/.test(p)) s++;
  if (/[^a-zA-Z0-9]/.test(p)) s++;
  if (s <= 2) return { score: 1, label: 'Weak', color: '#f87171' };
  if (s <= 3) return { score: 2, label: 'Medium', color: '#fbbf24' };
  return { score: 3, label: 'Strong', color: '#4ade80' };
}

pw1.addEventListener('input', function(){
  var st = document.getElementById('strength');
  var fill = document.getElementById('strengthFill');
  var lbl = document.getElementById('strengthLabel');
  var s = strength(pw1.value);
  if (!pw1.value) { st.style.display = 'none'; return; }
  st.style.display = 'block';
  fill.style.width = (s.score * 33.3) + '%';
  fill.style.background = s.color;
  lbl.textContent = s.label + ' password';
  lbl.style.color = s.color;
});

form.onsubmit = async function(e){
  e.preventDefault();
  clearAlert();
  var p1 = pw1.value, p2 = pw2.value;
  var errors = [];
  if (!p1) errors.push('Password required');
  if (p1.length < 8) errors.push('Min 8 characters');
  if (!/[a-zA-Z]/.test(p1) || !/[0-9]/.test(p1)) errors.push('Must contain letters and numbers');
  if (p1 !== p2) errors.push('Passwords do not match');
  if (errors.length) { showAlert(errors.join('. '), 'error'); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Resetting...';
  try {
    var r = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: p1, confirm: p2 })
    });
    var d = await r.json();
    if (d.ok) {
      showAlert('Password updated. Redirecting to sign in...', 'success');
      form.style.display = 'none';
      subText.textContent = 'Success';
      setTimeout(function(){ window.location.href = '/'; }, 2500);
    } else {
      showAlert(d.error || 'Failed', 'error');
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  } catch(err) {
    showAlert('Error: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
};
</script>
</body>
</html>
