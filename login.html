<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Log Masuk - hairiamri.buzz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Space Grotesk', -apple-system, 'Segoe UI', Roboto, sans-serif; 
        }
        
        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Garisan RGB di atas */
        .top-rgb {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, 
                #ff0000, #ff7f00, #ffff00, 
                #00ff00, #0000ff, #4b0082, 
                #9403d3, #ff0000);
            background-size: 400% 100%;
            animation: rgbShift 8s linear infinite;
        }
        @keyframes rgbShift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        /* Header minimal */
        .login-header {
            padding: 20px 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .login-header img {
            height: 35px;
            width: auto;
            object-fit: contain;
        }

        /* Container */
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            animation: cardIn 0.5s ease-out;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-card .subtitle {
            font-size: 14px;
            color: #888888;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a4a4a;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e5e5e5;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            background-color: #fafafa;
            color: #1a1a1a;
            transition: 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #1a1a1a;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 10px;
            font-size: 13px;
            color: #888888;
            text-decoration: none;
            transition: 0.2s;
        }
        .forgot-link:hover {
            color: #1a1a1a;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1.5px solid #1a1a1a;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 30px;
            transition: 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-login:hover {
            background-color: #ffffff;
            color: #1a1a1a;
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
            color: #b0b0b0;
            font-size: 12px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #e5e5e5;
        }

        /* Daftar link */
        .register-text {
            text-align: center;
            font-size: 14px;
            color: #888888;
        }
        .register-text a {
            color: #1a1a1a;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1.5px solid #1a1a1a;
            padding-bottom: 1px;
            transition: 0.2s;
        }
        .register-text a:hover {
            opacity: 0.7;
        }

        /* Message */
        .msg {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            min-height: 18px;
        }
        .msg.error { color: #e53e3e; }
        .msg.success { color: #38a169; }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #888888;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            z-index: 10;
        }
        .back-btn:hover {
            color: #1a1a1a;
        }
        .back-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: -2px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .login-card h1 { font-size: 24px; }
            .login-card .subtitle { font-size: 13px; margin-bottom: 25px; }
            .back-btn { top: 15px; left: 15px; }
        }
    </style>
</head>
<body>

    <!-- Garisan RGB atas -->
    <div class="top-rgb"></div>

    <!-- Butang balik ke home -->
    <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Balik
    </a>

    <!-- Header Logo -->
    <div class="login-header">
        <img src="assets/logoUtama/logoUtama.png" alt="Logo">
    </div>

    <!-- Container Login -->
    <div class="login-container">
        <div class="login-card">
            
            <h1>Selamat Kembali</h1>
            <p class="subtitle">Log masuk ke akaun anda untuk meneruskan.</p>

            <form onsubmit="handleLogin(event)">
                <label>Alamat Email</label>
                <input 
                    type="email" 
                    id="emailInput" 
                    class="input-field" 
                    placeholder="nama@contoh.com" 
                    autocomplete="email"
                    required
                >

                <label>Kata Laluan</label>
                <input 
                    type="password" 
                    id="passwordInput" 
                    class="input-field" 
                    placeholder="••••••••" 
                    autocomplete="current-password"
                    required
                >

                <a href="#" class="forgot-link">Lupa kata laluan?</a>

                <button type="submit" class="btn-login" id="btnLogin">Log Masuk</button>
                <p id="msg" class="msg"></p>
            </form>

            <div class="divider">ATAU</div>

            <p class="register-text">
                Belum ada akaun? <a href="daftar.html">Daftar sekarang</a>
            </p>

        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btnLogin');

            if (!email || !password) {
                msg.textContent = 'Sila isi semua ruangan';
                msg.className = 'msg error';
                return;
            }

            btn.innerHTML = '<span class="spinner"></span>Log masuk...';
            btn.disabled = true;
            msg.textContent = '';

            // TODO: Sambung ke sistem auth bila dah siap
            // Buat masa ni, tunjuk mesej demo
            setTimeout(() => {
                msg.textContent = '⚠️ Sistem login belum diaktifkan. Coming soon!';
                msg.className = 'msg error';
                btn.textContent = 'Log Masuk';
                btn.disabled = false;
            }, 1200);
        }
    </script>

</body>
</html>
