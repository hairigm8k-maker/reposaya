<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Console</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--card:#040406;--panel:#121317;--border:#1c1d22;--border2:#2e3038;--text:#e2e3e9;--fog:#9194a1;--ash:#5e616e;--copper:#cc9166;--white:#fff;--serif:'Playfair Display',serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;padding:20px 14px;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.sb-brand .badge{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(204,145,102,.15);color:var(--copper);padding:3px 8px;border-radius:9999px;border:1px solid rgba(204,145,102,.3)}
.sb-brand .name{font-family:var(--serif);font-size:17px;color:var(--white)}
.sb-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--fog);font-size:13.5px;font-weight:500;margin-bottom:2px;cursor:pointer}
.sb-link:hover{background:var(--panel);color:var(--white)}
.sb-link.active{background:var(--panel);color:var(--white);position:relative}
.sb-link.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:16px;background:var(--copper)}
.sb-icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.main{margin-left:220px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:50}
.topbar-spacer{flex:1}
.tb-btn{background:transparent;border:1px solid var(--border);color:var(--fog);padding:7px 14px;border-radius:9999px;font-size:12px;font-weight:500}
.tb-btn:hover{border-color:var(--border2);color:var(--white)}
.content{padding:28px;max-width:1400px;width:100%}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin-bottom:8px}
h1.page-title{font-family:var(--serif);font-size:32px;font-weight:400;color:var(--white);margin-bottom:6px}
.page-sub{font-size:14px;color:var(--fog);margin-bottom:28px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card-title{font-size:12px;color:var(--fog);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.card-value{font-family:var(--serif);font-size:32px;line-height:1;color:var(--white)}
.card-meta{font-size:11px;color:var(--ash);margin-top:8px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--copper);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;justify-content:center;padding:60px}
.toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--copper);border-radius:10px;padding:12px 16px;min-width:240px;max-width:360px;font-size:13px}
.toast.success{border-left-color:#4ade80}
.toast.error{border-left-color:#f87171}
.badge{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.badge-active{background:rgba(74,222,128,.15);color:#4ade80}
.badge-suspended{background:rgba(248,113,113,.15);color:#f87171}
.badge-live{background:rgba(74,222,128,.15);color:#4ade80}
.badge-draft{background:rgba(251,191,36,.15);color:#fbbf24}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fog);border-bottom:1px solid var(--border);font-weight:600}
td{padding:12px;font-size:13px;border-bottom:1px solid var(--border);color:var(--bone)}
tr:hover td{background:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:9999px;padding:10px 18px;font-size:13px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--copper);color:#000}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--white)}
.btn-ghost:hover{border-color:var(--white)}
.btn-danger{background:transparent;border:1px solid #dc2626;color:#f87171}
.btn-danger:hover{background:rgba(220,38,38,.1)}
.btn-sm{padding:6px 12px;font-size:12px}
.input{width:100%;background:transparent;border:1px solid var(--border2);border-radius:9999px;padding:10px 16px;font-size:13.5px;color:var(--white);outline:none;font-family:inherit}
.input:focus{border-color:var(--copper)}
@media(max-width:1024px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.grid-4{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-brand">
      <span class="name">HairiHosting</span>
      <span class="badge">Admin</span>
    </div>
    <nav id="sbNav"></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <button class="tb-btn" onclick="AdminUI.goDashboard()">← Dashboard</button>
      <button class="tb-btn" id="tbLogout">Log Out</button>
    </header>
    <div class="content" id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </main>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="/admin-hh/app.js"></script>
</body>
</html>
