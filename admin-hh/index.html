<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
body{background:#f5f7fb;font-family:Inter,system-ui,sans-serif;color:#1a1a2e;padding:24px;margin:0;font-size:14px;line-height:1.5}
.wrap{max-width:800px;margin:0 auto}
.logo{display:block;margin:0 auto 20px;width:200px;filter:brightness(0) invert(0)}
h1{font-size:22px;font-weight:700;margin-bottom:16px;color:#1a2456}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px;border:1px solid #e4e8f0}
.label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:600}
.val{font-size:14px;color:#1a1a2e;font-family:monospace;background:#f5f7fb;padding:10px;border-radius:6px;word-break:break-all}
.ok{color:#10b981;font-weight:600}
.err{color:#ef4444;font-weight:600}
.btn{display:inline-block;background:#2d5bff;color:#fff;padding:9px 18px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px;margin-right:8px}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/assets/logoUtama/logoUtama.png" alt="HairiHosting">
  <h1>Admin Debug</h1>
  <div class="card">
    <div class="label">Session Status</div>
    <div id="status">Loading...</div>
  </div>
  <div class="card">
    <div class="label">Raw Session Response</div>
    <pre id="raw" class="val">Loading...</pre>
  </div>
  <div id="actions"></div>
</div>
<script>
fetch('/api/auth/session')
  .then(function(r){ return r.json(); })
  .then(function(d){
    document.getElementById('raw').textContent = JSON.stringify(d, null, 2);
    var el = document.getElementById('status');
    var ac = document.getElementById('actions');
    if (!d.ok || !d.authenticated) {
      el.innerHTML = '<span class="err">NOT LOGGED IN</span> — cookies not sent or session expired';
      ac.innerHTML = '<a href="/" class="btn">Go to Login</a>';
    } else if (d.user.role !== 'admin' && d.user.role !== 'superadmin') {
      el.innerHTML = '<span class="err">NOT ADMIN</span> — role is "' + d.user.role + '"';
      ac.innerHTML = '<a href="/dashboard/" class="btn">Go to Dashboard</a>';
    } else {
      el.innerHTML = '<span class="ok">OK — ADMIN CONFIRMED</span> · role: ' + d.user.role + ' · email: ' + d.user.email;
      ac.innerHTML = '<a href="/dashboard/" class="btn">User Dashboard</a>';
    }
  })
  .catch(function(e){
    document.getElementById('status').innerHTML = '<span class="err">FETCH ERROR</span> — ' + e.message;
    document.getElementById('raw').textContent = e.stack || e.message;
  });
</script>
</body>
</html>
