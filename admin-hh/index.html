<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Console</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2d5bff;
  --primary-dark:#1a3fbb;
  --primary-light:#eef3ff;
  --navy:#1a2456;
  --navy-dark:#131a3f;
  --navy-hover:#232f68;
  --card:#ffffff;
  --bg:#f5f7fb;
  --border:#e4e8f0;
  --text:#1a1a2e;
  --muted:#6b7280;
  --ash:#9ca3af;
  --accent-red:#ff5757;
  --success:#10b981;
  --warn:#f59e0b;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.header{background:var(--navy);padding:24px 20px;text-align:center;border-bottom:1px solid var(--navy-dark);position:relative}
.header img{width:min(90vw,500px);height:auto;filter:brightness(0) invert(1);display:inline-block}
.layout{display:flex;min-height:calc(100vh - 120px)}
.sidebar{width:230px;background:var(--navy);padding:20px 0;position:sticky;top:0;align-self:flex-start;max-height:calc(100vh - 120px);overflow-y:auto;flex-shrink:0}
.sb-section{padding:8px 20px 6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:12px}
.sb-link{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.75);font-size:13.5px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.sb-link:hover{background:var(--navy-hover);color:#fff}
.sb-link.active{background:var(--navy-hover);color:#fff;border-left-color:var(--primary);font-weight:600}
.sb-link .badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--accent-red);color:#fff;padding:2px 7px;border-radius:9999px}
.main{flex:1;min-width:0;padding:24px;max-width:1400px}
.page-head{margin-bottom:20px}
.page-head h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.page-head p{font-size:13px;color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);border-radius:14px;padding:28px;color:#fff;margin-bottom:24px;position:relative;overflow:hidden}
.hero h2{font-size:20px;font-weight:700;margin-bottom:8px;position:relative;z-index:1}
.hero p{font-size:13.5px;opacity:.9;position:relative;z-index:1}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 70%);border-radius:50%}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:24px}
.icon-card{background:var(--card);border-radius:12px;padding:20px 12px;text-align:center;cursor:pointer;transition:all .15s;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.icon-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--primary)}
.icon-card .ico{width:44px;height:44px;margin:0 auto 12px;background:var(--primary-light);border-radius:10px;display:flex;align-items:center;justify-content:center}
.icon-card .ico svg{width:22px;height:22px;stroke:var(--primary);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-card .label{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:2px}
.icon-card .sub{font-size:10.5px;color:var(--ash)}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.card-title{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-weight:600}
.card-value{font-size:28px;font-weight:700;color:var(--text);line-height:1}
.card-meta{font-size:11.5px;color:var(--ash);margin-top:6px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;justify-content:center;padding:60px}
.toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:8px;padding:12px 16px;min-width:240px;max-width:360px;font-size:13px;box-shadow:var(--shadow-md);color:var(--text)}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--accent-red)}
.badge{display:inline-block;padding:3px 9px;border-radius:9999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge-active,.badge-live{background:#d1fae5;color:#065f46}
.badge-suspended{background:#fee2e2;color:#991b1b}
.badge-draft{background:#fef3c7;color:#92400e}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--border);font-weight:700}
td{padding:12px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:var(--primary-light)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;transition:all .15s;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--bg);border-color:var(--primary);color:var(--primary)}
.btn-danger{background:#fff;border:1px solid var(--accent-red);color:var(--accent-red)}
.btn-danger:hover{background:var(--accent-red);color:#fff}
.btn-sm{padding:5px 11px;font-size:12px}
.input{width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13.5px;color:var(--text);outline:none;font-family:inherit}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,91,255,.1)}
@media(max-width:1024px){.layout{flex-direction:column}.sidebar{width:100%;position:static;max-height:none}.icon-grid{grid-template-columns:repeat(2,1fr)}.grid-4{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <img src="/assets/logoUtama/logoUtama.png" alt="HairiHosting">
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-section">Overview</div>
    <div class="sb-link active" onclick="AdminUI.go('overview')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span>Dashboard</span>
    </div>
    <div class="sb-section">Manage</div>
    <div class="sb-link" onclick="AdminUI.go('users')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span>Users</span>
    </div>
    <div class="sb-link" onclick="AdminUI.go('sites')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
      <span>Sites</span>
    </div>
    <div class="sb-link" onclick="AdminUI.go('tokens')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      <span>Login Tokens</span>
    </div>
    <div class="sb-link" onclick="AdminUI.go('notify')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
      <span>Broadcast</span>
    </div>
    <div class="sb-section">System</div>
    <div class="sb-link" onclick="AdminUI.go('logs')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Audit Log</span>
    </div>
    <div class="sb-link" onclick="window.location.href='/dashboard/'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>User Dashboard</span>
    </div>
    <div class="sb-link" onclick="if(confirm('Log out?'))fetch('/api/auth/logout',{method:'POST'}).finally(function(){window.location.href='/'})">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Log Out</span>
    </div>
  </aside>
  <main class="main">
    <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </main>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="/admin-hh/admin.js"></script>
</body>
</html>
