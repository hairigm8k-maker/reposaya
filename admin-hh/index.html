<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Console</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.42857143;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none}
a{color:#337ab7;text-decoration:none}
a:hover{color:#23527c;text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#fff;border-right:1px solid #e7e7e7;position:fixed;top:0;bottom:0;left:0;padding:15px 0;overflow-y:auto}
.sb-brand{padding:0 20px 18px;border-bottom:1px solid #e7e7e7;margin-bottom:12px}
.sb-brand .name{display:block;font-size:16px;font-weight:600;color:#337ab7;letter-spacing:-.01em;margin-bottom:4px}
.sb-brand .badge{display:inline-block;font-size:10px;font-weight:700;background:#337ab7;color:#fff;padding:2px 8px;border-radius:3px;letter-spacing:.05em}
.sb-link{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#555;font-size:13.5px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.sb-link:hover{background:#f5f5f5;color:#337ab7}
.sb-link.active{background:#f0f6fb;color:#337ab7;border-left-color:#337ab7;font-weight:600}
.main{margin-left:220px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:50px;background:#fff;border-bottom:1px solid #e7e7e7;display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:50}
.topbar-spacer{flex:1}
.tb-btn{background:#fff;border:1px solid #ccc;color:#333;padding:6px 12px;border-radius:3px;font-size:12px;font-weight:500;transition:all .15s}
.tb-btn:hover{background:#e6e6e6;border-color:#adadad}
.content{padding:20px;max-width:1200px;width:100%}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#777;margin-bottom:6px}
h1.page-title{font-size:22px;font-weight:600;color:#333;margin-bottom:4px}
.page-sub{font-size:13px;color:#777;margin-bottom:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:15px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:#fff;border:1px solid #ddd;border-radius:4px;padding:15px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.card.card-gold{border-top:3px solid #f0ad4e}
.card.card-coral{border-top:3px solid #d9534f}
.card.card-sky{border-top:3px solid #5bc0de}
.card.card-teal{border-top:3px solid #5cb85c}
.card-title{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:600}
.card-value{font-size:28px;line-height:1;color:#333;font-weight:600}
.card-meta{font-size:11.5px;color:#999;margin-top:6px}
.spinner{width:20px;height:20px;border:2px solid #ddd;border-top-color:#337ab7;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;justify-content:center;padding:60px}
.toast-wrap{position:fixed;top:15px;right:15px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid #ddd;border-radius:4px;padding:12px 16px;min-width:240px;max-width:360px;font-size:13px;color:#333;box-shadow:0 2px 6px rgba(0,0,0,.1);border-left:4px solid #337ab7}
.toast.success{border-left-color:#5cb85c}
.toast.error{border-left-color:#d9534f}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge-active,.badge-live{background:#dff0d8;color:#3c763d}
.badge-suspended{background:#f2dede;color:#a94442}
.badge-draft{background:#fcf8e3;color:#8a6d3b}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#777;border-bottom:2px solid #ddd;font-weight:600}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid #eee;color:#333}
tr:hover td{background:#f5f5f5}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:3px;padding:7px 14px;font-size:13px;font-weight:500;transition:all .15s;cursor:pointer}
.btn-primary{background:#337ab7;color:#fff;border-color:#2e6da4}
.btn-primary:hover{background:#286090;border-color:#204d74;color:#fff}
.btn-success{background:#5cb85c;color:#fff;border-color:#4cae4c}
.btn-success:hover{background:#449d44;color:#fff}
.btn-ghost{background:#fff;color:#333;border-color:#ccc}
.btn-ghost:hover{background:#e6e6e6;border-color:#adadad}
.btn-danger{background:#fff;border-color:#d9534f;color:#d9534f}
.btn-danger:hover{background:#d9534f;color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.input{width:100%;background:#fff;border:1px solid #ccc;border-radius:3px;padding:8px 12px;font-size:13.5px;color:#333;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:#66afe9;box-shadow:0 0 8px rgba(102,175,233,.6)}
.input::placeholder{color:#999}
@media(max-width:1024px){.sidebar{transform:translateX(-100%)}.main{margin-left:0}.grid-4{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-brand">
      <span class="name">HairiHosting</span>
      <span class="badge">ADMIN</span>
    </div>
    <nav id="sbNav"></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <button class="tb-btn" onclick="AdminUI.goDashboard()">← Dashboard</button>
      <button class="tb-btn" id="tbLogout">Log Out</button>
    </header>
    <div class="content" id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </main>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="/admin-hh/app.js"></script>
</body>
</html>
