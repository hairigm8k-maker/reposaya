<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Console · Flip7</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#2BA8A2;--teal-lt:#3CC4BD;--teal-dk:#1E8C86;--teal-bg:#E8F6F5;
  --gold:#FFD23F;--gold-lt:#FFE47A;--gold-dk:#E6B800;
  --coral:#EF6C4A;--coral-lt:#FF8A6A;--coral-dk:#D45233;
  --cream:#FFF8E7;--sky:#5DADE2;
  --surface:#EFF8F7;--card:#FFFFFF;
  --success:#27AE60;--error:#E74C3C;
  --text:#1E3B38;--fog:#5A7C78;--ash:#94ABA8;
  --sans:-apple-system,BlinkMacSystemFont,'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --shadow-sm:0 2px 8px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.12);
  --shadow-card:0 4px 20px rgba(43,168,162,.10);
  --shadow-teal-glow:0 4px 20px rgba(43,168,162,.30);
  --shadow-accent-glow:0 4px 20px rgba(255,210,63,.40);
  --shadow-coral-glow:0 4px 20px rgba(239,108,74,.35);
  --shadow-focus:0 0 0 4px rgba(43,168,162,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--card);border-right:2px solid var(--teal-bg);position:fixed;top:0;bottom:0;left:0;padding:20px 12px;overflow-y:auto;box-shadow:var(--shadow-card)}
.sb-brand{display:flex;align-items:center;gap:8px;padding:0 10px 18px;border-bottom:2px dashed var(--teal-bg);margin-bottom:14px}
.sb-brand .name{font-size:15px;font-weight:800;color:var(--teal-dk);letter-spacing:.04em}
.sb-brand .badge{font-size:9px;font-weight:800;letter-spacing:.1em;background:var(--gold);color:var(--teal-dk);padding:3px 8px;border-radius:9999px;box-shadow:var(--shadow-accent-glow)}
.sb-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--fog);font-size:13.5px;font-weight:600;margin-bottom:2px;cursor:pointer;transition:all .2s cubic-bezier(.4,1.6,.6,1)}
.sb-link:hover{background:var(--teal-bg);color:var(--teal-dk)}
.sb-link.active{background:var(--teal);color:#fff;box-shadow:var(--shadow-teal-glow);transform:scale(1.02)}
.main{margin-left:240px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:var(--card);border-bottom:2px solid var(--teal-bg);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-card)}
.topbar-spacer{flex:1}
.tb-btn{background:var(--cream);border:2px solid var(--gold-dk);color:var(--teal-dk);padding:8px 16px;border-radius:9999px;font-size:12px;font-weight:700;transition:all .2s;letter-spacing:.02em}
.tb-btn:hover{background:var(--gold-lt);transform:scale(1.03);box-shadow:var(--shadow-accent-glow)}
.content{padding:28px;max-width:1400px;width:100%}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:6px}
h1.page-title{font-size:28px;font-weight:800;color:var(--teal-dk);margin-bottom:4px;letter-spacing:.04em}
.page-sub{font-size:13.5px;color:var(--fog);margin-bottom:24px;font-weight:500}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:12px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow-card);border-left:6px solid var(--teal-lt)}
.card.card-gold{border-left-color:var(--gold)}
.card.card-coral{border-left-color:var(--coral)}
.card.card-sky{border-left-color:var(--sky)}
.card-title{font-size:11px;color:var(--fog);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;font-weight:700}
.card-value{font-size:32px;line-height:1;color:var(--teal-dk);font-weight:800;letter-spacing:-.02em}
.card-meta{font-size:11.5px;color:var(--ash);margin-top:8px;font-weight:600}
.spinner{width:18px;height:18px;border:3px solid var(--teal-bg);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;justify-content:center;padding:60px}
.toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border-radius:12px;padding:14px 18px;min-width:240px;max-width:360px;font-size:13px;font-weight:600;color:var(--text);box-shadow:var(--shadow-md);border-left:5px solid var(--teal)}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--error)}
.badge{display:inline-block;padding:3px 10px;border-radius:9999px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.badge-active,.badge-live{background:#D1FAE5;color:#065F46}
.badge-suspended{background:#FEE2E2;color:#991B1B}
.badge-draft{background:var(--gold-lt);color:var(--teal-dk)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fog);border-bottom:2px solid var(--teal-bg);font-weight:800}
td{padding:12px;font-size:13px;border-bottom:1px solid var(--teal-bg);color:var(--text);font-weight:500}
tr:hover td{background:var(--teal-bg)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:10px 20px;font-size:13px;font-weight:800;transition:all .2s cubic-bezier(.4,1.6,.6,1);letter-spacing:.02em;min-height:40px;border:0;cursor:pointer}
.btn-primary{background:linear-gradient(180deg,var(--gold-lt) 0%,var(--gold) 100%);color:var(--teal-dk);box-shadow:var(--shadow-accent-glow)}
.btn-primary:hover{transform:scale(1.04);box-shadow:0 6px 24px rgba(255,210,63,.55)}
.btn-primary:active{transform:scale(.96)}
.btn-teal{background:var(--teal);color:#fff;box-shadow:var(--shadow-teal-glow)}
.btn-teal:hover{background:var(--teal-lt);transform:scale(1.04)}
.btn-ghost{background:var(--cream);border:2px solid var(--teal-bg);color:var(--teal-dk)}
.btn-ghost:hover{background:var(--teal-bg);border-color:var(--teal-lt)}
.btn-danger{background:#fff;border:2px solid var(--coral);color:var(--coral-dk)}
.btn-danger:hover{background:var(--coral-lt);color:#fff;box-shadow:var(--shadow-coral-glow)}
.btn-sm{padding:7px 14px;font-size:12px;min-height:32px}
.input{width:100%;background:var(--cream);border:2px solid var(--teal-bg);border-radius:12px;padding:11px 16px;font-size:13.5px;color:var(--text);outline:none;font-family:inherit;font-weight:500;transition:all .2s}
.input:focus{border-color:var(--teal);box-shadow:var(--shadow-focus)}
.input::placeholder{color:var(--ash)}
@media(max-width:1024px){.sidebar{transform:translateX(-100%)}.main{margin-left:0}.grid-4{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-brand">
      <span class="name">HairiHosting</span>
      <span class="badge">ADMIN</span>
    </div>
    <nav id="sbNav"></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <button class="tb-btn" onclick="AdminUI.goDashboard()">← Dashboard</button>
      <button class="tb-btn" id="tbLogout">Log Out</button>
    </header>
    <div class="content" id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </main>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="/admin-hh/app.js"></script>
</body>
</html>
