<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Console</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08080a;color:#e2e3e9;font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.header{text-align:center;padding:32px 20px 24px;background:radial-gradient(circle at 50% 0%,rgba(204,145,102,.10) 0%,transparent 60%)}
.header img{width:min(90vw,600px);height:auto;filter:brightness(0) invert(1);display:inline-block}
.content{flex:1;padding:24px;max-width:1400px;margin:0 auto;width:100%}
.loading-wrap{display:flex;justify-content:center;padding:60px}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.1);border-top-color:#cc9166;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="header">
  <img src="/assets/logoUtama/logoUtama.png" alt="HairiHosting">
</header>
<div class="content" id="content">
  <div class="loading-wrap"><div class="spinner"></div></div>
</div>
</body>
</html>
