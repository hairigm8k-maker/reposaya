function window.adminIcon(name) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function boot() {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js");
    const { getAuth, onAuthStateChanged, signOut } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
    const { getDatabase, ref, get, set } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js");

    const app = initializeApp(config);
    auth = getAuth(app);
    db = getDatabase(app);

    // Render layout
    const navHTML = ADMIN_NAV.map(item => `
      <a href="${item.href}" class="admin-nav-item ${item.id === 'sections' ? 'active' : ''}">
        ${window.adminIcon(item.icon)}<span>${item.label}</span>
      </a>
    `).join('');

    document.getElementById('adminLayout').innerHTML = `
      <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-head">
          <img src="/assets/logoUtama/logoUtama.png" alt="Logo" class="admin-logo">
          <span class="admin-badge">ADMIN</span>
        </div>

        <div class="admin-sidebar-foot">
          <div class="admin-user">
            <div class="admin-user-avatar" id="adminAvatar">A</div>
            <div class="admin-user-info">
              <div class="admin-user-name" id="adminUserName">—</div>
              <div class="admin-user-email" id="adminUserEmail">—</div>
            </div>
          </div>
          <button id="adminLogoutBtn" class="admin-logout-btn">${window.adminIcon('log-out')}<span>Log Keluar</span></button>
        </div>
      </aside>
      <header class="admin-topbar">
        <button class="admin-menu-toggle" id="adminMenuToggle">${window.adminIcon('grid')}</button>
        <h1 class="admin-page-title">Sections Editor</h1>
        <div class="admin-topbar-actions">
          <a href="/index.html" target="_blank" class="admin-topbar-link">${window.adminIcon('external')}<span>Lihat Website</span></a>
        </div>
      </header>
      <div class="admin-overlay" id="adminOverlay"></div>
    `;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;

      const uName = document.getElementById('adminUserName');
      const uEmail = document.getElementById('adminUserEmail');
      const uAvatar = document.getElementById('adminAvatar');
      const logoutBtn = document.getElementById('adminLogoutBtn');
      const menuToggle = document.getElementById('adminMenuToggle');
      const overlay = document.getElementById('adminOverlay');

      if (uName) uName.textContent = user.displayName || 'Admin';
      if (uEmail) uEmail.textContent = user.email;
      if (uAvatar) uAvatar.textContent = (user.displayName || 'A').charAt(0).toUpperCase();

      if (logoutBtn) logoutBtn.onclick = async () => { await signOut(auth); window.location.href = 'index.html'; };
      if (menuToggle) menuToggle.onclick = () => {
        document.getElementById('adminSidebar').classList.toggle('open');
        overlay.classList.toggle('show');
      };
      if (overlay) overlay.onclick = () => {
        document.getElementById('adminSidebar').classList.remove('open');
        overlay.classList.remove('show');
      };

      await loadLang('bm');
      await loadLang('en');
      renderForm();
    });
  } catch (err) {
    document.getElementById('adminMain').innerHTML = `<div class="admin-card"><h3>Ralat Load</h3><p>${err.message}</p></div>`;
  }
}

async function loadLang(lang) {
  try {
    const { getDatabase, ref, get } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js");
    const snap = await get(ref(db, 'sections/' + lang));
    cache[lang] = snap.val() || {};
  } catch (err) {
    cache[lang] = {};
  }
}

function collectForm() {
  const data = cache[currentLang] || {};
  FIELDS.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (el) data[f] = el.value.trim();
  });
  LIST_FIELDS.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (el) data[f] = el.value.split('\n').map(l => l.trim()).filter(Boolean);
  });
  cache[currentLang] = data;
}

function window.adminToast(msg, type) {
  let t = document.getElementById('adminToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'adminToast';
    t.className = 'admin-toast';
    document.body.appendChild(t);
  }
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  t.innerHTML = `<span class="admin-toast-icon">${icons[type]||'✓'}</span><span>${msg}</span>`;
  t.className = `admin-toast admin-toast-${type} show`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}

  collectForm();
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';
  try {
    const { getDatabase, ref, set } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js");
    await set(ref(db, 'sections/bm'), cache.bm);
    await set(ref(db, 'sections/en'), cache.en);
