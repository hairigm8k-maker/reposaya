<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengguna — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js"></script>
</head>
<body class="admin-body">
<div id="adminLayout"></div>
<main class="admin-main" id="adminMain"><p style="color:#888;font-size:13px;">Loading...</p></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const config = { apiKey:"AIzaSyC-AJp-CHodVdfHBGiAHTFHSBWYZh3p44k", authDomain:"fikri-2a880.firebaseapp.com", databaseURL:"https://fikri-2a880-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"fikri-2a880", storageBucket:"fikri-2a880.firebasestorage.app", messagingSenderId:"844408547984", appId:"1:844408547984:web:63336207d709bb9f090615" };
const app = initializeApp(config);
const auth = getAuth(app);
const db = getDatabase(app);

document.getElementById('adminLayout').innerHTML = window.renderAdminLayout('users', 'Pengguna');

let allUsers = [];
let search = '';

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  document.getElementById('adminUserName').textContent = user.displayName || 'Admin';
  document.getElementById('adminUserEmail').textContent = user.email;
  document.getElementById('adminAvatar').textContent = (user.displayName || 'A').charAt(0).toUpperCase();
  document.getElementById('adminLogoutBtn').onclick = async () => { await signOut(auth); window.location.href = 'index.html'; };
  document.getElementById('adminMenuToggle').onclick = () => document.getElementById('adminSidebar').classList.toggle('open');
  loadUsers();
});

function loadUsers() {
  onValue(ref(db, 'playgroundUsers'), (snap) => {
    const data = snap.val() || {};
    allUsers = Object.entries(data).map(([uid, u]) => ({ uid, ...u })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderUsers();
  });
}

function renderUsers() {
  const main = document.getElementById('adminMain');
  let filtered = allUsers;
  if (search) filtered = filtered.filter(u => (u.name||'').toLowerCase().includes(search) || (u.email||'').toLowerCase().includes(search));

  main.innerHTML = `
    <div class="admin-stats-grid">
      <div class="admin-stat-card"><div class="admin-stat-label">Total Pengguna</div><div class="admin-stat-value">${allUsers.length}</div></div>
      <div class="admin-stat-card"><div class="admin-stat-label">Verified</div><div class="admin-stat-value" style="color:#38a169;">${allUsers.filter(u=>u.verified).length}</div></div>
      <div class="admin-stat-card"><div class="admin-stat-label">Pending</div><div class="admin-stat-value" style="color:#d97706;">${allUsers.filter(u=>!u.verified).length}</div></div>
    </div>
    <div class="admin-toolbar">
      <input type="text" id="searchInput" class="admin-search-input" placeholder="🔍 Cari nama atau email..." value="${search}">
    </div>
    ${filtered.length === 0 ? `<div class="admin-empty">${window.adminIcon('users')}<h3>Takde pengguna</h3></div>` : filtered.map(u => `
      <div class="admin-item">
        <div class="admin-item-info">
          <h3>${u.name || 'Tanpa Nama'}</h3>
          <div class="admin-item-meta">
            <span>${u.email || ''}</span>
            <span>${u.phone || ''}</span>
            <span>${window.timeAgo(u.createdAt)}</span>
            ${u.verified ? '<span class="admin-badge-status admin-badge-verified">Verified</span>' : '<span class="admin-badge-status admin-badge-pending">Pending</span>'}
          </div>
        </div>
        <div class="admin-item-actions">
          <a href="mailto:${u.email}" style="padding:8px 14px;border-radius:8px;background:#f5f5f5;color:#1a1a1a;font-size:12px;font-weight:600;text-decoration:none;">Email</a>
        </div>
      </div>
    `).join('')}
  `;
  document.getElementById('searchInput')?.addEventListener('input', (e) => { search = e.target.value.toLowerCase(); renderUsers(); });
}
</script>
</body>
</html>
