<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Test Form</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0a0a0a; color: #fff;
    min-height: 100vh; padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 500px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p.sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  label {
    display: block; font-size: 12px; color: #888;
    margin-bottom: 6px; text-transform: uppercase;
    letter-spacing: 1px; font-weight: 600;
  }
  input, textarea {
    width: 100%; background: #141414;
    border: 1px solid #222; color: #fff;
    padding: 12px 14px; border-radius: 10px;
    font-size: 14px; font-family: inherit;
    outline: none;
  }
  input:focus, textarea:focus { border-color: #6ab5ff; }
  textarea { min-height: 80px; resize: vertical; }
  button {
    width: 100%; background: #fff; color: #0a0a0a;
    border: none; padding: 14px; border-radius: 10px;
    font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    margin-top: 8px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status {
    padding: 12px; border-radius: 10px;
    font-size: 13px; margin-bottom: 16px;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: #0f2417; color: #4ade80; border: 1px solid #1e4a2e; }
  .status.err { background: #1c0f0f; color: #f87171; border: 1px solid #3a1f1f; }
  .status.loading { background: #0f1a24; color: #6ab5ff; border: 1px solid #1f3a4a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Test Form</h1>
  <p class="sub">Isi & hantar — data masuk Firebase</p>

  <div class="status" id="status"></div>

  <form id="form">
    <div class="field">
      <label>Nama Penuh</label>
      <input type="text" name="nama" required placeholder="Ahmad bin Ali" maxlength="100">
    </div>

    <div class="field">
      <label>Nombor IC (12 digit)</label>
      <input type="text" name="ic" required placeholder="990101011234" pattern="[0-9]{12}" maxlength="12" inputmode="numeric">
    </div>

    <div class="field">
      <label>Alamat</label>
      <textarea name="alamat" required placeholder="No 1, Jalan Contoh, 50000 Kuala Lumpur" maxlength="500"></textarea>
    </div>

    <div class="field">
      <label>No Telefon</label>
      <input type="tel" name="telefon" required placeholder="0123456789" maxlength="20">
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" name="email" required placeholder="email@example.com">
    </div>

    <button type="submit" id="btn">Hantar</button>
  </form>
</div>

<!-- Firebase SDK v10 (modular via CDN) -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, push, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyC-AJp-CHodVdfHBGiAHTFHSBWYZh3p44k",
  authDomain: "fikri-2a880.firebaseapp.com",
  databaseURL: "https://fikri-2a880-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fikri-2a880",
  storageBucket: "fikri-2a880.firebasestorage.app",
  messagingSenderId: "844408547984",
  appId: "1:844408547984:web:63336207d709bb9f090615",
  measurementId: "G-1Y114DL775"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const $ = id => document.getElementById(id);

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('btn');
  const status = $('status');
  status.className = 'status';
  
  btn.disabled = true;
  btn.textContent = 'Menghantar...';
  status.className = 'status show loading';
  status.textContent = '⏳ Menghantar ke Firebase...';

  const formData = new FormData(e.target);
  const raw = Object.fromEntries(formData.entries());

  // Validate IC (12 digit)
  const icClean = raw.ic.replace(/\D/g, '');
  if (icClean.length !== 12) {
    status.className = 'status show err';
    status.textContent = '❌ IC mesti 12 digit';
    btn.disabled = false;
    btn.textContent = 'Hantar';
    return;
  }

  // Prepare data
  const data = {
    nama: raw.nama.trim(),
    ic: icClean,
    alamat: raw.alamat.trim(),
    telefon: raw.telefon.trim(),
    email: raw.email.trim(),
    submittedAt: Date.now(),
    refId: 'TEST-' + Date.now().toString(36).toUpperCase()
  };

  try {
    // Push ke Firebase — auto-generate key
    const submissionsRef = ref(db, 'submissions');
    const newRef = push(submissionsRef);
    await set(newRef, data);

    // Simpan untuk page terima baca
    sessionStorage.setItem('formData', JSON.stringify(data));
    sessionStorage.setItem('firebaseKey', newRef.key);

    status.className = 'status show ok';
    status.textContent = '✅ Berjaya! Redirecting...';
    setTimeout(() => {
      window.location.href = '/pageterima';
    }, 800);
  } catch (err) {
    console.error('Firebase error:', err);
    status.className = 'status show err';
    status.textContent = '❌ ' + (err.message || 'Gagal hantar');
    btn.disabled = false;
    btn.textContent = 'Hantar';
  }
});
</script>
</body>
</html>
