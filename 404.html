<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>404 — Halaman Tidak Dijumpai | hairiamri.buzz</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ============================================
   RESET OVERRIDE — elak konflik dengan style.css
   ============================================ */
html, body {
  padding: 0 !important;
  margin: 0 !important;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  background: #ffffff;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ============================================
   HEADER — sticky & proper z-index
   ============================================ */
.main-nav {
  position: sticky !important;
  top: 0;
  z-index: 1000;
  flex-shrink: 0;
}

.divider-bar {
  flex-shrink: 0;
  position: relative;
  z-index: 999;
}

/* ============================================
   404 SECTION — flex fill remaining space
   ============================================ */
.error-section {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px 60px;
  position: relative;
  overflow: hidden;
  min-height: 0;
  isolation: isolate;
}

.error-content {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ============================================
   BACKGROUND DECORATION — blob halus
   ============================================ */
.error-section::before,
.error-section::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.12;
  pointer-events: none;
  z-index: 0;
}
.error-section::before {
  width: 260px;
  height: 260px;
  background: #E31E24;
  top: 0;
  left: -80px;
  animation: floatBlob 8s ease-in-out infinite;
}
.error-section::after {
  width: 320px;
  height: 320px;
  background: #1a1a1a;
  bottom: 0;
  right: -100px;
  animation: floatBlob 10s ease-in-out infinite reverse;
}
@keyframes floatBlob {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(20px, -20px) scale(1.1); }
}

/* ============================================
   ICON — pulse effect
   ============================================ */
.error-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #fef2f2;
  color: #E31E24;
  margin-bottom: 20px;
  animation: pulseIcon 2s ease-in-out infinite;
  flex-shrink: 0;
}
.error-icon svg {
  width: 26px;
  height: 26px;
}
@keyframes pulseIcon {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(227,30,36,0.3);
  }
  50% {
    transform: scale(1.06);
    box-shadow: 0 0 0 12px rgba(227,30,36,0);
  }
}

/* ============================================
   404 TEXT — responsive + glitch via text-shadow
   ============================================ */
.error-404 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(72px, 22vw, 140px);
  font-weight: 900;
  line-height: 0.9;
  letter-spacing: -0.05em;
  color: #1a1a1a;
  margin: 0 0 16px 0;
  padding: 0;
  display: block;
  text-align: center;
  animation: float404 4s ease-in-out infinite, glitchText 3.5s infinite;
  will-change: transform, text-shadow;
  user-select: none;
}
@keyframes float404 {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes glitchText {
  0%, 88%, 100% { text-shadow: 0 0 0 transparent; }
  90% { text-shadow: -3px 0 0 #E31E24, 3px 0 0 #1a1a1a; }
  92% { text-shadow: 3px 0 0 #E31E24, -3px 0 0 #1a1a1a; }
  94% { text-shadow: -2px 0 0 #E31E24, 2px 0 0 #1a1a1a; }
  96% { text-shadow: 2px 0 0 #E31E24; }
  98% { text-shadow: -1px 0 0 #E31E24; }
}

/* ============================================
   TEXT CONTENT
   ============================================ */
.error-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(22px, 6vw, 30px);
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin: 0 0 12px 0;
  padding: 0;
}

.error-desc {
  font-family: 'Inter', sans-serif;
  font-size: clamp(14px, 3.5vw, 15px);
  color: #666;
  line-height: 1.6;
  max-width: 420px;
  margin: 0 auto 32px;
  padding: 0 4px;
}

/* ============================================
   BUTTONS — proper alignment
   ============================================ */
.error-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  width: 100%;
  padding: 0;
  margin: 0;
}

.btn-404-primary,
.btn-404-outline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 26px;
  border-radius: 100px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  transition: 0.25s;
  cursor: pointer;
  border: none;
  white-space: nowrap;
  min-height: 48px;
  box-sizing: border-box;
}

.btn-404-primary {
  background: #E31E24;
  color: #ffffff;
  box-shadow: 0 8px 20px rgba(227,30,36,0.3);
}
.btn-404-primary:hover {
  background: #c4161c;
  transform: translateY(-2px);
  box-shadow: 0 12px 26px rgba(227,30,36,0.4);
}
.btn-404-primary:active {
  transform: translateY(0);
}

.btn-404-outline {
  background: transparent;
  color: #1a1a1a;
  border: 1.5px solid #1a1a1a;
}
.btn-404-outline:hover {
  background: #1a1a1a;
  color: #ffffff;
  transform: translateY(-2px);
}
.btn-404-outline:active {
  transform: translateY(0);
}

.btn-404-primary svg,
.btn-404-outline svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* ============================================
   TABLET (>= 640px)
   ============================================ */
@media (min-width: 640px) {
  .error-section {
    padding: 60px 40px 80px;
  }
  .error-content {
    max-width: 600px;
  }
}

/* ============================================
   MOBILE (<= 600px)
   ============================================ */
@media (max-width: 600px) {
  .error-section {
    padding: 32px 18px 48px;
    align-items: flex-start;
  }
  .error-content {
    padding-top: 16px;
  }
  .error-icon {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
  }
  .error-icon svg {
    width: 22px;
    height: 22px;
  }
  .error-404 {
    margin-bottom: 12px;
  }
  .error-desc {
    margin-bottom: 26px;
  }
  .error-actions {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    max-width: 280px;
    margin: 0 auto;
  }
  .btn-404-primary,
  .btn-404-outline {
    width: 100%;
    padding: 14px 20px;
  }
}

/* ============================================
   SMALL MOBILE (<= 380px)
   ============================================ */
@media (max-width: 380px) {
  .error-404 {
    letter-spacing: -0.06em;
  }
  .error-desc {
    font-size: 13px;
  }
}

/* ============================================
   HIDE FLOATING ELEMENTS dari style.css
   ============================================ */
.wa-float,
.bottom-nav,
.profile-link,
.arrow-btn {
  /* Jangan render pada 404 (kalau ada dalam cache atau HTML) */
}
</style>
