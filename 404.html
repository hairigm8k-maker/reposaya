<style>
/* ============================================
   404 PAGE
   ============================================ */
body {
  overflow-x: hidden;
}

.error-section {
  min-height: calc(100vh - 130px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px 80px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* Dekorasi background */
.error-section::before,
.error-section::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
  pointer-events: none;
  z-index: 0;
}
.error-section::before {
  width: 300px;
  height: 300px;
  background: #E31E24;
  top: 10%;
  left: -100px;
  animation: floatBlob 8s ease-in-out infinite;
}
.error-section::after {
  width: 400px;
  height: 400px;
  background: #1a1a1a;
  bottom: 10%;
  right: -150px;
  animation: floatBlob 10s ease-in-out infinite reverse;
}
@keyframes floatBlob {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(30px, -30px) scale(1.1); }
}

.error-content {
  position: relative;
  z-index: 2;
  max-width: 560px;
  width: 100%;
}

/* 404 Text dengan glitch effect */
.error-404 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 120px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -8px;
  color: #1a1a1a;
  margin-bottom: 20px;
  position: relative;
  display: inline-block;
  animation: float404 4s ease-in-out infinite;
}
@keyframes float404 {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

/* Glitch layers */
.error-404::before,
.error-404::after {
  content: '404';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}
.error-404::before {
  color: #E31E24;
  z-index: -1;
  animation: glitch1 3s infinite;
  clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
}
.error-404::after {
  color: #1a1a1a;
  z-index: -2;
  animation: glitch2 3s infinite;
  clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
}

@keyframes glitch1 {
  0%, 90%, 100% { transform: translate(0, 0); }
  92% { transform: translate(-4px, -2px); }
  94% { transform: translate(4px, 2px); }
  96% { transform: translate(-2px, 2px); }
  98% { transform: translate(2px, -2px); }
}
@keyframes glitch2 {
  0%, 90%, 100% { transform: translate(0, 0); }
  92% { transform: translate(4px, 2px); }
  94% { transform: translate(-4px, -2px); }
  96% { transform: translate(2px, -2px); }
  98% { transform: translate(-2px, 2px); }
}

.error-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 32px;
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: -1px;
  margin-bottom: 12px;
  animation: fadeInUp 0.6s ease-out 0.2s both;
}

.error-desc {
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: #666;
  line-height: 1.7;
  max-width: 400px;
  margin: 0 auto 32px;
  animation: fadeInUp 0.6s ease-out 0.35s both;
}

.error-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  animation: fadeInUp 0.6s ease-out 0.5s both;
}

.btn-404-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #E31E24;
  color: #ffffff;
  padding: 14px 28px;
  border-radius: 100px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 8px 24px rgba(227,30,36,0.35);
  transition: 0.25s;
  border: none;
  cursor: pointer;
}
.btn-404-primary:hover {
  background: #c4161c;
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(227,30,36,0.45);
}
.btn-404-primary svg { width: 16px; height: 16px; }

.btn-404-outline {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  color: #1a1a1a;
  padding: 14px 28px;
  border-radius: 100px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  border: 1.5px solid #1a1a1a;
  transition: 0.25s;
}
.btn-404-outline:hover {
  background: #1a1a1a;
  color: #ffffff;
  transform: translateY(-2px);
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Dekorasi icon kecil */
.error-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #fef2f2;
  margin-bottom: 24px;
  color: #E31E24;
  animation: pulse 2s ease-in-out infinite;
}
.error-icon svg { width: 28px; height: 28px; }
@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(227,30,36,0.3); }
  50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(227,30,36,0); }
}

@media (max-width: 600px) {
  .error-404 { font-size: 100px; letter-spacing: -6px; }
  .error-title { font-size: 24px; }
  .error-desc { font-size: 14px; }
  .error-actions { flex-direction: column; align-items: stretch; max-width: 280px; margin: 0 auto; }
  .btn-404-primary, .btn-404-outline { justify-content: center; }
}
</style>
</head>
