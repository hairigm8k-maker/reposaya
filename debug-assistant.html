<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050505">
<title>Debug AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: #050505; color: #e8e8e8;
    -webkit-font-smoothing: antialiased; min-height: 100vh; font-size: 15px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 140px; }
  .head { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #141414; margin-bottom: 20px; }
  .head-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #6ab5ff, #4a8fe7); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .head h1 { font-size: 17px; font-weight: 600; }
  .head p { font-size: 12px; color: #666; margin-top: 3px; }
  .ctx-toggle { background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; }
  .ctx-toggle:hover { border-color: #2a2a2a; color: #ccc; }
  .ctx-panel { display: none; background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .ctx-panel.open { display: block; }
  .ctx-panel textarea { width: 100%; background: #050505; border: 1px solid #1a1a1a; color: #fff; padding: 12px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; min-height: 120px; resize: vertical; line-height: 1.6; outline: none; }
  .ctx-panel textarea:focus { border-color: #6ab5ff; }
  .quick-title { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #555; margin-bottom: 10px; font-weight: 600; }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
  .quick-btn { background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 10px; padding: 12px 14px; cursor: pointer; font-family: inherit; color: #bbb; font-size: 13px; text-align: left; display: flex; align-items: center; gap: 8px; }
  .quick-btn:hover { border-color: #6ab5ff; background: #12161a; color: #fff; }
  .chat { display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 12px 16px; border-radius: 14px; font-size: 14.5px; line-height: 1.55; word-wrap: break-word; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #fff; color: #0a0a0a; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #0f0f0f; color: #e8e8e8; border: 1px solid #1a1a1a; border-bottom-left-radius: 4px; }
  .msg.bot code { background: #050505; color: #6ab5ff; padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .msg.bot pre { background: #050505; border: 1px solid #1a1a1a; padding: 12px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; overflow-x: auto; margin: 8px 0; color: #bbb; white-space: pre; }
  .typing { align-self: flex-start; background: #0f0f0f; border: 1px solid #1a1a1a; padding: 14px 18px; border-radius: 14px; display: flex; gap: 4px; }
  .typing span { width: 6px; height: 6px; background: #555; border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
  .input-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,5,5,.95); backdrop-filter: blur(20px); border-top: 1px solid #141414; padding: 12px 16px 20px; z-index: 100; }
  .input-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .input-wrap { flex: 1; background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 22px; display: flex; align-items: flex-end; padding: 6px 6px 6px 16px; }
  .input-wrap:focus-within { border-color: #6ab5ff; }
  .input-wrap textarea { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; font-family: inherit; resize: none; padding: 8px 4px; max-height: 120px; line-height: 1.4; }
  .input-wrap textarea::placeholder { color: #555; }
  .send-btn { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #0a0a0a; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .send-btn:disabled { opacity: .3; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }
  @media (max-width: 520px) { .quick-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="head-icon">🔍</div>
    <div>
      <h1>Debug AI</h1>
      <p>Taip bug, AI akan diagnose & bagi fix</p>
    </div>
  </div>

  <div class="ctx-toggle" onclick="toggleCtx()">
    <span>📋 Paste error / console log (optional)</span>
    <span id="ctxArrow">▼</span>
  </div>
  <div class="ctx-panel" id="ctxPanel">
    <textarea id="ctxInput" placeholder="Paste error message, console log, atau apa-apa context..."></textarea>
  </div>

  <div class="quick-title">Quick Diagnosis</div>
  <div class="quick-grid">
    <button class="quick-btn" data-msg="CS chatbot tak reply langsung kat website."><span>💬</span> CS tak reply</button>
    <button class="quick-btn" data-msg="Email tak masuk walaupun page tunjuk berjaya."><span>📧</span> Email tak sampai</button>
    <button class="quick-btn" data-msg="Button tak boleh tekan kat page."><span>🖱️</span> Button tak function</button>
    <button class="quick-btn" data-msg="Page nampak pecah / layout rosak."><span>🎨</span> Layout pecah</button>
    <button class="quick-btn" data-msg="Error 401 Unauthorized bila login."><span>🔐</span> 401 Unauthorized</button>
    <button class="quick-btn" data-msg="Update tak muncul walaupun deployment success."><span>🔄</span> Cache issue</button>
  </div>

  <div class="chat" id="chat"></div>
</div>

<div class="input-bar">
  <div class="input-inner">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Taip bug yang kau jumpa..."></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </button>
    </div>
  </div>
</div>

<script>
var $ = function(id) { return document.getElementById(id); };
var history = [];
var capturedErrors = [];

window.addEventListener('error', function(e) {
  capturedErrors.push('[Error] ' + e.message + ' @ ' + (e.filename || '?') + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', function(e) {
  capturedErrors.push('[Promise] ' + ((e.reason && e.reason.message) || e.reason));
});

function toggleCtx() {
  $('ctxPanel').classList.toggle('open');
  $('ctxArrow').textContent = $('ctxPanel').classList.contains('open') ? '▲' : '▼';
}

function addMsg(text, who) {
  var el = document.createElement('div');
  el.className = 'msg ' + who;
  var html = String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre>$2</pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  el.innerHTML = html;
  $('chat').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return el;
}

function showTyping() {
  var el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  $('chat').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function hideTyping() {
  var el = $('typing');
  if (el) el.parentNode.removeChild(el);
}

function send(msg) {
  if (!msg || !msg.trim()) return;
  msg = msg.trim();

  addMsg(msg, 'user');
  history.push({ role: 'user', content: msg });
  $('input').value = '';
  $('input').style.height = 'auto';
  $('sendBtn').disabled = true;
  showTyping();

  var context = $('ctxInput').value.trim();
  if (capturedErrors.length) {
    context += '\n\nCaptured errors:\n' + capturedErrors.slice(-5).join('\n');
  }

  fetch('/api/debug-ai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: msg,
      context: context || undefined,
      history: history.slice(0, -1)
    })
  })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      hideTyping();
      if (data.ok) {
        addMsg(data.reply, 'bot');
        history.push({ role: 'assistant', content: data.reply });
      } else {
        addMsg('❌ Error: ' + (data.error || 'Unknown'), 'bot');
      }
    })
    .catch(function(e) {
      hideTyping();
      addMsg('❌ Network error: ' + e.message, 'bot');
    })
    .then(function() {
      $('sendBtn').disabled = false;
    });
}

$('sendBtn').addEventListener('click', function() { send($('input').value); });
$('input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send($('input').value);
  }
});
$('input').addEventListener('input', function() {
  $('input').style.height = 'auto';
  $('input').style.height = Math.min($('input').scrollHeight, 120) + 'px';
});

document.querySelectorAll('.quick-btn').forEach(function(btn) {
  btn.addEventListener('click', function() { send(btn.dataset.msg); });
});

addMsg('Hai 👋 Aku Debug AI. Taip bug yang kau jumpa, atau tekan quick diagnosis kat atas.', 'bot');
</script>
</body>
</html>
