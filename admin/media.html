<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Library — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js"></script>
</head>
<body class="admin-body">
<div id="adminLayout"></div>
<main class="admin-main" id="adminMain">
  <p style="color:#888;font-size:13px;">Loading...</p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const config = { apiKey:"AIzaSyC-AJp-CHodVdfHBGiAHTFHSBWYZh3p44k", authDomain:"fikri-2a880.firebaseapp.com", databaseURL:"https://fikri-2a880-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"fikri-2a880", storageBucket:"fikri-2a880.firebasestorage.app", messagingSenderId:"844408547984", appId:"1:844408547984:web:63336207d709bb9f090615" };
const app = initializeApp(config);
const auth = getAuth(app);
const db = getDatabase(app);

document.getElementById('adminLayout').innerHTML = window.renderAdminLayout('media', 'Media Library');

let allMedia = [];
let search = '';

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  document.getElementById('adminUserName').textContent = user.displayName || 'Admin';
  document.getElementById('adminUserEmail').textContent = user.email;
  document.getElementById('adminAvatar').textContent = (user.displayName || 'A').charAt(0).toUpperCase();
  document.getElementById('adminLogoutBtn').onclick = async () => {
    await signOut(auth); window.location.href = 'index.html';
  };
  document.getElementById('adminMenuToggle').onclick = () => document.getElementById('adminSidebar').classList.toggle('open');
  loadMedia();
});

function loadMedia() {
  onValue(ref(db, 'media'), (snap) => {
    const data = snap.val() || {};
    allMedia = Object.entries(data).map(([id, m]) => ({ id, ...m })).sort((a, b) => (b.date || 0) - (a.date || 0));
    renderMedia();
  });
}

function renderMedia() {
  const main = document.getElementById('adminMain');
  let filtered = allMedia;
  if (search) filtered = filtered.filter(m => (m.name||'').toLowerCase().includes(search) || (m.url||'').toLowerCase().includes(search));

  main.innerHTML = `
    <div class="admin-page-header">
      <div><h2>Media Library</h2><p>${allMedia.length} item · Simpan URL gambar untuk senang guna</p></div>
      <button onclick="openAddModal()" class="btn-primary" style="padding:10px 18px;border-radius:10px;background:#E31E24;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;">+ Tambah URL</button>
    </div>
    <div class="admin-toolbar">
      <input type="text" id="searchInput" class="admin-search-input" placeholder="🔍 Cari nama atau URL..." value="${search}">
    </div>
    ${filtered.length === 0 ? `
      <div class="admin-empty">${window.adminIcon('image')}<h3>Belum ada media</h3><p>Simpan URL gambar untuk kegunaan content.</p></div>
    ` : `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;">
        ${filtered.map(m => `
          <div class="admin-card" style="padding:0;overflow:hidden;">
            <div style="aspect-ratio:16/10;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;">
              <img src="${m.url}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=color:#ccc;font-size:32px>🖼</span>';">
            </div>
            <div style="padding:12px;">
              <div style="font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.name || 'Tanpa Nama'}</div>
              <div style="font-size:10px;color:#888;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.url}</div>
              <div style="display:flex;gap:6px;margin-top:10px;">
                <button onclick="copyUrl('${m.url.replace(/'/g, "\\'")}')" style="flex:1;padding:6px;border-radius:6px;background:#f5f5f5;border:none;font-size:11px;font-weight:600;cursor:pointer;">Copy</button>
                <button onclick="deleteMedia('${m.id}')" style="padding:6px 10px;border-radius:6px;background:rgba(227,30,36,0.1);color:#E31E24;border:none;font-size:11px;font-weight:600;cursor:pointer;">🗑</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `}
  `;
  document.getElementById('searchInput')?.addEventListener('input', (e) => { search = e.target.value.toLowerCase(); renderMedia(); });
}

window.openAddModal = () => {
  const name = prompt('Nama media (contoh: Banner Hero):');
  if (!name) return;
  const url = prompt('URL gambar (contoh: https://i.postimg.cc/xxx.jpg):');
  if (!url) return;
  push(ref(db, 'media'), { name, url, date: Date.now(), uid: auth.currentUser.uid })
    .then(() => window.adminToast('Media ditambah', 'success'))
    .catch(err => window.adminToast('Ralat: ' + err.message, 'error'));
};

window.copyUrl = (url) => {
  navigator.clipboard.writeText(url).then(() => window.adminToast('URL dicopy!', 'success'));
};

window.deleteMedia = async (id) => {
  if (!confirm('Padam media ini?')) return;
  try { await remove(ref(db, 'media/' + id)); window.adminToast('Media dipadam', 'success'); }
  catch (err) { window.adminToast('Ralat: ' + err.message, 'error'); }
};
</script>
</body>
</html>
