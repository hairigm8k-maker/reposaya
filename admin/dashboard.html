<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-wrap">
  <div class="admin-header">
    <div>
      <h1>Dashboard</h1>
      <p id="userEmail">—</p>
    </div>
    <button id="logoutBtn" class="btn-danger">Log Keluar</button>
  </div>

  <div class="admin-nav">
    <a href="dashboard.html" class="active">Artikel</a>
    <a href="sections.html">Sections</a>
    <a href="settings.html">Settings</a>
    <a href="../index.html" target="_blank">Lihat Website ↗</a>
  </div>

  <div class="admin-actions">
    <button onclick="newArticle()" class="btn-primary">+ Artikel Baru</button>
  </div>

  <div id="articlesList" class="articles-list">
    <p class="loading">Loading...</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const config = { apiKey:"AIzaSyC-AJp-CHodVdfHBGiAHTFHSBWYZh3p44k", authDomain:"fikri-2a880.firebaseapp.com", databaseURL:"https://fikri-2a880-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"fikri-2a880", storageBucket:"fikri-2a880.firebasestorage.app", messagingSenderId:"844408547984", appId:"1:844408547984:web:63336207d709bb9f090615" };
const app = initializeApp(config);
const auth = getAuth(app);
const db = getDatabase(app);

let user = null;

onAuthStateChanged(auth, (u) => {
  if (!u) { window.location.href = 'index.html'; return; }
  user = u;
  document.getElementById('userEmail').textContent = u.email;
  loadArticles();
});

document.getElementById('logoutBtn').onclick = async () => {
  await signOut(auth);
  window.location.href = 'index.html';
};

function loadArticles() {
  const list = document.getElementById('articlesList');
  onValue(ref(db, 'articles'), (snap) => {
    const data = snap.val();
    if (!data) { list.innerHTML = '<p class="empty">Belum ada artikel. Klik "+ Artikel Baru" untuk mula.</p>'; return; }

    const articles = Object.entries(data).map(([id, a]) => ({ id, ...a }));
    articles.sort((a, b) => (b.date || 0) - (a.date || 0));

    list.innerHTML = articles.map(a => `
      <div class="article-item">
        <div class="article-info">
          <h3>${a.title || 'Tanpa Tajuk'}</h3>
          <div class="article-meta">
            <span class="status ${a.published ? 'published' : 'draft'}">${a.published ? 'Published' : 'Draft'}</span>
            <span>${a.date ? new Date(a.date).toLocaleDateString('ms-MY') : '—'}</span>
            <span class="lang-tag">${(a.lang || 'bm').toUpperCase()}</span>
          </div>
        </div>
        <div class="article-actions">
          <a href="edit.html?id=${a.id}" class="btn-sm">Edit</a>
          <button onclick="deleteArticle('${a.id}', '${(a.title || '').replace(/'/g, "\\'")}')" class="btn-sm btn-danger">Padam</button>
        </div>
      </div>
    `).join('');
  });
}

window.newArticle = () => window.location.href = 'edit.html';

window.deleteArticle = async (id, title) => {
  if (!confirm(`Padam artikel "${title}"?`)) return;
  try {
    await remove(ref(db, 'articles/' + id));
  } catch (e) { alert('Gagal padam: ' + e.message); }
};
</script>
</body>
</html>
