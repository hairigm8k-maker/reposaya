<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sections — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="admin-wrap">
  <div class="admin-header">
    <div>
      <h1>Edit Sections</h1>
      <p><a href="dashboard.html" style="color:#888;text-decoration:none;font-size:13px;">← Balik Dashboard</a></p>
    </div>
    <button id="saveBtn" class="btn-primary">Simpan Semua</button>
  </div>

  <div class="lang-tabs">
    <button class="lang-tab active" data-lang="bm" onclick="switchLang('bm')">🇲🇾 BM</button>
    <button class="lang-tab" data-lang="en" onclick="switchLang('en')">🇬🇧 EN</button>
  </div>

  <p id="msg" class="msg"></p>

  <div class="section-group">
    <h2>🔔 Alert Bar</h2>
    <label>Alert Text</label>
    <input type="text" id="alertBar" placeholder="Website ini baru dilancarkan...">
  </div>

  <div class="section-group">
    <h2>🚀 Hero</h2>
    <label>Headline Line 1</label>
    <input type="text" id="heroLine1" placeholder="NAK BUAT">
    <label>Headline Line 2</label>
    <input type="text" id="heroLine2" placeholder="LANDING PAGE?">
    <label>Harga (format: RM99 SAHAJA)</label>
    <input type="text" id="heroPrice" placeholder="RM99 SAHAJA">
  </div>

  <div class="section-group">
    <h2>⭐ Kredibiliti</h2>
    <label>Ayat</label>
    <textarea id="kredibiliti" rows="2"></textarea>
  </div>

  <div class="section-group">
    <h2>✅ Bantu</h2>
    <label>Tajuk (pisah baris guna "|")</label>
    <input type="text" id="bantuTitle" placeholder="JADIKAN PERNIAGAAN ANDA|LEBIH DIPERCAYAI">
    <label>List (satu per line)</label>
    <textarea id="bantuItems" rows="6" placeholder="Item 1&#10;Item 2&#10;Item 3"></textarea>
  </div>

  <div class="section-group">
    <h2>🎬 Video</h2>
    <label>Video URL</label>
    <input type="url" id="videoUrl" placeholder="https://... atau assets/video/videohero.mp4">
  </div>

  <div class="section-group">
    <h2>💰 Pakej</h2>
    <label>Tajuk</label>
    <input type="text" id="pakejTitle" placeholder="RM99 — ALL IN">
    <label>List (satu per line)</label>
    <textarea id="pakejItems" rows="10"></textarea>
    <label>Note</label>
    <input type="text" id="pakejNote" placeholder="Tiada kos tersembunyi. Semua dalam RM99.">
    <label>CTA Text</label>
    <input type="text" id="pakejCtaText" placeholder="Tempah Sekarang">
    <label>CTA URL</label>
    <input type="url" id="pakejCtaUrl" placeholder="https://wa.me/60172131814">
  </div>

  <div class="section-group">
    <h2>💬 Feedback</h2>
    <label>Tajuk</label>
    <input type="text" id="feedbackTitle" placeholder="Hantar Maklum Balas">
    <label>Subtitle</label>
    <input type="text" id="feedbackSub" placeholder="Pendapat anda membantu kami tingkatkan servis.">
  </div>

  <div class="section-group">
    <h2>📰 Blog Teaser</h2>
    <label>Tajuk</label>
    <input type="text" id="blogTeaserTitle" placeholder="Artikel Terkini">
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const config = { apiKey:"AIzaSyC-AJp-CHodVdfHBGiAHTFHSBWYZh3p44k", authDomain:"fikri-2a880.firebaseapp.com", databaseURL:"https://fikri-2a880-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"fikri-2a880", storageBucket:"fikri-2a880.firebasestorage.app", messagingSenderId:"844408547984", appId:"1:844408547984:web:63336207d709bb9f090615" };
const app = initializeApp(config);
const auth = getAuth(app);
const db = getDatabase(app);

let currentLang = 'bm';
let cache = { bm: {}, en: {} };

const FIELDS = ['alertBar','heroLine1','heroLine2','heroPrice','kredibiliti','bantuTitle','videoUrl','pakejTitle','pakejNote','pakejCtaText','pakejCtaUrl','feedbackTitle','feedbackSub','blogTeaserTitle'];
const LIST_FIELDS = { bantuItems: 'bantuItems', pakejItems: 'pakejItems' };

onAuthStateChanged(auth, async (u) => {
  if (!u) { window.location.href = 'index.html'; return; }
  await loadLang('bm');
  await loadLang('en');
  renderForm('bm');
});

async function loadLang(lang) {
  const snap = await get(ref(db, 'sections/' + lang));
  cache[lang] = snap.val() || {};
}

function renderForm(lang) {
  const data = cache[lang] || {};
  FIELDS.forEach(f => {
    const el = document.getElementById(f);
    if (el) el.value = data[f] || '';
  });
  // List fields — convert array to newline
  Object.keys(LIST_FIELDS).forEach(f => {
    const el = document.getElementById(f);
    if (el) el.value = (data[f] || []).join('\n');
  });
}

window.switchLang = (lang) => {
  // Save current sebelum tukar
  collectForm(currentLang);
  currentLang = lang;
  document.querySelectorAll('.lang-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.lang === lang);
  });
  renderForm(lang);
};

function collectForm(lang) {
  const data = cache[lang] || {};
  FIELDS.forEach(f => {
    const el = document.getElementById(f);
    if (el) data[f] = el.value.trim();
  });
  Object.keys(LIST_FIELDS).forEach(f => {
    const el = document.getElementById(f);
    if (el) data[f] = el.value.split('\n').map(l => l.trim()).filter(Boolean);
  });
  cache[lang] = data;
}

document.getElementById('saveBtn').onclick = async () => {
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  collectForm(currentLang);

  try {
    await set(ref(db, 'sections/bm'), cache.bm);
    await set(ref(db, 'sections/en'), cache.en);
    msg.textContent = '✅ Semua section disimpan!';
    msg.style.color = '#38a169';
  } catch (err) {
    msg.textContent = 'Ralat: ' + err.message;
    msg.style.color = '#e53e3e';
  }
  btn.disabled = false;
  btn.textContent = 'Simpan Semua';
};
</script>
</body>
</html>
