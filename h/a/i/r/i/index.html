<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#faf9f5">
<title>Mailer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #cc785c;
    --primary-active: #a9583e;
    --primary-disabled: #e6dfd8;
    --ink: #141413;
    --body: #3d3d3a;
    --body-strong: #252523;
    --muted: #6c6a64;
    --muted-soft: #8e8b82;
    --hairline: #e6dfd8;
    --hairline-soft: #ebe6df;
    --canvas: #faf9f5;
    --surface-soft: #f5f0e8;
    --surface-card: #efe9de;
    --surface-cream-strong: #e8e0d2;
    --surface-dark: #181715;
    --surface-dark-elevated: #252320;
    --surface-dark-soft: #1f1e1b;
    --on-primary: #ffffff;
    --on-dark: #faf9f5;
    --on-dark-soft: #a09d96;
    --success: #5db872;
    --error: #c64545;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
  }

  html, body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.55;
  }

  .display-font {
    font-family: 'Cormorant Garamond', 'Tiempos Headline', Garamond, serif;
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .code-font {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  /* TOP NAV */
  .top-nav {
    height: 64px;
    background: var(--canvas);
    border-bottom: 1px solid var(--hairline-soft);
    display: flex;
    align-items: center;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
    background: rgba(250, 249, 245, 0.9);
  }

  .nav-inner {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
  }

  .brand-mark {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-mark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .brand-sub {
    color: var(--muted);
    font-size: 14px;
    margin-left: 8px;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .nav-link {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    transition: color .15s ease;
  }

  .nav-link:hover { color: var(--ink); }

  /* CONTAINER */
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  /* HERO */
  .hero {
    padding-bottom: 48px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 48px;
  }

  .hero-eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 16px;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', 'Tiempos Headline', Garamond, serif;
    font-weight: 500;
    font-size: 48px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .hero-sub {
    font-size: 16px;
    color: var(--body);
    line-height: 1.55;
    max-width: 540px;
  }

  /* AUTH */
  .auth-panel {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-xl);
    padding: 48px 40px;
    text-align: center;
    max-width: 440px;
    margin: 32px auto;
  }

  .auth-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: var(--surface-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--primary);
  }

  .auth-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .auth-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--surface-soft);
    border-radius: var(--radius-md);
    margin-bottom: 32px;
    width: fit-content;
  }

  .tab {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 8px 20px;
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    transition: all .15s ease;
  }

  .tab.active {
    background: var(--canvas);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(20,20,19,0.05);
  }

  /* Section visibility toggle */
  .section { display: none; }
  .section.active { display: block; }

  /* PANELS */
  .panel {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    padding: 32px;
    margin-bottom: 20px;
  }

  .panel.dark {
    background: var(--surface-dark);
    border-color: var(--surface-dark);
    color: var(--on-dark);
  }

  .panel.dark .field-label,
  .panel.dark .section-label {
    color: var(--on-dark-soft);
  }

  .section-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* FIELDS */
  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }

  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"],
  textarea {
    width: 100%;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-family: inherit;
    transition: all .15s ease;
    -webkit-appearance: none;
    outline: none;
  }

  input:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(204, 120, 92, 0.15);
  }

  input::placeholder, textarea::placeholder {
    color: var(--muted-soft);
  }

  textarea {
    resize: vertical;
    min-height: 120px;
    line-height: 1.55;
    padding: 12px 14px;
  }

  textarea.code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 260px;
    background: var(--surface-dark);
    color: var(--on-dark-soft);
    border-color: var(--surface-dark);
  }

  textarea.code:focus {
    border-color: var(--primary);
  }

  .panel.dark input[type="text"],
  .panel.dark input[type="email"] {
    background: var(--surface-dark-elevated);
    border-color: var(--surface-dark-elevated);
    color: var(--on-dark);
  }

  .panel.dark input::placeholder {
    color: var(--on-dark-soft);
  }

  /* BUTTONS */
  .btn {
    width: 100%;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    padding: 12px 20px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 40px;
    line-height: 1;
  }

  .btn:hover { background: var(--primary-active); }
  .btn:disabled { background: var(--primary-disabled); color: var(--muted); cursor: not-allowed; }

  .btn.secondary {
    background: var(--canvas);
    color: var(--ink);
    border: 1px solid var(--hairline);
  }

  .btn.secondary:hover {
    background: var(--surface-soft);
    border-color: var(--hairline);
  }

  .btn.ghost {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 8px 12px;
    height: auto;
    width: auto;
    font-size: 13px;
  }

  .btn.ghost:hover { color: var(--ink); background: transparent; }

  .btn-mini {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    color: var(--ink);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
  }

  .btn-mini:hover {
    background: var(--surface-soft);
  }

  /* SPINNER */
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: var(--on-primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* STATUS */
  .status {
    padding: 14px 18px;
    border-radius: var(--radius-md);
    font-size: 14px;
    margin-bottom: 24px;
    display: none;
    line-height: 1.5;
  }
  .status.show { display: block; }
  .status.success {
    background: rgba(93, 184, 114, 0.1);
    border: 1px solid rgba(93, 184, 114, 0.25);
    color: #3a7d4a;
  }
  .status.error {
    background: rgba(198, 69, 69, 0.08);
    border: 1px solid rgba(198, 69, 69, 0.2);
    color: var(--error);
  }

  /* RECIPIENT ROWS */
  .recipients-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .recipient-row {
    display: grid;
    grid-template-columns: 1.4fr 2fr 1fr 32px;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }

  .recipient-row input {
    padding: 10px 14px;
    font-size: 14px;
    height: 40px;
  }

  .recipient-remove {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--muted);
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s ease;
    font-family: inherit;
    padding: 0;
    line-height: 1;
  }

  .recipient-remove:hover {
    border-color: var(--error);
    color: var(--error);
  }

  /* PREVIEW */
  .preview-frame {
    background: #ffffff;
    border-radius: var(--radius-md);
    padding: 20px;
    max-height: 440px;
    overflow-y: auto;
    border: 1px solid var(--hairline-soft);
  }
  .preview-frame * { max-width: 100% !important; }

  /* PROGRESS */
  .progress-bar {
    width: 100%;
    height: 3px;
    background: rgba(250, 249, 245, 0.1);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    transition: width .4s ease;
    width: 0%;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat {
    background: var(--surface-dark-elevated);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: center;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--on-dark-soft);
    margin-bottom: 8px;
  }

  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--on-dark);
    line-height: 1;
  }

  .stat-value.green { color: var(--success); }
  .stat-value.red { color: #e57373; }

  .log-list {
    max-height: 280px;
    overflow-y: auto;
    background: var(--surface-dark-soft);
    border-radius: var(--radius-md);
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--on-dark-soft);
  }

  .log-item {
    padding: 6px 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid rgba(250, 249, 245, 0.05);
  }

  .log-item:last-child { border-bottom: none; }
  .log-ok { color: var(--success); }
  .log-fail { color: #e57373; }

  .hidden { display: none !important; }

  /* CHECKBOX */
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .checkbox-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
  }

  .checkbox-row label {
    font-size: 14px;
    color: var(--body);
    cursor: pointer;
    user-select: none;
  }

  /* FILE INPUT */
  input[type="file"] {
    width: 100%;
    background: var(--surface-soft);
    border: 1px dashed var(--hairline);
    color: var(--muted);
    padding: 14px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s ease;
  }

  input[type="file"]:hover {
    background: var(--surface-card);
    border-color: var(--primary);
  }

  .file-list {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
  }

  /* FOOTER */
  .footer {
    padding: 32px 0 0;
    margin-top: 64px;
    border-top: 1px solid var(--hairline);
    text-align: center;
    font-size: 13px;
    color: var(--muted-soft);
    line-height: 1.6;
  }

  /* MOBILE */
  @media (max-width: 640px) {
    .top-nav { padding: 0 16px; }
    .container { padding: 40px 16px 64px; }
    .hero-title { font-size: 34px; }
    .panel { padding: 24px 20px; }
    .auth-panel { padding: 36px 24px; }
    .recipient-row {
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "name email" "price remove";
      gap: 8px;
    }
    .recipient-row input:nth-child(1) { grid-area: name; }
    .recipient-row input:nth-child(2) { grid-area: email; }
    .recipient-row input:nth-child(3) { grid-area: price; }
    .recipient-remove { grid-area: remove; justify-self: end; }
    .stats-grid { gap: 10px; }
    .stat { padding: 12px; }
    .stat-value { font-size: 24px; }
    .brand-sub { display: none; }
  }
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="brand">
      <div class="brand-mark">
        <img src="/assets/logoUtama/logoUtama.png" alt="">
      </div>
      <span class="brand-name">hairiamri.buzz</span>
      <span class="brand-sub">/ Mailer</span>
    </div>
    <div class="nav-right">
      <button class="nav-link hidden" id="logoutBtn">Sign out</button>
    </div>
  </div>
</nav>

<div class="container">

  <div class="hero" id="heroSection">
    <div class="hero-eyebrow">Mailer</div>
    <h1 class="hero-title">Send with intention.</h1>
    <p class="hero-sub">Personalized email delivery powered by feedback@hairiamri.buzz</p>
  </div>

  <!-- AUTH -->
  <div class="auth-panel" id="authBox">
    <div class="auth-icon">🔒</div>
    <div class="auth-title">Restricted Access</div>
    <div class="auth-sub">Enter your access token to continue</div>
    <div class="field">
      <input type="password" id="tokenInput" placeholder="Access token" autocomplete="off" style="text-align:center;letter-spacing:2px;">
    </div>
    <button class="btn" id="authBtn">Continue</button>
  </div>

  <!-- MAIN -->
  <div id="mainPanel" class="hidden">

    <div class="tabs">
      <button class="tab active" data-tab="single">Single</button>
      <button class="tab" data-tab="bulk">Bulk</button>
    </div>

    <div class="status" id="statusBox"></div>

    <!-- SINGLE -->
    <div class="section active" id="section-single">
      <div class="panel">
        <div class="section-label">Message</div>

        <div class="field">
          <label class="field-label">To</label>
          <input type="text" id="toInput" placeholder="recipient@example.com">
        </div>

        <div class="field">
          <label class="field-label">CC</label>
          <input type="text" id="ccInput" placeholder="optional">
        </div>

        <div class="field">
          <label class="field-label">Subject</label>
          <input type="text" id="subjectInput" placeholder="Your subject line">
        </div>

        <div class="field">
          <label class="field-label">Body</label>
          <textarea id="bodyInput" placeholder="Write your message..."></textarea>
        </div>

        <div class="field">
          <label class="field-label">Attachment</label>
          <input type="file" id="fileInput" multiple>
          <div class="file-list" id="fileList"></div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="htmlMode">
          <label for="htmlMode">Send as HTML</label>
        </div>

        <button class="btn" id="sendBtn"><span id="sendText">Send email</span></button>
      </div>
    </div>

    <!-- BULK -->
    <div class="section" id="section-bulk">
      <div class="panel">
        <div class="recipients-header">
          <div class="section-label" style="margin:0;">Recipients</div>
          <button class="btn-mini" onclick="addRecipientRow()">+ Add recipient</button>
        </div>
        <div id="recipientsList"></div>
      </div>

      <div class="panel">
        <div class="section-label">Compose</div>
        <div class="field">
          <label class="field-label">Template</label>
          <select id="templatePicker" style="width:100%;background:var(--canvas);border:1px solid var(--hairline);color:var(--ink);padding:10px 14px;border-radius:var(--radius-md);font-size:15px;font-family:inherit;cursor:pointer;outline:none;">
            <option value="">— Pilih template —</option>
            <option value="thankyou">Terima Kasih</option>
            <option value="invoice">Invoice / Order</option>
            <option value="reminder">Reminder</option>
            <option value="welcome">Welcome / Onboarding</option>
            <option value="blank">Blank (kosong)</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Subject</label>
          <input type="text" id="bulkSubject" value="Terima kasih, {nama}! 🌸">
        </div>
        <div class="field">
          <label class="field-label">Body (HTML)</label>
          <textarea class="code" id="bulkBody"></textarea>
        </div>
      </div>

      <div class="panel">
        <div class="section-label">Preview</div>
        <div class="preview-frame" id="previewBox"></div>
      </div>

      <button class="btn" id="bulkSendBtn"><span id="bulkText">Send to all</span></button>

      <div class="panel dark hidden" id="progressCard" style="margin-top:20px;">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="stats-grid">
          <div class="stat">
            <div class="stat-label">Total</div>
            <div class="stat-value" id="statTotal">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Sent</div>
            <div class="stat-value green" id="statOk">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Failed</div>
            <div class="stat-value red" id="statFail">0</div>
          </div>
        </div>
        <div class="log-list" id="logList"></div>
      </div>
    </div>

  </div>

  <div class="footer">
    Internal · feedback@hairiamri.buzz
  </div>

</div>

<script>
window.onerror = function(msg, url, line) {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c64545;color:#fff;padding:14px;font-family:monospace;font-size:12px;z-index:99999;word-break:break-word;';
  box.textContent = 'Error: ' + msg + ' @ L' + line;
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 15000);
};

const $ = id => document.getElementById(id);
const TOKEN_KEY = 'mailer_token';

// ============ TEMPLATES ============
const HEADER_HTML = `<tr>

// ============ AUTH ============
function loadToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function saveToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function showMain() {
  $('authBox').classList.add('hidden');
  $('mainPanel').classList.remove('hidden');
  $('logoutBtn').classList.remove('hidden');
}
function showAuth() {
  $('authBox').classList.remove('hidden');
  $('mainPanel').classList.add('hidden');
  $('logoutBtn').classList.add('hidden');
}

if (loadToken()) showMain(); else showAuth();

$('authBtn').addEventListener('click', () => {
  const t = $('tokenInput').value.trim();
  if (!t) return;
  saveToken(t);
  showMain();
});
$('tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('authBtn').click(); });
$('logoutBtn').addEventListener('click', () => {
  clearToken(); showAuth(); $('tokenInput').value = '';
});

// ============ TABS ============
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    $('section-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'bulk') {
      const bb = $('bulkBody');
      if (bb && !bb.value) bb.value = DEFAULT_HTML;
      setTimeout(updatePreview, 50);
    }
  });
});

// ============ STATUS ============
function showStatus(type, msg) {
  const box = $('statusBox');
  box.className = 'status show ' + type;
  box.textContent = msg;
  setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}
function hideStatus() { $('statusBox').classList.remove('show'); }

// ============ SEND ============
async function sendEmail(payload) {
  const token = loadToken();
  if (!token) { showAuth(); throw new Error('No token'); }

  const res = await fetch('/api/send-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
    body: JSON.stringify(payload)
  });
  const data = await res.json();

  if (res.status === 401) { clearToken(); showAuth(); throw new Error('Unauthorized'); }
  if (!data.ok) throw new Error(data.error || data.details?.message || 'Failed');
  return data;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      resolve({ filename: file.name, content: base64 });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

$('fileInput').addEventListener('change', () => {
  const files = $('fileInput').files;
  const list = $('fileList');
  if (!files.length) { list.innerHTML = ''; return; }
  let total = 0;
  let html = '';
  for (const f of files) {
    total += f.size;
    html += `${f.name} <span style="color:var(--muted-soft);">(${(f.size/1024).toFixed(1)} KB)</span><br>`;
  }
  html += `<div style="margin-top:8px;color:${total > 40*1024*1024 ? 'var(--error)' : 'var(--muted-soft)'};font-size:12px;">Total: ${(total/1024/1024).toFixed(2)} MB</div>`;
  list.innerHTML = html;
});

$('sendBtn').addEventListener('click', async () => {
  const to = $('toInput').value.trim();
  const cc = $('ccInput').value.trim();
  const subject = $('subjectInput').value.trim();
  const body = $('bodyInput').value;
  const html = $('htmlMode').checked;
  const files = $('fileInput').files;

  if (!to || !subject || !body) return showStatus('error', 'Please fill in all required fields');

  hideStatus();
  const btn = $('sendBtn'), txt = $('sendText');
  btn.disabled = true;
  txt.innerHTML = '<span class="spinner"></span> Sending';

  try {
    let attachments;
    if (files.length) {
      txt.innerHTML = '<span class="spinner"></span> Attaching';
      attachments = await Promise.all(Array.from(files).map(fileToBase64));
    }

    txt.innerHTML = '<span class="spinner"></span> Sending';
    const r = await sendEmail({ to, cc: cc || undefined, subject, body, html, attachments });
    showStatus('success', '✓ ' + (r.message || 'Email sent successfully'));
  } catch (e) {
    showStatus('error', '✕ ' + e.message);
  }
  btn.disabled = false;
  txt.textContent = 'Send email';
});

// ============ BULK ============
let recipientCounter = 0;

function createRecipientRow(name = '', email = '', price = '') {
  const id = 'r' + (++recipientCounter);
  const row = document.createElement('div');
  row.className = 'recipient-row';
  row.dataset.id = id;
  row.innerHTML = `
    <input type="text" placeholder="Name" value="${escapeAttr(name)}" data-field="name">
    <input type="email" placeholder="Email" value="${escapeAttr(email)}" data-field="email">
    <input type="text" placeholder="RM" value="${escapeAttr(price)}" data-field="price">
    <button class="recipient-remove" onclick="removeRecipientRow('${id}')">✕</button>
  `;
  row.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updatePreview));
  return row;
}

function addRecipientRow(name = '', email = '', price = '') {
  const list = $('recipientsList');
  list.appendChild(createRecipientRow(name, email, price));
  updatePreview();
  list.lastChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  setTimeout(() => list.lastChild.querySelector('input').focus(), 100);
}

function removeRecipientRow(id) {
  const row = document.querySelector(`.recipient-row[data-id="${id}"]`);
  if (row) { row.remove(); updatePreview(); }
}

function getRecipients() {
  return Array.from(document.querySelectorAll('.recipient-row')).map(row => ({
    name: row.querySelector('[data-field="name"]').value.trim(),
    email: row.querySelector('[data-field="email"]').value.trim(),
    price: row.querySelector('[data-field="price"]').value.trim()
  })).filter(r => r.email);
}

function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function getPlaceholders(r) {
  const now = new Date();
  const tz = { timeZone: 'Asia/Kuala_Lumpur' };
  return {
    nama: r.name, name: r.name,
    email: r.email,
    harga: r.price, price: r.price,
    tarikh: now.toLocaleDateString('ms-MY', { ...tz, day: 'numeric', month: 'long', year: 'numeric' }),
    date: now.toLocaleDateString('ms-MY', { ...tz, day: 'numeric', month: 'long', year: 'numeric' }),
    masa: now.toLocaleTimeString('ms-MY', { ...tz, hour: '2-digit', minute: '2-digit' }),
    time: now.toLocaleTimeString('ms-MY', { ...tz, hour: '2-digit', minute: '2-digit' })
  };
}

function replacePlaceholders(text, r) {
  const p = getPlaceholders(r);
  return String(text).replace(/\{(\w+)\}/g, (m, k) => p[k.toLowerCase()] !== undefined ? p[k.toLowerCase()] : m);
}

function updatePreview() {
  const bodyEl = $('bulkBody');
  const previewEl = $('previewBox');
  if (!bodyEl || !previewEl) return;
  const recs = getRecipients();
  const first = recs[0] || { name: 'Ahmad', email: 'ahmad@example.com', price: '99' };
  previewEl.innerHTML = replacePlaceholders(bodyEl.value, first);
}

const bulkBodyEl = $('bulkBody');
if (bulkBodyEl) bulkBodyEl.addEventListener('input', updatePreview);

// Template picker
const tplPicker = $('templatePicker');
if (tplPicker) {
  tplPicker.addEventListener('change', (e) => {
    const key = e.target.value;
    if (!key) return;
    const tpl = TEMPLATES[key];
    if (!tpl) return;
    $('bulkSubject').value = tpl.subject || '';
    $('bulkBody').value = tpl.body || '';
    updatePreview();
    showStatus('success', '✓ Template dimuatkan: ' + e.target.options[e.target.selectedIndex].text);
    setTimeout(hideStatus, 2000);
  });
}

function initRecipients() {
  if (document.querySelectorAll('.recipient-row').length === 0) addRecipientRow();
}

$('bulkSendBtn').addEventListener('click', async () => {
  const recs = getRecipients();
  const subject = $('bulkSubject').value.trim();
  const body = $('bulkBody').value;

  if (!recs.length) return showStatus('error', 'Add at least one recipient');
  if (!subject || !body) return showStatus('error', 'Subject and body are required');

  hideStatus();
  const btn = $('bulkSendBtn'), txt = $('bulkText');
  btn.disabled = true;
  txt.innerHTML = '<span class="spinner"></span> Sending';

  $('progressCard').classList.remove('hidden');
  $('logList').innerHTML = '';
  $('statTotal').textContent = recs.length;
  $('statOk').textContent = '0';
  $('statFail').textContent = '0';
  $('progressFill').style.width = '0%';

  let ok = 0, fail = 0;

  for (let i = 0; i < recs.length; i++) {
    const r = recs[i];
    const finalSubject = replacePlaceholders(subject, r);
    const finalBody = replacePlaceholders(body, r);

    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `<span>${r.name || r.email}</span><span>⋯</span>`;
    $('logList').appendChild(item);

    try {
      await sendEmail({ to: r.email, subject: finalSubject, body: finalBody, html: true });
      ok++;
      item.querySelector('span:last-child').innerHTML = '<span class="log-ok">✓</span>';
      $('statOk').textContent = ok;
    } catch (e) {
      fail++;
      const errMsg = (e && e.message) ? e.message : String(e);
      item.querySelector('span:last-child').innerHTML = `<span class="log-fail">✕</span>`;
      $('statFail').textContent = fail;
      const errBox = document.createElement('div');
      errBox.style.cssText = 'background:rgba(198,69,69,0.1);border:1px solid rgba(198,69,69,0.2);color:#e57373;padding:8px 10px;border-radius:6px;font-size:11px;margin-top:6px;font-family:monospace;word-break:break-word;white-space:pre-wrap;';
      errBox.textContent = r.email + '\n' + errMsg;
      $('logList').appendChild(errBox);
    }

    $('progressFill').style.width = ((i + 1) / recs.length * 100) + '%';
    $('logList').scrollTop = $('logList').scrollHeight;

    if (i < recs.length - 1) await new Promise(r => setTimeout(r, 600));
  }

  btn.disabled = false;
  txt.textContent = 'Send to all';
  showStatus(ok > 0 ? 'success' : 'error', `${ok} sent · ${fail} failed`);
});

const initBulkBody = $('bulkBody');
if (initBulkBody && !initBulkBody.value) initBulkBody.value = DEFAULT_HTML;
initRecipients();
updatePreview();
